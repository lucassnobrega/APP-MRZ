function saveNewUser(){
  const name=(document.getElementById('nu-name').value||'').trim();
  const role=(document.getElementById('nu-role').value||'').trim();
  const username=(document.getElementById('nu-email').value||'').trim().toLowerCase().replace(/\s+/g,'');
  const pwd=document.getElementById('nu-pwd').value||'';
  const color=document.getElementById('nu-color').value;
  const isLeaderVal=document.getElementById('nu-leader').value==='1';
  const errEl=document.getElementById('nu-err');
  if(!name){errEl.textContent='Nome obrigatório.';return;}
  if(!username||username.length<2){errEl.textContent='Usuário de login obrigatório (mín. 2 caracteres).';return;}
  if(pwd.length<4){errEl.textContent='Senha mínima de 4 caracteres.';return;}
  // Checar username duplicado
  const usedNames=Object.entries(M).map(([k])=>[(S.usernames||{})[k]||k,k]).flat().map(x=>x.toLowerCase());
  if(usedNames.includes(username)){errEl.textContent='Usuário já está em uso.';return;}
  const id='u_'+Date.now().toString(36);
  const icon=name.split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'US';
  const newUser={id,name,role,email:'',color,icon,isLeader:isLeaderVal};
  if(!S.customUsers)S.customUsers=[];
  S.customUsers.push(newUser);
  // Salvar username de login
  if(!S.usernames)S.usernames={};
  S.usernames[id]=username;
  // Salvar senha
  if(!S.pins)S.pins={};
  S.pins[id]=pwdHash(pwd);
  // Se não é líder, definir permissões padrão (home, calendar, tasks, rotinas)
  if(!isLeaderVal){
    if(!S.userPerms)S.userPerms={};
    S.userPerms[id]=['home','calendar','tasks','rotinas','trilha','occ'];
  }
  syncCustomUsers();
  saveLocal();
  closeModal();
  toast(`Usuário ${name} criado!`);
  renderUsuarios();
}

  if(!username||username.length<2){errEl.textContent='Usuário deve ter ao menos 2 caracteres.';return;}
  // Checar duplicata em outros usuários
  const conflict=Object.entries(M).find(([k])=>{
    if(k===uid)return false;
    const custom=(S.usernames||{})[k]||k;
    return custom.toLowerCase()===username||k.toLowerCase()===username;
  });
  if(conflict){errEl.textContent='Este usuário já está em uso por outra pessoa.';return;}
  if(!S.usernames)S.usernames={};
  S.usernames[uid]=username;
  saveLocal();

  renderUsuarios();

function deleteCustomUser(uid){
  if(!confirm('Remover este usuário? Esta ação não pode ser desfeita.'))return;
  S.customUsers=(S.customUsers||[]).filter(u=>u.id!==uid);
  if(S.userPerms)delete S.userPerms[uid];
  if(S.pins)delete S.pins[uid];
  delete M[uid];
  saveLocal();
  toast('Usuário removido.');
  renderUsuarios();
}

};

function opIsGerente(userId){return Object.values(S.op?.gerentes||{}).includes(userId);}
function opLojaDoGerente(userId){return Object.entries(S.op?.gerentes||{}).find(([,v])=>v===userId)?.[0];}
function opGetLoja(id){return OP_LOJAS.find(l=>l.id===id);}
function opCanSeeAll(){return M[me]?.isLeader||me==='marcio';}

function renderOperacional(){
  if(!S.op)S.op={gerentes:{},funcionarios:[],tarefas:[],marketing:[],errosProcesso:[],manutencao:[]};
  if(!S.op.completions)S.op.completions={};
  if(!S.op.lojaConfig)S.op.lojaConfig={};
  const el=document.getElementById('p-operacional');if(!el)return;
  // LÍDER DE SETOR — painel exclusivo
  if(M[me]?.tipo==='setorLider'){renderOpSetorLider(el);return;}
  const isMarcio=me==='marcio';
  const isLdr=M[me]?.isLeader;
  const myLojaId=opLojaDoGerente(me);
  if(!isLdr&&!isMarcio&&!myLojaId){
    el.innerHTML='<div class="card" style="padding:24px;color:var(--muted);">Acesso restrito.</div>';return;
  }
  // Márcio / líderes → sidebar com seletor de loja (null = todas)
  // Gerentes → direto para a sua loja
  const lojaId=opCanSeeAll()?window._opLojaView:myLojaId;
  renderOpStore(el,lojaId||null,!!myLojaId&&!opCanSeeAll());
}

  const TIPO_COR={abertura:'#22d3ee',fechamento:'#f59e0b',geral:'#a78bfa','Manhã':'#22d3ee',Tarde:'#f59e0b',Noite:'#8b5cf6',Geral:'#a78bfa'};

      return`<div class="card" style="padding:16px;margin-bottom:8px;border-left:4px solid ${cor};cursor:${feito?'default':'pointer'};" ${feito?'':`onclick="opOpenExecutarChecklist('${lojaId}','${m.id}')"`}>

          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;">
              ${statusBadge}
              <span style="font-size:.9rem;font-weight:700;">${esc(m.nome)}</span>
            </div>
            <div style="font-size:.7rem;color:var(--muted);">${m.horarioLimite?`Limite: ${m.horarioLimite} · `:''}${(m.items||[]).length} itens</div>
          </div>
          ${!feito?`<button class="btn-gold btn-sm" onclick="event.stopPropagation();opOpenExecutarChecklist('${lojaId}','${m.id}')">Executar →</button>`:`<span style="font-size:.65rem;padding:2px 9px;border-radius:999px;background:#22c55e22;color:#22c55e;font-weight:700;">Feito</span>`}
        </div>
      </div>`;
    }).join('');
  const sugestoesHoje=(S.op.errosProcesso||[]).filter(e=>e.loja===lojaId&&e.setor===setor&&e.date===hoje);
  const sugestoesCards=sugestoesHoje.length
    ?sugestoesHoje.map(e=>`<div class="card" style="padding:10px 14px;margin-bottom:6px;border-left:3px solid ${e.tipo==='sugestao'?'#22d3ee':'#f87171'};">
      <div style="font-size:.74rem;font-weight:700;margin-bottom:2px;">${esc(e.titulo)}</div>
      ${e.desc?`<div style="font-size:.72rem;color:var(--muted);">${esc(e.desc.slice(0,120))}</div>`:''}
    </div>`).join('')
    :`<div style="font-size:.76rem;color:var(--muted);padding:6px 0;">Nenhum registro hoje.</div>`;
  const faqData=S.op.faq?.[lojaId]?.[setor]||{};
  const temFAQ=(faqData.faq||[]).length>0||(faqData.pops||[]).length>0||faqData.fluxograma;
  const concluidos=modelos.filter(m=>(completions[m.id]?.status==='feito')).length;
  const setorTab=window._opSetorTab||'checklist';
  const tabContent=setorTab==='checklist'
    ?`<div style="margin-bottom:28px;">
      <div style="font-weight:700;font-size:.88rem;margin-bottom:12px;display:flex;align-items:center;gap:8px;">
        Checklists de Hoje
        <span style="font-size:.7rem;font-weight:400;color:var(--muted);">${concluidos}/${modelos.length} concluídos</span>
      </div>
      ${checklistCards}
    </div>`
    :setorTab==='processos'
    ?`<div style="margin-bottom:8px;">
      <div style="font-weight:700;font-size:.88rem;margin-bottom:16px;">Processos do Setor</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div class="card" style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between;">
          <div>
            <div style="font-weight:700;font-size:.82rem;">POPs</div>
            <div style="font-size:.7rem;color:var(--muted);">Procedimentos Operacionais Padrão</div>
          </div>
          ${(faqData.pops||[]).length>0
            ?`<button class="btn-ghost btn-sm" onclick="opVerFAQSetor('${lojaId}','${setor}','pops')">Ver ${(faqData.pops||[]).length} POPs</button>`
            :`<span style="font-size:.68rem;color:var(--muted);">Não cadastrado</span>`}
        </div>
        <div class="card" style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between;">
          <div>
            <div style="font-weight:700;font-size:.82rem;">Fluxograma</div>
            <div style="font-size:.7rem;color:var(--muted);">Diagrama de fluxo do setor</div>
          </div>
          ${faqData.fluxograma
            ?`<a class="btn-ghost btn-sm" href="${esc(faqData.fluxograma)}" target="_blank" style="text-decoration:none;">Abrir</a>`

            <div style="font-weight:700;font-size:.82rem;">FAQ</div>

}

function opOpenExecutarChecklist(lojaId,modeloId){
  const m=(S.op.checklistModelos?.[lojaId]||[]).find(x=>x.id===modeloId);
  if(!m)return;
  window._xLoja=lojaId;window._xModelo=modeloId;window._xPasso=false;window._xPassoIdx=0;
  const hoje=todayKey();
  if(!S.op.completions)S.op.completions={};
  if(!S.op.completions[lojaId])S.op.completions[lojaId]={};
  if(!S.op.completions[lojaId][hoje])S.op.completions[lojaId][hoje]={};
  if(!S.op.completions[lojaId][hoje][modeloId])S.op.completions[lojaId][hoje][modeloId]={items:{},status:'pendente'};
  opRenderExec();
  document.getElementById('exec-ov').classList.add('show');
}
function opRenderExec(){
  const lojaId=window._xLoja,modeloId=window._xModelo;

  const turno=m.turno||{abertura:'Manhã',fechamento:'Tarde',geral:'Geral'}[m.tipo]||'Geral';
  const total=(m.items||[]).length;
  const isPasso=window._xPasso;
  const passoIdx=window._xPassoIdx||0;
  const feitos=(m.items||[]).filter(it=>{const s=comp.items?.[it.id];
    return s?.ok||s?.nok||(s?.valor!==undefined&&s?.valor!=='')||(s?.estrelas>0)||s?.data;}).length;
  const pct=total?Math.round(feitos/total*100):0;
  document.getElementById('exec-hd').innerHTML=`
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
      <div>
        <div style="font-size:1.05rem;font-weight:800;">${esc(m.nome)}</div>
        <div style="font-size:.72rem;color:var(--muted);margin-top:3px;">${respNomes.length?`Resp: ${respNomes.join(', ')} · `:''}Turno: ${turno} · ${esc(m.setor)}</div>
      </div>
      <button onclick="window._xPasso=!window._xPasso;window._xPassoIdx=0;opRenderExec()"
        style="padding:6px 14px;border-radius:8px;border:1px solid var(--acc);background:${isPasso?'var(--acc)':'transparent'};color:${isPasso?'#fff':'var(--acc)'};font-size:.76rem;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;">
        Passo a Passo
      </button>
    </div>`;
  const progressHtml=`
    <div class="card" style="padding:12px 16px;margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-size:.62rem;font-weight:700;letter-spacing:.09em;color:var(--muted);">PROGRESSO</span>
        <span class="xprog-txt" style="font-size:.78rem;font-weight:700;color:var(--acc);">${feitos} DE ${total} (${pct}%)</span>
      </div>
      <div style="background:var(--panel2);border-radius:999px;height:6px;overflow:hidden;">
        <div class="xprog-bar" style="height:100%;border-radius:999px;background:var(--acc);width:${pct}%;transition:width .3s;"></div>
      </div>
    </div>`;
  const itemsToShow=isPasso?(m.items[passoIdx]?[m.items[passoIdx]]:[]):m.items;
  const itemsHtml=itemsToShow.map((item,visIdx)=>{
    const realIdx=isPasso?passoIdx:visIdx;
    const ist=comp.items?.[item.id]||{};
    const tipoResp=item.tipoResp||'ok_nok';
    let ctrlHtml='';
    if(tipoResp==='ok_nok'){
      ctrlHtml=`<div style="display:flex;gap:6px;flex-shrink:0;" onclick="event.stopPropagation()">
        <button class="xok${ist.ok?' on':''}" onclick="opXSetItem('${item.id}','ok')">OK</button>
        <button class="xnok${ist.nok?' on':''}" onclick="opXSetItem('${item.id}','nok')">N/OK</button>
      </div>`;
    }else if(tipoResp==='valor'){
      ctrlHtml=`<input class="f-in" value="${esc(ist.valor||'')}" placeholder="Valor..." style="max-width:160px;font-size:.82rem;" oninput="opXSetVal('${item.id}','valor',this.value)">`;
    }else if(tipoResp==='estrelas'){
      const s=ist.estrelas||0;
      ctrlHtml=`<div style="display:flex;gap:2px;">${[1,2,3,4,5].map(n=>`<span onclick="opXSetVal('${item.id}','estrelas',${n})" style="font-size:1.3rem;cursor:pointer;color:${n<=s?'#f59e0b':'var(--muted)'};">★</span>`).join('')}</div>`;
    }else if(tipoResp==='data'){
      ctrlHtml=`<input class="f-in" type="date" value="${ist.data||''}" style="max-width:160px;" onchange="opXSetVal('${item.id}','data',this.value)">`;
    }
    const bodyOpen=ist.nok||(item.exigeObs&&!(ist.obs||'').trim());
    return`<div class="exec-card${ist.ok?' ok':ist.nok?' nok':''}" id="xcard-${item.id}">
      <div class="exec-card-hd">
        <span style="width:24px;height:24px;border-radius:8px;background:var(--acc)18;color:var(--acc);font-size:.7rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${realIdx+1}</span>
        <div style="flex:1;min-width:0;cursor:pointer;" onclick="opXToggle('${item.id}')">
          <div style="font-size:.86rem;font-weight:600;line-height:1.3;">${esc(item.texto)}</div>
          <div style="font-size:.7rem;color:var(--muted);margin-top:2px;">${item.instrucoes?esc(item.instrucoes):'Sem descrição para esse item'}</div>
        </div>
        ${ctrlHtml}
        <span id="xarrow-${item.id}" onclick="opXToggle('${item.id}')" style="font-size:.9rem;color:var(--muted);padding:6px 4px;cursor:pointer;flex-shrink:0;-webkit-tap-highlight-color:transparent;">${bodyOpen?'▴':'▾'}</span>
      </div>
      <div class="exec-card-body${bodyOpen?' open':''}" id="xbody-${item.id}">
        <div style="margin-bottom:10px;">
          <div style="font-size:.62rem;font-weight:700;letter-spacing:.07em;color:var(--muted);margin-bottom:6px;">OBSERVAÇÃO${item.exigeObs?` <span style="color:var(--red);">*</span>`:''}</div>
          <textarea class="f-in" placeholder="Digite observações aqui..." rows="3" style="width:100%;resize:vertical;box-sizing:border-box;" oninput="opXSetObs('${item.id}',this.value)">${esc(ist.obs||'')}</textarea>
        </div>
        <div>
          <div style="font-size:.62rem;font-weight:700;letter-spacing:.07em;color:var(--muted);margin-bottom:6px;">FOTO${item.exigeFoto?` <span style="color:var(--red);">*</span>`:''}</div>
          <label id="xfoto-label-${item.id}" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:1px dashed ${(ist.fotos||[]).length?'var(--acc)':'var(--line)'};border-radius:10px;cursor:pointer;font-size:.8rem;font-weight:700;color:${(ist.fotos||[]).length?'var(--acc)':'inherit'};">
            ${(ist.fotos||[]).length?'TROCAR FOTO':'ANEXAR FOTO'}
            <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="opXAttachFoto('${item.id}',this)">
          </label>
          <div id="xfoto-status-${item.id}" style="margin-top:8px;">
            ${(ist.fotos||[]).length?`<img src="${ist.fotos[0]}" style="width:100%;max-height:180px;object-fit:cover;border-radius:8px;border:1px solid var(--acc);">`:''}
          </div>
        </div>
      </div>
    </div>`;
  }).join('')||'<div style="color:var(--muted);font-size:.8rem;padding:16px;text-align:center;">Nenhum item neste checklist.</div>';
  document.getElementById('exec-bd').innerHTML=progressHtml+itemsHtml;
  const passoNav=isPasso?`<div style="display:flex;gap:8px;align-items:center;flex:1;justify-content:center;">
    ${passoIdx>0?`<button onclick="window._xPassoIdx--;opRenderExec()" class="btn-ghost btn-sm">← Anterior</button>`:''}
    <span style="font-size:.76rem;color:var(--muted);">${passoIdx+1} / ${total}</span>
    ${passoIdx<total-1?`<button onclick="window._xPassoIdx++;opRenderExec()" class="btn-gold btn-sm">Próximo →</button>`:''}
  </div>`:''  ;
  document.getElementById('exec-ft').innerHTML=`
    <button onclick="document.getElementById('exec-ov').classList.remove('show')" style="padding:13px 20px;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:.88rem;font-weight:700;color:var(--fg);">Cancelar</button>
    ${passoNav}
    <button onclick="opFinalizarChecklist('${lojaId}','${modeloId}')" style="flex:1;padding:13px;border-radius:12px;border:none;background:#22c55e;color:#fff;cursor:pointer;font-size:.88rem;font-weight:800;letter-spacing:.02em;">FINALIZAR E ENVIAR</button>
    <div id="xexec-err" style="display:none;font-size:.74rem;color:var(--red);width:100%;text-align:center;margin-top:2px;"></div>`;
}
function opXToggle(itemId){
  const b=document.getElementById(`xbody-${itemId}`);
  const a=document.getElementById(`xarrow-${itemId}`);
  if(b){b.classList.toggle('open');if(a)a.textContent=b.classList.contains('open')?'▴':'▾';}
}
function opXSetItem(itemId,tipo){
  const lojaId=window._xLoja,modeloId=window._xModelo,hoje=todayKey();
  const comp=S.op.completions[lojaId][hoje][modeloId];
  if(!comp.items)comp.items={};
  if(!comp.items[itemId])comp.items[itemId]={};
  comp.items[itemId].ok=(tipo==='ok');
  comp.items[itemId].nok=(tipo==='nok');
  saveLocal();
  const card=document.getElementById(`xcard-${itemId}`);
  if(card){
    card.className=`exec-card ${tipo}`;
    const okBtn=card.querySelector('.xok');
    const nokBtn=card.querySelector('.xnok');
    if(okBtn)okBtn.classList.toggle('on',tipo==='ok');
    if(nokBtn)nokBtn.classList.toggle('on',tipo==='nok');
    if(tipo==='nok'){const b=document.getElementById(`xbody-${itemId}`);if(b){b.classList.add('open');const a=document.getElementById(`xarrow-${itemId}`);if(a)a.textContent='▴';}}
  }
  opXUpdateProg();
}
function opXSetVal(itemId,field,val){
  const lojaId=window._xLoja,modeloId=window._xModelo,hoje=todayKey();
  const comp=S.op.completions[lojaId][hoje][modeloId];
  if(!comp.items)comp.items={};
  if(!comp.items[itemId])comp.items[itemId]={};
  comp.items[itemId][field]=field==='estrelas'?Number(val):val;
  saveLocal();
  if(field==='estrelas'){
    document.querySelectorAll(`#xcard-${itemId} .exec-card-hd span[onclick*="estrelas"]`).forEach((s,i)=>s.style.color=i<Number(val)?'#f59e0b':'var(--muted)');
  }
  opXUpdateProg();
}
function opXSetObs(itemId,obs){
  const lojaId=window._xLoja,modeloId=window._xModelo,hoje=todayKey();
  const comp=S.op.completions?.[lojaId]?.[hoje]?.[modeloId];
  if(!comp)return;
  if(!comp.items)comp.items={};
  if(!comp.items[itemId])comp.items[itemId]={};
  comp.items[itemId].obs=obs;
}
function opXAttachFoto(itemId,input){
  if(!input.files||!input.files[0])return;
  const lojaId=window._xLoja,modeloId=window._xModelo,hoje=todayKey();
  const comp=S.op.completions[lojaId][hoje][modeloId];
  if(!comp.items)comp.items={};
  if(!comp.items[itemId])comp.items[itemId]={};
  if(!comp.items[itemId].fotos)comp.items[itemId].fotos=[];
  const file=input.files[0];
  const reader=new FileReader();
  reader.onload=ev=>{
    // Compress image via canvas (max 800px, jpeg 0.72) to prevent localStorage overflow
    const img=new Image();
    img.onload=()=>{
      const MAX=800;
      const scale=Math.min(1,MAX/Math.max(img.width,img.height));
      const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const compressed=canvas.toDataURL('image/jpeg',0.72);
      comp.items[itemId].fotos=[compressed];
      try{saveLocal();}catch(e){toast('Foto grande demais, tente tirar outra.');return;}
      // Update DOM immediately — no re-render needed
      const statusEl=document.getElementById(`xfoto-status-${itemId}`);
      const labelEl=document.getElementById(`xfoto-label-${itemId}`);
      if(statusEl)statusEl.innerHTML=`<img src="${compressed}" style="width:100%;max-height:180px;object-fit:cover;border-radius:8px;border:1px solid var(--acc);">`;
      if(labelEl){labelEl.style.borderColor='var(--acc)';labelEl.style.color='var(--acc)';
        const txt=labelEl.childNodes[0];if(txt&&txt.nodeType===3)txt.textContent='TROCAR FOTO ';}
      toast('Foto anexada!');
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function opXUpdateProg(){
  const lojaId=window._xLoja,modeloId=window._xModelo,hoje=todayKey();
  const m=(S.op.checklistModelos?.[lojaId]||[]).find(x=>x.id===modeloId);
  const comp=S.op.completions?.[lojaId]?.[hoje]?.[modeloId];
  if(!m||!comp)return;
  const total=(m.items||[]).length;
  const feitos=(m.items||[]).filter(it=>{const s=comp.items?.[it.id];
    return s?.ok||s?.nok||(s?.valor!==undefined&&s?.valor!=='')||(s?.estrelas>0)||s?.data;}).length;
  const pct=total?Math.round(feitos/total*100):0;
  const pb=document.querySelector('.xprog-bar'),pt=document.querySelector('.xprog-txt');
  if(pb)pb.style.width=pct+'%';if(pt)pt.textContent=`${feitos} DE ${total} (${pct}%)`;
}
function opFinalizarChecklist(lojaId,modeloId){
  const m=(S.op.checklistModelos?.[lojaId]||[]).find(x=>x.id===modeloId);
  const hoje=todayKey();
  const comp=S.op.completions?.[lojaId]?.[hoje]?.[modeloId];
  const errEl=document.getElementById('xexec-err')||document.getElementById('cl-exec-err');
  const showErr=msg=>{if(errEl){errEl.textContent=msg;errEl.style.display='block';}};
  if(!comp){showErr('Erro interno.');return;}
  if(m&&(m.items||[]).length>0){
    const unchecked=(m.items||[]).filter(it=>{
      const st=comp.items?.[it.id];const tr=it.tipoResp||'ok_nok';
      if(tr==='ok_nok')return !st?.ok&&!st?.nok;
      if(tr==='valor')return !(st?.valor!==undefined&&st?.valor!=='');
      if(tr==='estrelas')return !(st?.estrelas>0);
      if(tr==='data')return !st?.data;
      return false;
    });
    if(unchecked.length>0){showErr(`Marque todos os itens antes de finalizar. (${unchecked.length} pendente${unchecked.length>1?'s':''})`);return;}
    for(const it of m.items||[]){
      const st=comp.items?.[it.id];
      if(it.exigeObs&&!(st?.obs||'').trim()){showErr(`"${it.texto.slice(0,30)}..." requer observação obrigatória.`);return;}
      if(it.exigeFoto&&!(st?.fotos?.length)){showErr(`"${it.texto.slice(0,30)}..." requer foto obrigatória.`);return;}
    }
  }
  comp.status='feito';comp.finalizadoEm=new Date().toISOString();comp.finalizadoPor=me;
  saveLocal();
  document.getElementById('exec-ov').classList.remove('show');
  renderOperacional();toast('Checklist finalizado!');
}

  if(!temAlgo)return`<div class="empty-state">Nenhum checklist ativo para esta loja.<br>Configure os modelos na aba Checklists e ative-os.</div>`;

function opVerCompletionDetalhes(lojaId,modeloId,setor){
  const m=(S.op.checklistModelos?.[lojaId]||[]).find(x=>x.id===modeloId);
  if(!m)return;
  const hoje=todayKey();
  const comp=S.op.completions?.[lojaId]?.[hoje]?.[modeloId];
  if(!comp||comp.status!=='feito'){toast('Checklist ainda não executado.');return;}
  const nokItens=(m.items||[]).filter(item=>{const st=comp.items?.[item.id];return st?.nok;});
  const okItens=(m.items||[]).filter(item=>{const st=comp.items?.[item.id];return st?.ok;});
  let html=`<h3 style="margin-bottom:4px;">${esc(m.nome)}</h3>
    <div style="font-size:.72rem;color:var(--muted);margin-bottom:16px;">Feito às ${comp.finalizadoEm?comp.finalizadoEm.slice(11,16):'-'} por ${esc(M[comp.finalizadoPor]?.name||comp.finalizadoPor||'-')}</div>`;
  if(nokItens.length){
    html+=`<div style="font-weight:700;font-size:.82rem;margin-bottom:8px;color:#ef4444;">NOK — itens com problema:</div>
      ${nokItens.map(item=>{const st=comp.items?.[item.id];return`<div style="padding:8px 12px;background:#ef444411;border-radius:8px;margin-bottom:6px;border-left:3px solid #ef4444;">
        <div style="font-size:.82rem;">${esc(item.texto)}</div>
        ${st?.obs?`<div style="font-size:.74rem;color:var(--muted);margin-top:3px;">${esc(st.obs)}</div>`:''}
      </div>`;}).join('')}`;
  }
  if(okItens.length){
    html+=`<div style="font-weight:700;font-size:.82rem;margin-top:12px;margin-bottom:8px;color:#22c55e;">OK — itens conformes: ${okItens.length}/${(m.items||[]).length}</div>`;
  }
  html+=`<button class="btn-ghost" style="width:100%;margin-top:14px;" onclick="closeModal()">Fechar</button>`;
  openModal(html);
}

function opOpenCriarSetorLider(lojaId,setor){
  const sug=setor.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'').slice(0,12)+'_'+lojaId.slice(0,3);
  openModal(`<h3 style="margin-bottom:4px;">Criar Acesso — ${esc(setor)}</h3>

      <input class="f-in" id="opsl-user" value="${sug}" placeholder="Ex: cozinha_lag"></div>

      <input class="f-in" type="password" id="opsl-senha" placeholder="Mínimo 4 caracteres"></div>
    <div id="opsl-err" style="font-size:.74rem;color:var(--red);min-height:14px;"></div>
    <button class="btn-gold" style="width:100%;margin-top:12px;" onclick="opSalvarSetorLider('${lojaId}','${esc(setor)}')">Criar Acesso</button>`);
}
function opSalvarSetorLider(lojaId,setor){
  const username=document.getElementById('opsl-user').value.trim().toLowerCase().replace(/\s+/g,'_');
  const senha=document.getElementById('opsl-senha').value;
  if(!username||!senha||senha.length<4){document.getElementById('opsl-err').textContent='Usuário e senha obrigatórios (mínimo 4 caracteres).';return;}
  const conflict=(S.customUsers||[]).find(u=>u.username===username||u.id===username)
    ||Object.values(S.usernames||{}).includes(username);
  if(conflict){document.getElementById('opsl-err').textContent='Usuário já existe. Escolha outro nome.';return;}
  const loja=opGetLoja(lojaId);
  const COR_LOJA={lago:'#6366f1',alphaville:'#f472b6',maringa:'#22d3ee',alameda:'#f59e0b',mercadao:'#22c55e'};
  const userId=username;
  if(!S.customUsers)S.customUsers=[];
  S.customUsers.push({id:userId,username,name:`${setor} · ${loja?.label||lojaId}`,role:`Líder · ${setor}`,color:COR_LOJA[lojaId]||'#64748b',icon:setor.slice(0,2).toUpperCase(),isLeader:false,tipo:'setorLider',loja:lojaId,setor,email:''});
  if(!S.pins)S.pins={};
  if(!S.usernames)S.usernames={};
  S.pins[userId]=pwdHash(senha);
  S.usernames[userId]=username;
  if(!S.userPerms)S.userPerms={};
  S.userPerms[userId]=['operacional'];
  syncCustomUsers();saveLocal();closeModal();renderOperacional();
  toast(`Acesso criado! Usuário: @${username}`);
}
function opResetSenhaSetor(userId,setor){
  openModal(`<h3 style="margin-bottom:16px;">Redefinir Senha — ${esc(setor)}</h3>
    <div class="f-grp"><label class="f-lb">Nova senha *</label>
      <input class="f-in" type="password" id="oprs2-senha" placeholder="Mínimo 4 caracteres"></div>
    <div id="oprs2-err" style="font-size:.74rem;color:var(--red);min-height:14px;"></div>
    <button class="btn-gold" style="width:100%;margin-top:12px;" onclick="opSalvarResetSenha('${userId}')">Salvar nova senha</button>`);
}
function opSalvarResetSenha(userId){
  const senha=document.getElementById('oprs2-senha').value;
  if(!senha||senha.length<4){document.getElementById('oprs2-err').textContent='Senha deve ter ao menos 4 caracteres.';return;}
  if(!S.pins)S.pins={};
  S.pins[userId]=pwdHash(senha);
  saveLocal();closeModal();toast('Senha redefinida!');
}
function opDelSetorLider(userId,setor){
  if(!confirm(`Remover acesso de "${setor}"? O usuário não conseguirá mais fazer login.`))return;
  S.customUsers=(S.customUsers||[]).filter(u=>u.id!==userId);
  if(S.pins)delete S.pins[userId];
  if(S.usernames)delete S.usernames[userId];
  if(S.userPerms)delete S.userPerms[userId];
  if(M[userId])delete M[userId];
  saveLocal();renderOperacional();toast('Acesso removido.');
}

function renderOpOverview(el){

    return{tarefas:tarefas.filter(t=>t.status!=='feito').length,manu:manu.length,erros:erros.length,func:func.length};

  let html=`<div class="page-head"><h2>Operacional</h2></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:4px;">`;
  OP_LOJAS.forEach(lj=>{
    const s=stats(lj.id);
    const gerId=S.op.gerentes?.[lj.id];

    html+=`<div class="card" style="padding:20px;cursor:pointer;border-left:4px solid ${lj.cor};" onclick="window._opLojaView='${lj.id}';window._opTab='tarefas';renderOperacional()">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        ${opLojaBadge(lj,38)}
        <div>
          <div style="font-weight:700;font-size:.92rem;">${lj.label}</div>
          <div style="font-size:.68rem;color:var(--muted);">Gerente: ${gerNome}</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div style="background:var(--panel2);border-radius:10px;padding:10px;text-align:center;">
          <div style="font-size:1.2rem;font-weight:800;color:${s.tarefas>0?'var(--gold)':'var(--muted)'};">${s.tarefas}</div>
          <div style="font-size:.62rem;color:var(--muted);">Tarefas abertas</div>
        </div>
        <div style="background:var(--panel2);border-radius:10px;padding:10px;text-align:center;">
          <div style="font-size:1.2rem;font-weight:800;color:${s.manu>0?'#fb923c':'var(--muted)'};">${s.manu}</div>
          <div style="font-size:.62rem;color:var(--muted);">Manutenções</div>
        </div>
        <div style="background:var(--panel2);border-radius:10px;padding:10px;text-align:center;">
          <div style="font-size:1.2rem;font-weight:800;color:${s.erros>0?'#f87171':'var(--muted)'};">${s.erros}</div>
          <div style="font-size:.62rem;color:var(--muted);">Erros pendentes</div>
        </div>
        <div style="background:var(--panel2);border-radius:10px;padding:10px;text-align:center;">
          <div style="font-size:1.2rem;font-weight:800;color:var(--text);">${s.func}</div>
          <div style="font-size:.62rem;color:var(--muted);">Funcionários</div>
        </div>
      </div>
    </div>`;
  });
  html+=`</div>
    ${M[me]?.isLeader?`<div style="margin-top:24px;"><div class="sec">Atribuição de Gerentes</div>
      <div style="display:grid;gap:8px;margin-top:8px;">
        ${OP_LOJAS.map(lj=>{
          const gerId=S.op.gerentes?.[lj.id]||'';
          const userOpts=Object.entries(M).map(([k,m2])=>`<option value="${k}"${k===gerId?' selected':''}>${m2.name} — ${m2.role}</option>`).join('');
          return`<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;">
            ${opLojaBadge(lj,28)}
            <div style="flex:1;font-size:.84rem;font-weight:600;">${lj.label}</div>
            <select class="finput" style="width:220px;font-size:.78rem;padding:5px 8px;" onchange="opSetGerente('${lj.id}',this.value)">
              <option value="">Sem gerente</option>
              ${userOpts}
            </select>
          </div>`;
        }).join('')}
      </div></div>`:''}`;
  el.innerHTML=html;
}

function opSetGerente(lojaId,userId){
  if(!S.op.gerentes)S.op.gerentes={};
  if(userId)S.op.gerentes[lojaId]=userId;
  else delete S.op.gerentes[lojaId];
  saveLocal();toast('Gerente atualizado!');renderOperacional();
}

// ── PAINEL DA LOJA (gerente / líderes ao clicar) ─────────────
function renderOpStore(el,lojaId){
  // Garante que sidebar está em modo operacional e atualiza highlights
  window._appMode='operacional';
  buildSidebar();
  const verTodas=!lojaId&&opCanSeeAll();
  const loja=lojaId?opGetLoja(lojaId):null;
  if(lojaId&&!loja){el.innerHTML='<div class="card" style="padding:24px;">Loja não encontrada.</div>';return;}
  const tab=window._opTab||'hoje';
  const tabs=[
    {id:'hoje',          label:'Hoje',          icon:''},
    {id:'tarefas',       label:'Tarefas',       },
    {id:'erros',         label:'Ocorrências',   icon:'️'},
    {id:'manutencao',    label:'Manutenção',    icon:''},
    ...(lojaId?[
      {id:'checklists',  label:'Checklists',    icon:''},
      {id:'faq',         label:'FAQ / POPs',    icon:''},
      {id:'funcionarios',label:'Funcionários',  icon:''},
      {id:'marketing',   label:'Marketing',     icon:''},
      {id:'setores',     label:'Líderes',       icon:'️'},
    ]:[]),
  ];
  // Conteúdo
  let content='';
  if(tab==='hoje')           content=opTabHoje(lojaId);
  else if(tab==='tarefas')   content=opTabTarefas(lojaId);
  else if(tab==='checklists')content=lojaId?opTabChecklists(lojaId):'';
  else if(tab==='faq')       content=lojaId?opTabFAQ(lojaId):'';
  else if(tab==='manutencao')content=opTabManutencao(lojaId);
  else if(tab==='funcionarios')content=lojaId?opTabFuncionarios(lojaId):'';
  else if(tab==='marketing') content=lojaId?opTabMarketing(lojaId):'';
  else if(tab==='erros')     content=opTabErros(lojaId);
  else if(tab==='setores')   content=lojaId?opTabGestaoSetores(lojaId):'';
  const activeTab=tabs.find(t=>t.id===tab);
  const accentCor=loja?.cor||'var(--acc)';
  // Page header
  const lojaChip=loja
    ?`<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:${loja.cor}22;color:${loja.cor};font-size:.74rem;font-weight:700;">${opLojaBadge(loja,18)} ${loja.label}</span>`
    :`<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:var(--panel2);color:var(--muted);font-size:.74rem;font-weight:700;">Todas as Lojas</span>`;
  el.innerHTML=`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line);">
      <div>
        <h2 style="margin:0;font-size:1.05rem;font-weight:700;">${activeTab?.label||''}</h2>
        <div style="margin-top:4px;">${lojaChip}</div>
      </div>
    </div>
    <div id="op-content">${content}</div>`;
}

// ── TAB: TAREFAS ──────────────────────────────────────────────
function opTabTarefas(lojaId){
  if(!lojaId){
    // Resumo de todas as lojas
    let html=`<div style="display:flex;flex-direction:column;gap:10px;">`;
    OP_LOJAS.forEach(lj=>{
      const ts=(S.op.tarefas||[]).filter(t=>t.loja===lj.id);
      const todo=ts.filter(t=>t.status==='todo').length;
      const fazendo=ts.filter(t=>t.status==='fazendo').length;
      if(!ts.length)return;
      html+=`<div class="card" style="padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border-left:4px solid ${lj.cor};" onclick="window._opLojaView='${lj.id}';window._opTab='tarefas';renderOperacional()">
        ${opLojaBadge(lj,28)}
        <div style="flex:1;font-weight:600;font-size:.86rem;">${lj.label}</div>
        ${todo?`<span style="font-size:.72rem;padding:2px 9px;border-radius:999px;background:#6b728022;color:#6b7280;">${todo} a fazer</span>`:''}
        ${fazendo?`<span style="font-size:.72rem;padding:2px 9px;border-radius:999px;background:#3b82f622;color:#3b82f6;">${fazendo} fazendo</span>`:''}
        <span style="font-size:.7rem;color:var(--muted);">→</span>
      </div>`;
    });
    html+=`</div>`;
    const total=(S.op.tarefas||[]).filter(t=>t.status!=='feito').length;
    return total?html:`<div class="empty-state">Nenhuma tarefa em aberto.</div>`;
  }
  const tarefas=(S.op.tarefas||[]).filter(t=>t.loja===lojaId);
  const statusCols=[
    {id:'todo',label:'A Fazer',cor:'#6b7280'},
    {id:'fazendo',label:'Fazendo',cor:'#3b82f6'},
    {id:'feito',label:'Feito',cor:'#22c55e'},
  ];
  const cards=statusCols.map(col=>{
    const items=tarefas.filter(t=>t.status===col.id).sort((a,b)=>b.date.localeCompare(a.date));
    return`<div style="flex:1;min-width:200px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid ${col.cor}33;">
        <div style="width:10px;height:10px;border-radius:50%;background:${col.cor};"></div>
        <span style="font-size:.78rem;font-weight:700;">${col.label}</span>
        <span style="font-size:.7rem;color:var(--muted);">${items.length}</span>
      </div>
      ${items.map(t=>`<div class="card" style="padding:12px;margin-bottom:8px;">
        <div style="font-size:.86rem;font-weight:600;margin-bottom:4px;">${esc(t.titulo)}</div>
        ${t.desc?`<div style="font-size:.74rem;color:var(--muted);margin-bottom:6px;">${esc(t.desc.slice(0,80))}${t.desc.length>80?'...':''}</div>`:''}
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <select class="finput" style="font-size:.7rem;padding:3px 6px;width:auto;" onchange="opUpdateTarefaStatus('${t.id}',this.value)">
            ${statusCols.map(s=>`<option value="${s.id}"${t.status===s.id?' selected':''}>${s.label}</option>`).join('')}
          </select>
          <span style="font-size:.66rem;color:var(--muted);">${fmtDate(t.date)}</span>
          <button onclick="opDelTarefa('${t.id}')" style="background:none;border:none;color:var(--muted);cursor:pointer;margin-left:auto;font-size:.85rem;"></button>
        </div>
      </div>`).join('')||`<div style="font-size:.76rem;color:var(--muted);padding:10px 0;">Nenhuma tarefa.</div>`}
    </div>`;
  }).join('');
  return`<div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
    <button class="btn-gold btn-sm" onclick="opOpenNovaTarefa('${lojaId}')">+ Nova Tarefa</button>
  </div>
  <div style="display:flex;gap:14px;flex-wrap:wrap;">${cards}</div>`;
}
function opUpdateTarefaStatus(id,status){const t=(S.op.tarefas||[]).find(x=>x.id===id);if(t){t.status=status;saveLocal();renderOperacional();}}
function opDelTarefa(id){if(!confirm('Remover tarefa?'))return;S.op.tarefas=(S.op.tarefas||[]).filter(x=>x.id!==id);saveLocal();renderOperacional();}
function opOpenNovaTarefa(lojaId){
  openModal(`<h3 style="margin-bottom:16px;">Nova Tarefa Operacional</h3>
    <div class="f-grp"><label class="f-lb">Título *</label><input class="f-in" id="opt-titulo" placeholder="Ex: Limpar câmara fria"></div>
    <div class="f-grp"><label class="f-lb">Descrição</label><textarea class="f-in" id="opt-desc" rows="2" placeholder="Detalhes..."></textarea></div>
    <div class="f-grp"><label class="f-lb">Setor</label>
      <select class="f-in" id="opt-setor"><option value="">Geral</option>${opSetores(lojaId).map(s=>`<option>${s}</option>`).join('')}</select>
    </div>
    <div id="opt-err" style="font-size:.74rem;color:var(--red);min-height:14px;"></div>
    <button class="btn-gold" style="width:100%;margin-top:12px;" onclick="opSaveTarefa('${lojaId}')">Salvar</button>`);
}
function opSaveTarefa(lojaId){
  const titulo=document.getElementById('opt-titulo').value.trim();
  if(!titulo){document.getElementById('opt-err').textContent='Título obrigatório.';return;}
  if(!S.op.tarefas)S.op.tarefas=[];
  S.op.tarefas.push({id:uid(),loja:lojaId,titulo,desc:document.getElementById('opt-desc').value.trim(),setor:document.getElementById('opt-setor').value,status:'todo',date:todayKey(),createdBy:me});
  saveLocal();closeModal();renderOperacional();toast('Tarefa criada!');
}

// ── TAB: MANUTENÇÃO ──────────────────────────────────────────
function opTabManutencao(lojaId){
  if(!lojaId){
    let html=`<div style="display:flex;flex-direction:column;gap:10px;">`;
    OP_LOJAS.forEach(lj=>{
      const itens=(S.op.manutencao||[]).filter(m=>m.loja===lj.id&&m.status!=='concluido');
      if(!itens.length)return;
      const alta=itens.filter(m=>m.prioridade==='alta').length;
      html+=`<div class="card" style="padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border-left:4px solid ${lj.cor};" onclick="window._opLojaView='${lj.id}';window._opTab='manutencao';renderOperacional()">
        ${opLojaBadge(lj,28)}
        <div style="flex:1;font-weight:600;font-size:.86rem;">${lj.label}</div>
        ${alta?`<span style="font-size:.72rem;padding:2px 9px;border-radius:999px;background:#f8717122;color:#f87171;">${alta} alta prioridade</span>`:''}
        <span style="font-size:.72rem;padding:2px 9px;border-radius:999px;background:var(--panel2);">${itens.length} pendente${itens.length>1?'s':''}</span>
        <span style="font-size:.7rem;color:var(--muted);">→</span>
      </div>`;
    });
    html+=`</div>`;
    const total=(S.op.manutencao||[]).filter(m=>m.status!=='concluido').length;
    return total?html:`<div class="empty-state">Nenhuma manutenção em aberto.</div>`;
  }
  const loja=opGetLoja(lojaId);
  const itens=(S.op.manutencao||[]).filter(m=>m.loja===lojaId).sort((a,b)=>b.date.localeCompare(a.date));
  const STATUS={pendente:{label:'Pendente',cor:'#fbbf24'},andamento:{label:'Em andamento',cor:'#60a5fa'},concluido:{label:'Concluído',cor:'#4ade80'}};
  const PRIO={alta:{label:'Alta',cor:'#f87171'},media:{label:'Média',cor:'#fbbf24'},baixa:{label:'Baixa',cor:'var(--muted)'}};
  const cards=itens.map(m=>{
    const st=STATUS[m.status]||STATUS.pendente;
    const pr=PRIO[m.prio]||PRIO.media;
    return`<div class="card" style="padding:14px 16px;margin-bottom:8px;border-left:3px solid ${st.cor};">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;">
        <div>
          <span style="font-size:.65rem;padding:2px 7px;border-radius:999px;background:${pr.cor}22;color:${pr.cor};font-weight:700;margin-right:6px;">${pr.label}</span>
          <span style="font-size:.88rem;font-weight:700;">${esc(m.titulo)}</span>
        </div>
        <div style="display:flex;gap:4px;flex-shrink:0;">
          <select class="finput" style="font-size:.7rem;padding:3px 6px;width:auto;" onchange="opUpdateManuStatus('${m.id}',this.value)">
            ${Object.entries(STATUS).map(([k,v])=>`<option value="${k}"${m.status===k?' selected':''}>${v.label}</option>`).join('')}
          </select>
          <button onclick="opDelManu('${m.id}')" style="background:none;border:none;color:var(--muted);cursor:pointer;"></button>
        </div>
      </div>
      ${m.desc?`<div style="font-size:.78rem;color:var(--muted);margin-bottom:4px;">${esc(m.desc)}</div>`:''}
      <div style="font-size:.68rem;color:var(--muted);">${fmtDate(m.date)}${m.setor?` · ${esc(m.setor)}`:''}</div>
    </div>`;
  }).join('')||'<div class="empty-state">Nenhuma manutenção registrada.</div>';
  return`<div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
    <button class="btn-gold btn-sm" onclick="opOpenNovaManu('${lojaId}')">+ Nova Manutenção</button>
  </div>${cards}`;
}
function opUpdateManuStatus(id,status){const m=(S.op.manutencao||[]).find(x=>x.id===id);if(m){m.status=status;saveLocal();renderOperacional();}}
function opDelManu(id){if(!confirm('Remover?'))return;S.op.manutencao=(S.op.manutencao||[]).filter(x=>x.id!==id);saveLocal();renderOperacional();}
function opOpenNovaManu(lojaId){
  openModal(`<h3 style="margin-bottom:16px;">Nova Manutenção</h3>
    <div class="f-grp"><label class="f-lb">Título *</label><input class="f-in" id="opm-titulo" placeholder="Ex: Trocar lâmpada da câmara"></div>
    <div class="f-grp"><label class="f-lb">Descrição</label><textarea class="f-in" id="opm-desc" rows="2" placeholder="Descreva o problema..."></textarea></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="f-grp"><label class="f-lb">Setor / Local</label>
        <select class="f-in" id="opm-setor"><option value="">Geral</option>${opSetores(lojaId).map(s=>`<option>${s}</option>`).join('')}</select>
      </div>
      <div class="f-grp"><label class="f-lb">Prioridade</label>
        <select class="f-in" id="opm-prio"><option value="alta">Alta</option><option value="media" selected>Média</option><option value="baixa">Baixa</option></select>
      </div>
    </div>
    <div id="opm-err" style="font-size:.74rem;color:var(--red);min-height:14px;"></div>
    <button class="btn-gold" style="width:100%;margin-top:12px;" onclick="opSaveManu('${lojaId}')">Salvar</button>`);
}
function opSaveManu(lojaId){
  const titulo=document.getElementById('opm-titulo').value.trim();
  if(!titulo){document.getElementById('opm-err').textContent='Título obrigatório.';return;}
  if(!S.op.manutencao)S.op.manutencao=[];
  S.op.manutencao.push({id:uid(),loja:lojaId,titulo,desc:document.getElementById('opm-desc').value.trim(),setor:document.getElementById('opm-setor').value,prio:document.getElementById('opm-prio').value,status:'pendente',date:todayKey(),createdBy:me});

}

// ── TAB: FUNCIONÁRIOS ─────────────────────────────────────────
function opTabFuncionarios(lojaId){
  const funcs=(S.op.funcionarios||[]).filter(f=>f.loja===lojaId).sort((a,b)=>a.nome.localeCompare(b.nome));
  const ativos=funcs.filter(f=>f.status!=='inativo');
  const inativos=funcs.filter(f=>f.status==='inativo');
  const renderFunc=f=>`<div class="card" style="padding:14px 16px;margin-bottom:8px;">
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="width:38px;height:38px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:1rem;flex-shrink:0;"></div>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:8px;">
          ${esc(f.nome)}
          ${f.status==='inativo'?'<span style="font-size:.62rem;padding:2px 7px;border-radius:999px;background:rgba(100,116,139,.12);color:var(--muted);">Inativo</span>':''}
          ${(f.advertencias||[]).filter(a=>!a.resolvida).length>0?`<span style="font-size:.62rem;padding:2px 7px;border-radius:999px;background:rgba(248,113,113,.12);color:#f87171;">${(f.advertencias||[]).filter(a=>!a.resolvida).length} advertência${(f.advertencias||[]).filter(a=>!a.resolvida).length>1?'s':''}</span>`:''}
        </div>
        <div style="font-size:.72rem;color:var(--muted);">${esc(f.cargo||'—')}${f.setor?` · ${esc(f.setor)}`:''}</div>
        ${f.dataAdmissao?`<div style="font-size:.68rem;color:var(--muted);">Admissão: ${fmtDate(f.dataAdmissao)}</div>`:''}
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;">
        <button class="btn-ghost btn-sm" style="font-size:.72rem;" onclick="opOpenFunc('${f.id}')">Ver / Editar</button>
      </div>
    </div>
  </div>`;
  return`<div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
    <button class="btn-gold btn-sm" onclick="opOpenNovoFunc('${lojaId}')">+ Funcionário</button>
  </div>
  ${ativos.length?ativos.map(renderFunc).join(''):'<div class="empty-state">Nenhum funcionário ativo.</div>'}
  ${inativos.length?`<details style="margin-top:16px;"><summary style="cursor:pointer;font-size:.78rem;color:var(--muted);">Inativos (${inativos.length})</summary><div style="margin-top:8px;">${inativos.map(renderFunc).join('')}</div></details>`:''}`;

function opOpenNovoFunc(lojaId){
  openModal(`<h3 style="margin-bottom:16px;">Novo Funcionário</h3>
    <div class="f-grp"><label class="f-lb">Nome completo *</label><input class="f-in" id="opf-nome" placeholder="Nome do colaborador"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="f-grp"><label class="f-lb">Cargo</label><input class="f-in" id="opf-cargo" placeholder="Ex: Garçom, Cozinheiro"></div>
      <div class="f-grp"><label class="f-lb">Setor</label>
        <select class="f-in" id="opf-setor"><option value="">Selecione...</option>${opSetores(lojaId).map(s=>`<option>${s}</option>`).join('')}</select>
      </div>
    </div>
    <div class="f-grp"><label class="f-lb">Data de Admissão</label><input class="f-in" type="date" id="opf-admissao"></div>
    <div class="f-grp"><label class="f-lb">CPF (opcional)</label><input class="f-in" id="opf-cpf" placeholder="000.000.000-00"></div>
    <div id="opf-err" style="font-size:.74rem;color:var(--red);min-height:14px;"></div>
    <button class="btn-gold" style="width:100%;margin-top:12px;" onclick="opSaveNovoFunc('${lojaId}')">Cadastrar</button>`);
}
function opSaveNovoFunc(lojaId){
  const nome=document.getElementById('opf-nome').value.trim();
  if(!nome){document.getElementById('opf-err').textContent='Nome obrigatório.';return;}
  if(!S.op.funcionarios)S.op.funcionarios=[];
  S.op.funcionarios.push({id:uid(),loja:lojaId,nome,cargo:document.getElementById('opf-cargo').value.trim(),setor:document.getElementById('opf-setor').value,dataAdmissao:document.getElementById('opf-admissao').value,cpf:document.getElementById('opf-cpf').value.trim(),status:'ativo',advertencias:[],docs:[],obs:''});
  saveLocal();closeModal();renderOperacional();toast('Funcionário cadastrado!');
}
function opOpenFunc(funcId){
  const f=(S.op.funcionarios||[]).find(x=>x.id===funcId);if(!f)return;
  const advHtml=(f.advertencias||[]).map((a,i)=>`<div style="padding:8px 10px;background:${a.resolvida?'var(--panel2)':'rgba(248,113,113,.07)'};border:1px solid ${a.resolvida?'var(--line)':'rgba(248,113,113,.2)'};border-radius:8px;margin-bottom:6px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div style="font-size:.78rem;">${esc(a.desc)}</div>
      <div style="display:flex;gap:4px;flex-shrink:0;">
        ${!a.resolvida?`<button onclick="opResolveAdv('${funcId}',${i})" style="background:none;border:none;color:var(--green);cursor:pointer;font-size:.75rem;"></button>`:'<span style="font-size:.7rem;color:var(--green);">Resolvida</span>'}
        <button onclick="opDelAdv('${funcId}',${i})" style="background:none;border:none;color:var(--muted);cursor:pointer;"></button>
      </div>
    </div>
    <div style="font-size:.65rem;color:var(--muted);margin-top:3px;">${fmtDate(a.data)}</div>
  </div>`).join('')||'<div style="font-size:.76rem;color:var(--muted);padding:4px 0;">Nenhuma advertência.</div>';
  openModal(`
    <h3 style="margin-bottom:4px;">${esc(f.nome)}</h3>
    <div style="font-size:.75rem;color:var(--muted);margin-bottom:16px;">${esc(f.cargo||'—')}${f.setor?` · ${esc(f.setor)}`:''}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
      <div class="f-grp"><label class="f-lb">Cargo</label><input class="f-in" id="opfe-cargo" value="${esc(f.cargo||'')}"></div>
      <div class="f-grp"><label class="f-lb">Setor</label>
        <select class="f-in" id="opfe-setor">${opSetores(f.loja).map(s=>`<option${s===f.setor?' selected':''}>${s}</option>`).join('')}</select>
      </div>
    </div>
    <div class="f-grp"><label class="f-lb">Observações</label><textarea class="f-in" id="opfe-obs" rows="2">${esc(f.obs||'')}</textarea></div>
    <div class="f-grp"><label class="f-lb">Status</label>
      <select class="f-in" id="opfe-status"><option value="ativo"${f.status==='ativo'?' selected':''}>Ativo</option><option value="inativo"${f.status==='inativo'?' selected':''}>Inativo</option></select>
    </div>
    <button class="btn-ghost btn-sm" style="margin-bottom:14px;" onclick="opSaveFunc('${funcId}')">Salvar alterações</button>
    <div class="sec" style="margin-bottom:8px;">Advertências</div>
    <div id="opf-advlist">${advHtml}</div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <input class="f-in" id="opf-newadv" placeholder="Descreva a advertência..." style="flex:1;">
      <button class="btn-ghost btn-sm" onclick="opAddAdv('${funcId}')">+ Adicionar</button>
    </div>`);
}
function opSaveFunc(funcId){
  const f=(S.op.funcionarios||[]).find(x=>x.id===funcId);if(!f)return;
  f.cargo=document.getElementById('opfe-cargo').value.trim();
  f.setor=document.getElementById('opfe-setor').value;
  f.obs=document.getElementById('opfe-obs').value.trim();
  f.status=document.getElementById('opfe-status').value;
  saveLocal();toast('Funcionário atualizado!');renderOperacional();
}
function opAddAdv(funcId){
  const desc=document.getElementById('opf-newadv').value.trim();if(!desc)return;
  const f=(S.op.funcionarios||[]).find(x=>x.id===funcId);if(!f)return;
  if(!f.advertencias)f.advertencias=[];
  f.advertencias.push({id:uid(),desc,data:todayKey(),resolvida:false});
  saveLocal();toast('Advertência registrada.');closeModal();renderOperacional();
}
function opResolveAdv(funcId,idx){const f=(S.op.funcionarios||[]).find(x=>x.id===funcId);if(f?.advertencias?.[idx])f.advertencias[idx].resolvida=true;saveLocal();closeModal();renderOperacional();}
function opDelAdv(funcId,idx){const f=(S.op.funcionarios||[]).find(x=>x.id===funcId);if(f?.advertencias)f.advertencias.splice(idx,1);saveLocal();closeModal();renderOperacional();}

// ── TAB: MARKETING ────────────────────────────────────────────
function opTabMarketing(lojaId){
  const itens=(S.op.marketing||[]).filter(m=>m.loja===lojaId).sort((a,b)=>b.date.localeCompare(a.date));
  const TIPOS={campanha:'Campanha',sugestao:'Sugestão',observacao:'Observação'};
  const TIPO_COR={campanha:'var(--gold)',sugestao:'#60a5fa',observacao:'var(--muted)'};
  const STATUS_MKT={pendente:'Pendente',aprovado:'Aprovado',recusado:'Recusado',andamento:'Em andamento'};
  const cards=itens.map(m=>`<div class="card" style="padding:14px 16px;margin-bottom:8px;">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
      <div style="flex:1;">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px;">
          <span style="font-size:.65rem;padding:2px 8px;border-radius:999px;background:${TIPO_COR[m.tipo]||'var(--muted)'}22;color:${TIPO_COR[m.tipo]||'var(--muted)'};font-weight:700;">${TIPOS[m.tipo]||m.tipo}</span>
          <span style="font-size:.65rem;color:var(--muted);">${fmtDate(m.date)}</span>
        </div>
        <div style="font-size:.9rem;font-weight:700;margin-bottom:4px;">${esc(m.titulo)}</div>
        ${m.desc?`<div style="font-size:.78rem;color:var(--muted);">${esc(m.desc)}</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;align-items:flex-end;">
        <select class="finput" style="font-size:.7rem;padding:3px 6px;width:auto;" onchange="opUpdateMktStatus('${m.id}',this.value)">
          ${Object.entries(STATUS_MKT).map(([k,v])=>`<option value="${k}"${m.status===k?' selected':''}>${v}</option>`).join('')}
        </select>
        <button onclick="opDelMarketing('${m.id}')" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;"></button>
      </div>
    </div>
  </div>`).join('')||'<div class="empty-state">Nenhum item de marketing.</div>';
  return`<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
    <button class="btn-ghost btn-sm" onclick="opOpenNovoMkt('${lojaId}','sugestao')">+ Sugestão</button>
    <button class="btn-ghost btn-sm" onclick="opOpenNovoMkt('${lojaId}','observacao')">+ Observação</button>
    <button class="btn-gold btn-sm" onclick="opOpenNovoMkt('${lojaId}','campanha')">+ Campanha</button>
  </div>${cards}`;
}
function opUpdateMktStatus(id,status){const m=(S.op.marketing||[]).find(x=>x.id===id);if(m){m.status=status;saveLocal();renderOperacional();}}
function opDelMarketing(id){if(!confirm('Remover?'))return;S.op.marketing=(S.op.marketing||[]).filter(x=>x.id!==id);saveLocal();renderOperacional();}
function opOpenNovoMkt(lojaId,tipo){
  openModal(`<h3 style="margin-bottom:16px;">Nova ${tipo==='campanha'?'Campanha':tipo==='sugestao'?'Sugestão':'Observação'}</h3>
    <div class="f-grp"><label class="f-lb">Título *</label><input class="f-in" id="opmk-titulo" placeholder="Descreva em uma linha..."></div>
    <div class="f-grp"><label class="f-lb">Detalhes</label><textarea class="f-in" id="opmk-desc" rows="3" placeholder="Explique melhor a ideia, contexto, referências..."></textarea></div>
    <div id="opmk-err" style="font-size:.74rem;color:var(--red);min-height:14px;"></div>
    <button class="btn-gold" style="width:100%;margin-top:12px;" onclick="opSaveMkt('${lojaId}','${tipo}')">Salvar</button>`);
}
function opSaveMkt(lojaId,tipo){
  const titulo=document.getElementById('opmk-titulo').value.trim();
  if(!titulo){document.getElementById('opmk-err').textContent='Título obrigatório.';return;}
  if(!S.op.marketing)S.op.marketing=[];
  S.op.marketing.push({id:uid(),loja:lojaId,tipo,titulo,desc:document.getElementById('opmk-desc').value.trim(),status:'pendente',date:todayKey(),member:me});
  saveLocal();closeModal();renderOperacional();toast('Registrado!');
}

// ── TAB: ERROS DE PROCESSO ────────────────────────────────────
function opTabErros(lojaId){
  if(!lojaId){
    let html=`<div style="display:flex;flex-direction:column;gap:10px;">`;
    OP_LOJAS.forEach(lj=>{
      const es=(S.op.errosProcesso||[]).filter(e=>e.loja===lj.id&&e.status==='pendente');
      if(!es.length)return;
      const sugest=es.filter(e=>e.tipo==='sugestao').length;
      const errs=es.filter(e=>e.tipo==='erro').length;
      html+=`<div class="card" style="padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border-left:4px solid ${lj.cor};" onclick="window._opLojaView='${lj.id}';window._opTab='erros';renderOperacional()">
        ${opLojaBadge(lj,28)}
        <div style="flex:1;font-weight:600;font-size:.86rem;">${lj.label}</div>
        ${errs?`<span style="font-size:.72rem;padding:2px 9px;border-radius:999px;background:#f8717122;color:#f87171;">${errs} erro${errs>1?'s':''}</span>`:''}
        ${sugest?`<span style="font-size:.72rem;padding:2px 9px;border-radius:999px;background:#22d3ee22;color:#22d3ee;">${sugest} sugestão${sugest>1?'ões':''}</span>`:''}
        <span style="font-size:.7rem;color:var(--muted);">→</span>
      </div>`;
    });
    html+=`</div>`;
    const total=(S.op.errosProcesso||[]).filter(e=>e.status==='pendente').length;
    return total?html:`<div class="empty-state">Nenhuma ocorrência pendente.</div>`;
  }
  const erros=(S.op.errosProcesso||[]).filter(e=>e.loja===lojaId).sort((a,b)=>b.date.localeCompare(a.date));
  const STATUS_EP={pendente:{label:'Pendente',cor:'#fbbf24'},andamento:{label:'Em andamento',cor:'#60a5fa'},resolvido:{label:'Resolvido',cor:'#4ade80'}};
  const cards=erros.map(e=>{
    const st=STATUS_EP[e.status]||STATUS_EP.pendente;
    return`<div class="card" style="padding:14px 16px;margin-bottom:8px;border-left:3px solid ${st.cor};">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
        <div style="flex:1;">
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:5px;">
            <span style="font-size:.65rem;padding:2px 8px;border-radius:999px;background:${st.cor}22;color:${st.cor};font-weight:700;">${st.label}</span>
            ${e.setor?`<span style="font-size:.65rem;color:var(--muted);">${esc(e.setor)}</span>`:''}
            <span style="font-size:.65rem;color:var(--muted);">${fmtDate(e.date)}</span>
          </div>
          <div style="font-size:.9rem;font-weight:700;margin-bottom:4px;">${esc(e.titulo)}</div>
          ${e.desc?`<div style="font-size:.78rem;color:var(--muted);">${esc(e.desc)}</div>`:''}
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;align-items:flex-end;">
          <select class="finput" style="font-size:.7rem;padding:3px 6px;width:auto;" onchange="opUpdateErroStatus('${e.id}',this.value)">
            ${Object.entries(STATUS_EP).map(([k,v])=>`<option value="${k}"${e.status===k?' selected':''}>${v.label}</option>`).join('')}
          </select>
          <button onclick="opDelErro('${e.id}')" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;"></button>
        </div>
      </div>
    </div>`;}).join('')||'<div class="empty-state">Nenhum erro de processo registrado.</div>';
  return`<div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
    <button class="btn-gold btn-sm" onclick="opOpenNovoErro('${lojaId}')">+ Registrar Erro</button>
  </div>${cards}`;
}
function opUpdateErroStatus(id,status){const e=(S.op.errosProcesso||[]).find(x=>x.id===id);if(e){e.status=status;saveLocal();renderOperacional();}}
function opDelErro(id){if(!confirm('Remover?'))return;S.op.errosProcesso=(S.op.errosProcesso||[]).filter(x=>x.id!==id);saveLocal();renderOperacional();}
function opOpenNovoErro(lojaId){
  openModal(`<h3 style="margin-bottom:16px;">Registrar Erro de Processo</h3>
    <div class="f-grp"><label class="f-lb">Título *</label><input class="f-in" id="ope-titulo" placeholder="Ex: Caixa abriu sem conferência"></div>
    <div class="f-grp"><label class="f-lb">Setor</label>
      <select class="f-in" id="ope-setor"><option value="">Geral</option>${opSetores(lojaId).map(s=>`<option>${s}</option>`).join('')}</select>
    </div>
    <div class="f-grp"><label class="f-lb">Descrição do problema</label><textarea class="f-in" id="ope-desc" rows="3" placeholder="O que aconteceu, quando, como foi identificado..."></textarea></div>
    <div id="ope-err" style="font-size:.74rem;color:var(--red);min-height:14px;"></div>
    <button class="btn-gold" style="width:100%;margin-top:12px;" onclick="opSaveErro('${lojaId}')">Registrar</button>`);

function opSaveErro(lojaId){
  const titulo=document.getElementById('ope-titulo').value.trim();
  if(!titulo){document.getElementById('ope-err').textContent='Título obrigatório.';return;}
  if(!S.op.errosProcesso)S.op.errosProcesso=[];
  S.op.errosProcesso.push({id:uid(),loja:lojaId,titulo,setor:document.getElementById('ope-setor').value,desc:document.getElementById('ope-desc').value.trim(),status:'pendente',date:todayKey(),member:me});
  saveLocal();closeModal();renderOperacional();toast('Erro registrado!');
}
