    }

    if(!total){
      html+=`<div class="empty"><div class="ei">–</div><p>Nenhuma rotina ou conta programada para hoje.</p></div>`;
    }else{
      // Separa pendentes e concluídas — concluídas "vão saindo" para o fundo
      const pendItems=[]; // {type:'rot'|'cal', rot?, pk?, ev?, status}
      const doneItems=[];

      dueToday.forEach(({rot,pk})=>{
        const comp=getRotComp(rot.id,pk,viewAs);
        const status=comp?.status==='feito'?'feito':rotStatusNow(rot,viewAs);
        const obj={type:'rot',rot,pk,comp,status};
        if(status==='feito')doneItems.push(obj); else pendItems.push(obj);
      });
      calEvToday.forEach(ev=>{
        const comp=(S.rotinas?.completions||{})['cal::'+ev.id];
        const isDone=comp?.status==='feito';
        const obj={type:'cal',ev,comp,status:isDone?'feito':'pendente'};
        if(isDone)doneItems.push(obj); else pendItems.push(obj);
      });
      // Contas a pagar do dia
      contasHoje.forEach(({loja,conta,ym})=>{
        const pago=isContaPaga(conta.id,ym);
        if(pago)doneItems.push({type:'conta',loja,conta,ym});
        else pendItems.push({type:'conta',loja,conta,ym});
      });

      // Render card for calendar event
      function calCheckCard(ev,comp){
        const isDone=comp?.status==='feito';
        return`<div class="rot-check-card${isDone?' feito':''}">
          <div class="rot-check-card-bar" style="background:#8b5cf6"></div>
          <button class="rot-check-btn ${isDone?'feito':'pendente'}" onclick="rotMarkCalDone('${ev.id}')" title="${isDone?'Clique para desmarcar':'Marcar como feita'}">
            ${isDone?'':'○'}
          </button>
          <div class="rot-check-info">
            <div class="rot-check-title">${esc(ev.title)}</div>
            <div class="rot-check-meta">
              <span class="rot-check-freq" style="color:#8b5cf6;border-color:#8b5cf644;background:#8b5cf612">Esporádica</span>
              ${ev.desc?`<span style="font-size:.65rem;color:var(--muted)">${esc(ev.desc)}</span>`:''}
              ${isDone&&comp?.at?`<span class="rot-check-stamp">Concluída às ${comp.at}</span>`:''}
            </div>
          </div>
        </div>`;
      }

      // Render card for conta a pagar
      function contaCheckCard(loja,conta,ym){
        const pago=isContaPaga(conta.id,ym);
        const pg=getContaPag(conta.id,ym);
        const cor=loja.cor||'var(--gold)';
        return`<div class="rot-check-card${pago?' feito':''}">
          <div class="rot-check-card-bar" style="background:${cor}"></div>
          <button class="rot-check-btn ${pago?'feito':'pendente'}" onclick="marcarContaPaga('${conta.id}','${ym}')" title="${pago?'Clique para desmarcar':'Marcar como pago'}">
            ${pago?'':'○'}
          </button>
          <div class="rot-check-info">
            <div class="rot-check-title">${esc(conta.nome)}</div>
            <div class="rot-check-meta">
              <span class="rot-check-freq" style="color:${cor};border-color:${cor}44;background:${cor}15">${loja.nome}</span>
              ${pago&&pg?`<span class="rot-check-stamp">Pago às ${pg.at}</span>`:''}
            </div>
          </div>
          <button class="btn-ghost btn-sm" style="flex-shrink:0;font-size:.62rem;" onclick="window._cpLoja='${loja.id}';goPanel('contas')">Ver loja →</button>
        </div>`;
      }

      // Render pending items
      if(pendItems.length){
        // Separar seção de contas das rotinas normais
        const pendRot=pendItems.filter(o=>o.type!=='conta');
        const pendContas=pendItems.filter(o=>o.type==='conta');
        pendRot.forEach(obj=>{
          if(obj.type==='rot')html+=checkCard(obj.rot,obj.pk,viewAs,obj.comp,obj.status);
          else html+=calCheckCard(obj.ev,obj.comp);
        });
        if(pendContas.length){
          html+=`<div style="font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin:16px 0 6px;">Contas a Pagar Hoje <span style="opacity:.6">${doneContas}/${totalContas}</span></div>`;
          pendContas.forEach(obj=>html+=contaCheckCard(obj.loja,obj.conta,obj.ym));
        }
      }

      // Render done items in collapsible section
      if(doneItems.length){
        const concShow=!!window._rotConcluidas;
        html+=`<div style="margin-top:16px;">
          <button onclick="window._rotConcluidas=!${concShow};renderRotinas()" style="display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;color:var(--muted);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:0;">
            <span style="transition:.2s;display:inline-block;transform:rotate(${concShow?90:0}deg);">▶</span>
            Concluídas hoje (${doneItems.length})
          </button>`;
        if(concShow){
          html+=`<div style="margin-top:8px;">`;
          doneItems.forEach(obj=>{
            if(obj.type==='rot')html+=checkCard(obj.rot,obj.pk,viewAs,obj.comp,obj.status);
            else if(obj.type==='cal')html+=calCheckCard(obj.ev,obj.comp);
            else html+=contaCheckCard(obj.loja,obj.conta,obj.ym);
          });
          html+=`</div>`;
        }
        html+=`</div>`;
      }
    }
  }

  /* ─── ABA: PENDENTES ─── */
  else if(tab==='pendentes'){
    const lookback=30;
    const members=isL?Object.keys(M):[me];
    const overdue=[];
    for(let i=1;i<=lookback;i++){
      const d=new Date(today);d.setDate(today.getDate()-i);
      members.forEach(uid=>{
        if(!M[uid])return;
        rotasDueOn(d,uid).forEach(({rot,pk})=>{
          const comp=getRotComp(rot.id,pk,uid);
          if(!comp||comp.status!=='feito'){
            overdue.push({date:new Date(d),daysAgo:i,member:uid,rot,pk});
          }
        });
      });
    }
    overdue.sort((a,b)=>a.member.localeCompare(b.member)||a.daysAgo-b.daysAgo);

    if(!overdue.length){
      html+=`<div style="text-align:center;padding:50px 20px;color:var(--muted);">
        <div style="font-size:2.5rem;margin-bottom:10px;"></div>
        <div style="font-weight:700;font-size:1rem;color:var(--text)">Nenhuma pendência nos últimos ${lookback} dias!</div>
        <div style="font-size:.8rem;margin-top:6px;">Tudo entregue em dia.</div>
      </div>`;
    } else {
      // Agrupar por membro
      const byMember={};
      overdue.forEach(item=>{
        if(!byMember[item.member])byMember[item.member]=[];
        byMember[item.member].push(item);
      });

      // Resumo geral (só líderes)
      if(isL){
        const totalPend=overdue.length;
        const membersAffected=Object.keys(byMember).length;
        html+=`<div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:12px;padding:14px 16px;margin-bottom:18px;display:flex;align-items:center;gap:14px;">
          <div style="font-size:1.6rem;"></div>
          <div>
            <div style="font-weight:700;color:#ef4444;font-size:.95rem;">${totalPend} rotina${totalPend>1?'s':''} não entregue${totalPend>1?'s':''} nos últimos ${lookback} dias</div>
            <div style="font-size:.75rem;color:var(--muted);margin-top:2px;">${membersAffected} membro${membersAffected>1?'s':''} com pendência</div>
          </div>
        </div>`;
      }

      Object.entries(byMember).forEach(([uid,items])=>{
        const mv=M[uid];if(!mv)return;
        // Agrupar por data dentro do membro
        const byDate={};
        items.forEach(item=>{
          const dk=item.date.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'});
          if(!byDate[dk])byDate[dk]=[];
          byDate[dk].push(item);
        });

        html+=`<div style="margin-bottom:20px;border:1px solid var(--line2);border-radius:12px;overflow:hidden;">
          <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line);">
            <div style="width:30px;height:30px;border-radius:50%;background:${mv.color||'#888'};display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:800;color:#fff;flex-shrink:0;">${mv.icon||uid.slice(0,2).toUpperCase()}</div>
            <div>
              <div style="font-weight:700;font-size:.88rem;">${mv.name}</div>
              <div style="font-size:.68rem;color:var(--muted)">${mv.role||''}</div>
            </div>
            <div style="margin-left:auto;background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25);border-radius:999px;padding:2px 10px;font-size:.7rem;font-weight:800;">${items.length} pendente${items.length>1?'s':''}</div>
          </div>
          <div style="padding:10px 14px;">`;

        Object.entries(byDate).forEach(([dateLabel,dateItems])=>{
          html+=`<div style="margin-bottom:10px;">
            <div style="font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;gap:6px;">${dateLabel}
              <span style="color:#ef4444;font-weight:700">(${dateItems[0].daysAgo} dia${dateItems[0].daysAgo>1?'s':''} atrás)</span>
            </div>`;
          dateItems.forEach(({rot,pk,member})=>{
            const hasCampos=rot.campos&&rot.campos.length;
            const clickFn=hasCampos?`openCompModal('${rot.id}','${pk}','${member}')`:`rotMarkDoneFast('${rot.id}','${pk}','${member}')`;
            html+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.15);border-radius:8px;margin-bottom:4px;">
              <div style="width:6px;height:6px;border-radius:50%;background:#ef4444;flex-shrink:0;"></div>
              <div style="flex:1;min-width:0;">
                <div style="font-size:.8rem;font-weight:600;">${rot.icon||''} ${esc(rot.titulo)}</div>
                <div style="font-size:.63rem;color:#ef4444;font-weight:600;margin-top:1px;">Não entregue</div>
              </div>
              <button class="btn-ghost btn-sm" style="font-size:.65rem;flex-shrink:0;color:var(--gold);border-color:var(--gold)44;" onclick="${clickFn}">Registrar</button>
            </div>`;
          });
          html+=`</div>`;
        });
        html+=`</div></div>`;
      });
    }
  }

  /* ─── ABA: ESTA SEMANA ─── */
  else if(tab==='semana'){
    const viewAs=(isL&&window._rotViewAs)||me;
    // Segunda a sexta (trabalhando seg-sex)
    const dow=today.getDay();
    const seg=new Date(today); seg.setDate(today.getDate()-(dow===0?6:dow-1));
    const weekDays=Array.from({length:5},(_,i)=>{const d=new Date(seg);d.setDate(seg.getDate()+i);return d;}); // Seg a Sex
    const dayNamesShort=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

    if(isL&&window._rotViewAs){
      const vM=M[viewAs];
      html+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 14px;background:var(--panel2);border-radius:10px;">
        <div style="width:26px;height:26px;border-radius:50%;background:${vM?.color||'#3b82f6'};display:flex;align-items:center;justify-content:center;font-size:.58rem;font-weight:800;color:#fff;">${vM?.icon||viewAs.slice(0,2).toUpperCase()}</div>
        <span style="font-size:.8rem;font-weight:700">Semana de ${vM?.name||viewAs}</span>
        <button class="btn-ghost btn-sm" style="margin-left:auto" onclick="delete window._rotViewAs;renderRotinas()">← Voltar</button>
      </div>`;
    }

    weekDays.forEach(day=>{
      const isToday=day.toDateString()===today.toDateString();
      const isPast=day<today&&!isToday;
      const dayStr=`${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;
      const items=rotasDueOn(day,viewAs);
      const calEvDay=(S.calendar||[]).filter(e=>e.date===dayStr&&(e.assignedTo===viewAs||(!e.assignedTo&&e.member===viewAs)));
      const doneN=items.filter(({rot,pk})=>getRotComp(rot.id,pk,viewAs)?.status==='feito').length
               +calEvDay.filter(e=>(S.rotinas?.completions||{})['cal::'+e.id]?.status==='feito').length;
      const totalDay=items.length+calEvDay.length;
      const dayLabel=`${dayNamesShort[day.getDay()]}, ${day.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}`;
      const allOk=totalDay>0&&doneN===totalDay;

      html+=`<div class="rot-semana-day${isToday?' hoje-col':isPast?' passou':''}">
        <div class="rot-semana-hd">
          <div class="rot-semana-day-name">${dayLabel}</div>
          ${isToday?`<span class="rot-semana-badge" style="background:rgba(201,169,110,.15);color:var(--gold);">Hoje</span>`:''}
          ${totalDay?`<span class="rot-semana-badge" style="margin-left:auto;background:${allOk?'rgba(34,197,94,.12)':'var(--panel2)'};color:${allOk?'var(--green)':'var(--muted)'};">${doneN}/${totalDay}</span>`:''}
        </div>`;
      if(!totalDay){
        html+=`<div class="rot-empty-day">Nenhuma rotina</div>`;
      }else{
        items.forEach(({rot,pk})=>{
          const comp=getRotComp(rot.id,pk,viewAs);
          const status=comp?.status==='feito'?'feito':rotStatusNow(rot,viewAs);
          const isDone=status==='feito';
          const cor=rot.color||'#3b82f6';
          const hasCampos=rot.campos&&rot.campos.length;
          const clickFn=hasCampos?`openCompModal('${rot.id}','${pk}','${viewAs}')`:`rotMarkDoneFast('${rot.id}','${pk}','${viewAs}')`;
          html+=`<div class="rot-semana-item">
            <div class="rot-semana-dot" style="background:${isDone?'var(--green)':cor};"></div>
            <div style="flex:1;min-width:0;">
              <div style="font-size:.8rem;font-weight:600;${isDone?'text-decoration:line-through;opacity:.6':''}">${rot.icon||''} ${esc(rot.titulo)}</div>
              <div style="font-size:.65rem;color:var(--muted);margin-top:1px;">${freqLabel[rot.freq]||rot.freq}</div>
            </div>
            <button onclick="${clickFn}" style="font-size:.7rem;padding:3px 10px;border-radius:999px;border:1px solid ${isDone?'var(--green)':'var(--line2)'};background:${isDone?'rgba(34,197,94,.1)':'transparent'};color:${isDone?'var(--green)':'var(--muted)'};cursor:pointer;">
              ${isDone?'Feita':'Marcar'}
            </button>
          </div>`;
        });
        // Tarefas esporádicas do calendário
        calEvDay.forEach(ev=>{
          const isDone=(S.rotinas?.completions||{})['cal::'+ev.id]?.status==='feito';
          html+=`<div class="rot-semana-item">
            <div class="rot-semana-dot" style="background:${isDone?'var(--green)':'#8b5cf6'};"></div>
            <div style="flex:1;min-width:0;">
              <div style="font-size:.8rem;font-weight:600;${isDone?'text-decoration:line-through;opacity:.6':''}">${esc(ev.title)}</div>
              <div style="font-size:.65rem;color:#8b5cf6;margin-top:1px;">Esporádica</div>
            </div>
            <button onclick="rotMarkCalDone('${ev.id}')" style="font-size:.7rem;padding:3px 10px;border-radius:999px;border:1px solid ${isDone?'var(--green)':'var(--line2)'};background:${isDone?'rgba(34,197,94,.1)':'transparent'};color:${isDone?'var(--green)':'var(--muted)'};cursor:pointer;">
              ${isDone?'Feita':'Marcar'}
            </button>
          </div>`;
        });
      }
      html+=`</div>`;
    });
  }

  /* ─── ABA: TODAS ─── */
  else if(tab==='todas'){
    const freqFilter=window._rotFreq||'todas';
    const viewAs=(isL&&window._rotViewAs)||me;
    if(isL&&window._rotViewAs){
      const vM=M[viewAs];
      html+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 14px;background:var(--panel2);border-radius:10px;">
        <div style="width:26px;height:26px;border-radius:50%;background:${vM?.color||'#3b82f6'};display:flex;align-items:center;justify-content:center;font-size:.58rem;font-weight:800;color:#fff;">${vM?.icon||viewAs.slice(0,2).toUpperCase()}</div>
        <span style="font-size:.8rem;font-weight:700">Rotinas de ${vM?.name||viewAs}</span>
        <button class="btn-ghost btn-sm" style="margin-left:auto" onclick="delete window._rotViewAs;renderRotinas()">← Voltar</button>
      </div>`;
    }
    html+=`<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;">
      ${['todas','diaria','semanal','quinzenal','mensal'].map(f=>`<button class="ev-type-btn${freqFilter===f?' sel':''}" onclick="window._rotFreq='${f}';renderRotinas()">${f==='todas'?'Todas':freqLabel[f]}</button>`).join('')}
    </div>`;
    const viewDefs=defs.filter(r=>r.assignees.includes(viewAs)&&(freqFilter==='todas'||r.freq===freqFilter));
    if(!viewDefs.length){html+=`<div class="empty"><div class="ei">–</div><p>Nenhuma rotina encontrada.</p></div>`;}
    else{
      const groups={diaria:[],semanal:[],quinzenal:[],mensal:[]};
      viewDefs.forEach(r=>{if(groups[r.freq])groups[r.freq].push(r);else groups.mensal.push(r);});
      ['diaria','semanal','quinzenal','mensal'].forEach(freq=>{
        const grp=groups[freq];if(!grp.length)return;
        const fDone=grp.filter(r=>rotStatusNow(r,viewAs)==='feito').length;
        html+=`<div class="rot-section-hd">${freqLabel[freq]} <span style="color:${fDone===grp.length?'var(--green)':'var(--muted)'};font-size:.6rem;font-weight:700;">${fDone}/${grp.length}</span></div>`;
        grp.forEach(rot=>{
          const pk=rotPeriodKey(rot);
          const comp=getRotComp(rot.id,pk,viewAs);
          const status=rotStatusNow(rot,viewAs);
          const expKey='_rotExp_'+rot.id;
          const isOpen=!!window[expKey];
          const statusLabel={feito:'Feito',parcial:'◑ Parcial',atrasado:'! Atrasado',pendente:'◷ Pendente'};
          const canEdit=!rot.isLeader||isL;
          html+=`<div class="rot-card">
            <div class="rot-card-bar" style="background:${rot.color||'var(--blue)'}"></div>
            <div class="rot-card-body" onclick="window['${expKey}']=!${isOpen};renderRotinas()">
              <div class="rot-icon" style="background:${rot.color||'var(--blue)'}22">${rot.icon||''}</div>
              <div class="rot-info">
                <div class="rot-title">${esc(rot.titulo)}${rot.isLeader?'<span class="rot-locked"></span>':''}</div>
                <div class="rot-desc">${esc(rot.desc)}</div>
                <div class="rot-meta">
                  <span class="rot-freq" style="color:${freqColor[rot.freq]||'#888'};border-color:${freqColor[rot.freq]||'#888'}44;background:${freqColor[rot.freq]||'#888'}11">${freqLabel[rot.freq]||rot.freq}</span>
                  ${rot.assignees.map(a=>M[a]?`<span class="rot-assignee">${M[a].name}</span>`:'').join('')}
                </div>
              </div>
              <div class="rot-status-badge ${status}" onclick="event.stopPropagation();openCompModal('${rot.id}','${pk}','${viewAs}')">${statusLabel[status]||status}</div>
            </div>`;
          if(isOpen){
            html+=`<div class="rot-detail"><div class="rot-detail-inner">`;
            if(comp){
              if(comp.comoFoi)html+=`<div class="rot-comp-field"><div class="rot-comp-label">Como foi feito</div><div class="rot-comp-val">${esc(comp.comoFoi)}</div></div>`;
              if(comp.obs)html+=`<div class="rot-comp-field"><div class="rot-comp-label">Obs.</div><div class="rot-comp-val">${esc(comp.obs)}</div></div>`;
              if(rot.campos&&comp.campos){rot.campos.forEach(cf=>{const v=comp.campos[cf.id];if(v!==undefined&&v!=='')html+=`<div class="rot-comp-field"><div class="rot-comp-label">${esc(cf.label)}</div><div class="rot-comp-val">${v==='sim'?'Sim':v==='nao'?'Não':esc(String(v))}</div></div>`;});}
              html+=`<div class="rot-hist">Registrado por ${M[comp.by]?.name||comp.by} em ${comp.at||'—'}</div>`;
            }else{html+=`<div style="font-size:.8rem;color:var(--muted);font-style:italic;">Ainda não registrado neste período.</div>`;}
            html+=`<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
              <button class="btn-gold btn-sm" onclick="openCompModal('${rot.id}','${pk}','${viewAs}')">${comp?'Editar':'Registrar'}</button>
              ${canEdit?`<button class="btn-ghost btn-sm" onclick="openRotModal('${rot.id}')">Editar rotina</button>`:''}
              ${!rot.isLeader?`<button class="btn-ghost btn-sm" style="color:#f87171;" onclick="deleteRot('${rot.id}')">Excluir</button>`:''}
            </div></div></div>`;
          }
          html+=`</div>`;
        });
      });
    }
  }

  /* ─── ABA: CADASTRO (catálogo completo para líderes) ─── */
  else if(tab==='cadastro'&&isL){
    const cadFreq=window._cadFreq||'todas';
    const cadMember=window._cadMember||'todos';
    const freqGroups=[
      {id:'diaria',   label:'Diárias',    icon:'️', color:'#14b8a6'},
      {id:'semanal',  label:'Semanais',   icon:'', color:'#3b82f6'},
      {id:'quinzenal',label:'Quinzenais', icon:'️', color:'#8b5cf6'},
      {id:'mensal',   label:'Mensais',    icon:'', color:'#f59e0b'},
    ];
    const dayNames={1:'Segunda',2:'Terça',3:'Quarta',4:'Quinta',5:'Sexta'};

    // Filtros
    const memberKeys=Object.keys(M).filter(k=>M[k]&&(defs||[]).some(r=>r.assignees.includes(k)));
    html+=`<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
      <span style="font-size:.7rem;font-weight:700;color:var(--muted);align-self:center;text-transform:uppercase;letter-spacing:.06em;">Frequência:</span>
      ${['todas',...freqGroups.map(f=>f.id)].map(f=>{
        const lbl=f==='todas'?'Todas':freqGroups.find(x=>x.id===f)?.label||f;
        return`<button class="ev-type-btn${cadFreq===f?' sel':''}" onclick="window._cadFreq='${f}';renderRotinas()">${lbl}</button>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;">
      <span style="font-size:.7rem;font-weight:700;color:var(--muted);align-self:center;text-transform:uppercase;letter-spacing:.06em;">Pessoa:</span>

      ${memberKeys.map(k=>`<button class="ev-type-btn${cadMember===k?' sel':''}" style="border-color:${M[k].color}55;" onclick="window._cadMember='${k}';renderRotinas()">${M[k].name.split(' ')[0]}</button>`).join('')}
    </div>`;

    // Total
    const allDefs=(defs||[]).filter(r=>
      (cadFreq==='todas'||r.freq===cadFreq)&&
      (cadMember==='todos'||r.assignees.includes(cadMember))
    );
    html+=`<div style="font-size:.72rem;color:var(--muted);margin-bottom:14px;font-weight:600;">${allDefs.length} rotina${allDefs.length!==1?'s':''} cadastrada${allDefs.length!==1?'s':''}</div>`;

    if(!allDefs.length){
      html+=`<div class="empty"><div class="ei">–</div><p>Nenhuma rotina encontrada com esses filtros.</p></div>`;
    } else {
      freqGroups.forEach(({id:freq,label,icon,color})=>{
        const grp=allDefs.filter(r=>r.freq===freq);

        html+=`<div style="margin-bottom:24px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid ${color}33;">

            <span style="font-weight:800;font-size:.9rem;color:${color};">${label}</span>

        // Agrupar semanais por dia da semana
        if(freq==='semanal'){
          const byDay={};
          grp.forEach(r=>{
            const d=r.diaSemana||0;
            if(!byDay[d])byDay[d]=[];
            byDay[d].push(r);
          });
          Object.keys(byDay).sort((a,b)=>a-b).forEach(d=>{
            html+=`<div style="margin-bottom:8px;">
              <div style="font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px;">${dayNames[d]||'Sem dia'}</div>`;
            byDay[d].forEach(rot=>{
              html+=cadRotCard(rot,color);
            });
            html+=`</div>`;
          });
        }
        // Agrupar mensais por dia do mês
        else if(freq==='mensal'){
          const byDia={};
          grp.forEach(r=>{
            const d=r.diaMes||0;
            if(!byDia[d])byDia[d]=[];
            byDia[d].push(r);
          });
          Object.keys(byDia).sort((a,b)=>a-b).forEach(d=>{
            html+=`<div style="margin-bottom:8px;">
              <div style="font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px;">Dia ${d}</div>`;
            byDia[d].forEach(rot=>{
              html+=cadRotCard(rot,color);
            });
            html+=`</div>`;
          });
        }
        // Diárias e quinzenais — lista simples
        else{
          grp.forEach(rot=>{ html+=cadRotCard(rot,color); });
        }

        html+=`</div>`;
      });
    }

    function cadRotCard(rot,freqColor){
      const membros=rot.assignees.map(a=>M[a]).filter(Boolean);
      const expKey='_cadExp_'+rot.id;
      const isOpen=!!window[expKey];
      return`<div style="border:1px solid var(--line2);border-radius:10px;margin-bottom:6px;overflow:hidden;">
        <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;background:var(--panel);" onclick="window['${expKey}']=!${isOpen};renderRotinas()">
          <div style="width:34px;height:34px;border-radius:8px;background:${rot.color||freqColor}18;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;">${rot.icon||''}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:.85rem;font-weight:700;">${esc(rot.titulo)}</div>
            <div style="display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap;">
              ${membros.map(m=>`<span style="display:inline-flex;align-items:center;gap:3px;font-size:.62rem;font-weight:700;padding:1px 7px;border-radius:999px;background:${m.color}18;color:${m.color};">${m.icon} ${m.name.split(' ')[0]}</span>`).join('')}
            </div>
          </div>
          <span style="font-size:.7rem;color:var(--muted);flex-shrink:0;">${isOpen?'▲':'▼'}</span>
        </div>
        ${isOpen?`<div style="padding:10px 14px 14px;background:var(--panel2);border-top:1px solid var(--line);">
          <div style="font-size:.78rem;color:var(--text);line-height:1.5;margin-bottom:10px;">${esc(rot.desc)}</div>
          ${rot.campos&&rot.campos.length?`<div style="font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px;">Campos de preenchimento</div>
          <div style="display:flex;flex-direction:column;gap:4px;">
            ${rot.campos.map(cf=>`<div style="font-size:.74rem;padding:4px 8px;background:var(--panel3);border-radius:6px;">• ${esc(cf.label)} <span style="color:var(--muted)">(${cf.tipo})</span></div>`).join('')}
          </div>`:``}
          <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;">
            ${(!rot.isLeader||isL)?`<button class="btn-ghost btn-sm" onclick="openRotModal('${rot.id}')">Editar rotina</button>`:''}
          </div>
        </div>`:''}
      </div>`;
    }
  }

  /* ─── ABA: CONTAS DO MÊS ─── */
  else if(tab==='contas'&&showContas){
    if(!S.contasPagar)S.contasPagar=defContasPagar();
    const now2=new Date();
    const ymNow=cpMonthKey();
    const mNames2=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const lojas=S.contasPagar.lojas||[];
    const todayD=now2.getDate();
    const selLojaRot=window._rotContaLoja||'todas';

    // Totals
    const totalM=lojas.reduce((s,l)=>s+(l.contas||[]).filter(c=>c.dia).length,0);
    const pagoM=lojas.reduce((s,l)=>s+(l.contas||[]).filter(c=>c.dia&&isContaPaga(c.id,ymNow)).length,0);
    const pctM=totalM?Math.round(pagoM/totalM*100):0;
    const corM=pctM===100?'var(--green)':pctM>60?'var(--gold)':'#f59e0b';

    html+=`<div class="rot-progress-box">
      <div class="rot-prog-row">
        <span style="font-size:.8rem;color:var(--muted);">Todas as lojas · ${mNames2[now2.getMonth()]} ${now2.getFullYear()}</span>
        <span class="rot-prog-label" style="color:${corM}">${pagoM}/${totalM} pagas</span>
      </div>
      <div class="rot-prog-track"><div class="rot-prog-fill" style="width:${pctM}%;background:${corM};"></div></div>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;">
      <button class="ev-type-btn${selLojaRot==='todas'?' sel':''}" onclick="window._rotContaLoja='todas';renderRotinas()">Todas</button>
      ${lojas.map(l=>`<button class="ev-type-btn${selLojaRot===l.id?' sel':''}" onclick="window._rotContaLoja='${l.id}';renderRotinas()" style="${selLojaRot===l.id?`border-color:${l.cor};color:${l.cor};`:''}">${l.nome}</button>`).join('')}
    </div>`;

    // Build full list grouped by day
    const byDay={};
    lojas.forEach(loja=>{
      if(selLojaRot!=='todas'&&loja.id!==selLojaRot)return;
      (loja.contas||[]).filter(c=>c.dia).forEach(c=>{
        if(!byDay[c.dia])byDay[c.dia]=[];
        byDay[c.dia].push({loja,conta:c});
      });
    });
    const sortedD=Object.keys(byDay).map(Number).sort((a,b)=>a-b);
    if(!sortedD.length){html+=`<div class="empty"><div class="ei">–</div><p>Nenhuma conta com data definida.</p></div>`;}
    else{
      sortedD.forEach(d=>{
        const items=byDay[d];
        const isPast=d<todayD;
        const isToday=d===todayD;
        const pagoD=items.filter(({conta})=>isContaPaga(conta.id,ymNow)).length;
        const allPaidD=pagoD===items.length;
        const hasLate=isPast&&!allPaidD;
        html+=`<div class="rot-semana-day${isToday?' hoje-col':''}">
          <div class="rot-semana-hd">
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="width:30px;height:30px;border-radius:8px;background:${isToday?'var(--gold)':'var(--panel2)'};border:1px solid ${isToday?'var(--gold)':'var(--line)'};display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:900;color:${isToday?'#fff':'var(--muted)'};flex-shrink:0;">dia ${d}</div>
              ${isToday?`<span class="rot-semana-badge" style="background:rgba(201,169,110,.15);color:var(--gold);">Hoje</span>`:''}
              ${hasLate?`<span class="rot-semana-badge" style="background:rgba(239,68,68,.12);color:#f87171;">Pendente</span>`:''}
            </div>
            <span class="rot-semana-badge" style="background:${allPaidD?'rgba(34,197,94,.12)':'var(--panel2)'};color:${allPaidD?'var(--green)':'var(--muted)'};">${pagoD}/${items.length}</span>
          </div>`;
        items.forEach(({loja,conta})=>{
          const pago=isContaPaga(conta.id,ymNow);
          const pg=getContaPag(conta.id,ymNow);
          const cor=loja.cor||'var(--gold)';
          html+=`<div style="display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.04);">
            <button onclick="marcarContaPaga('${conta.id}','${ymNow}')"
              style="width:28px;height:28px;border-radius:50%;border:2px solid ${pago?'var(--green)':'rgba(255,255,255,.18)'};background:${pago?'var(--green)':'transparent'};color:${pago?'#fff':'var(--muted)'};font-size:.8rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:var(--tr);">
              ${pago?'':'○'}
            </button>
            <div style="flex:1;min-width:0;">
              <div style="font-size:.86rem;font-weight:${pago?400:600};${pago?'text-decoration:line-through;opacity:.45':''};">${esc(conta.nome)}</div>
              <div style="display:flex;align-items:center;gap:6px;margin-top:2px;">
                <span style="font-size:.62rem;font-weight:700;color:${cor};">${loja.nome}</span>
                ${pago&&pg?`<span style="font-size:.62rem;color:var(--green);">${M[pg.by]?.name||pg.by} · ${pg.at}</span>`:''}
              </div>
            </div>
          </div>`;
        });
        html+=`</div>`;
      });
    }
  }

  /* ─── ABA: VISÃO GERAL (líder) ─── */
  else if(tab==='visao'&&isL){
    const members=Object.entries(M).filter(([k,v])=>v&&v.name&&k!=='marlon');
    html+=`<div style="font-size:.72rem;color:var(--muted);margin-bottom:12px;">Rotinas de hoje por colaborador</div>`;
    html+=`<div class="card" style="padding:0;overflow:hidden;">`;
    members.forEach(([mid,mem])=>{
      const dueT=rotasDueOn(today,mid);
      const doneT=dueT.filter(({rot,pk})=>getRotComp(rot.id,pk,mid)?.status==='feito').length;
      const lateT=dueT.filter(({rot,pk})=>{const s=rotStatusNow(rot,mid);return s==='atrasado';}).length;
      const av=M[mid];
      const pct2=dueT.length?Math.round(doneT/dueT.length*100):0;
      html+=`<div class="rot-overview-row" onclick="window._rotTab='hoje';window._rotViewAs='${mid}';renderRotinas()" style="cursor:pointer;">
        <div style="width:28px;height:28px;border-radius:50%;background:${av.color||'#3b82f6'};display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:800;color:#fff;flex-shrink:0;">${av.icon||mid.slice(0,2).toUpperCase()}</div>
        <div style="flex:1;min-width:0;">
          <div class="rot-ov-name">${av.name}</div>
          <div style="margin-top:4px;height:4px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden;max-width:120px;">
            <div style="height:100%;border-radius:999px;background:${pct2===100?'var(--green)':'var(--gold)'};width:${pct2}%;transition:width .3s;"></div>
          </div>
        </div>
        <div class="rot-ov-stats">
          ${dueT.length?`<span class="rot-ov-pill" style="background:rgba(34,197,94,.1);color:var(--green)">${doneT}/${dueT.length} hoje</span>`:'<span style="font-size:.7rem;color:var(--muted)">Sem rotinas hoje</span>'}
          ${lateT?`<span class="rot-ov-pill" style="background:rgba(239,68,68,.1);color:#f87171">! ${lateT} atrasada${lateT>1?'s':''}</span>`:''}
        </div>
        <span style="font-size:.6rem;color:var(--muted)">Ver →</span>
      </div>`;
    });
    html+=`</div>`;
  }

  document.getElementById('p-rotinas').innerHTML=html;
}

function openCompModal(rotId,periodKey,assignee){
  const rot=(S.rotinas.defs||[]).find(r=>r.id===rotId);
  if(!rot)return;
  const existing=getRotComp(rotId,periodKey,assignee)||{};
  const links=existing.links||[{label:'',url:''}];
  const campos=existing.campos||{};
  const fLabel={semanal:'Semanal',quinzenal:'Quinzenal',mensal:'Mensal'};

  let linksHtml=links.map((l,i)=>`
    <div style="display:flex;gap:6px;margin-bottom:6px;">
      <input class="inp" placeholder="Nome / descrição" value="${esc(l.label)}" id="rlink_lbl_${i}" style="flex:1">
      <input class="inp" placeholder="https://..." value="${esc(l.url)}" id="rlink_url_${i}" style="flex:2">
      <button class="btn-ghost btn-sm" onclick="rotRemoveLink(${i})"></button>

  let camposHtml='';

    camposHtml=`<div style="margin-top:14px;"><div style="font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;">Campos específicos desta rotina</div>`;

      const v=campos[cf.id]||'';
      if(cf.tipo==='sim-nao'){
        camposHtml+=`<label style="font-size:.78rem;color:var(--muted);display:block;margin-bottom:6px;">${esc(cf.label)}</label>
        <div style="display:flex;gap:8px;margin-bottom:10px;">
          <button class="ev-type-btn${v==='sim'?' sel':''}" onclick="document.getElementById('rcf_${cf.id}').value='sim';this.parentElement.querySelectorAll('.ev-type-btn').forEach(b=>b.classList.remove('sel'));this.classList.add('sel')">Sim</button>
          <button class="ev-type-btn${v==='nao'?' sel':''}" onclick="document.getElementById('rcf_${cf.id}').value='nao';this.parentElement.querySelectorAll('.ev-type-btn').forEach(b=>b.classList.remove('sel'));this.classList.add('sel')">Não</button>
          <input type="hidden" id="rcf_${cf.id}" value="${v}">
        </div>`;
      }else{
        camposHtml+=`<label style="font-size:.78rem;color:var(--muted);display:block;margin-bottom:4px;">${esc(cf.label)}</label>
        <input class="inp" id="rcf_${cf.id}" value="${esc(String(v))}" style="margin-bottom:10px;" placeholder="${cf.tipo==='number'?'0':'...'}" type="${cf.tipo==='number'?'number':'text'}">`;
      }

    camposHtml+=`</div>`;
  }

  openModal(`<div style="max-width:520px;margin:0 auto;">

    <div style="font-size:.7rem;color:var(--muted);margin-bottom:16px;">${fLabel[rot.freq]||rot.freq} · Período: ${periodKey}</div>
    <label class="lbl">Status</label>
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
      ${['feito','parcial','pendente'].map(s=>`<button class="ev-type-btn${(existing.status||'pendente')===s?' sel':''}" onclick="document.getElementById('rcomp_status').value='${s}';this.parentElement.querySelectorAll('.ev-type-btn').forEach(b=>b.classList.remove('sel'));this.classList.add('sel')">${s==='feito'?'Feito':s==='parcial'?'◑ Feito parcialmente':'⏸ Ainda pendente'}</button>`).join('')}
      <input type="hidden" id="rcomp_status" value="${existing.status||'pendente'}">
    </div>

    <textarea class="inp" id="rcomp_como" rows="3" placeholder="Descreva como foi realizado, o que foi feito, resultados obtidos...">${esc(existing.comoFoi||'')}</textarea>
    <label class="lbl" style="margin-top:10px;">Observações adicionais</label>
    <textarea class="inp" id="rcomp_obs" rows="2" placeholder="Ressalvas, problemas encontrados, pontos de atenção...">${esc(existing.obs||'')}</textarea>
    <label class="lbl" style="margin-top:10px;">Links / Arquivos <span style="font-size:.68rem;color:var(--muted);font-weight:400">(planilhas, documentos, fotos...)</span></label>
    <div id="rlinks_wrap">${linksHtml}</div>
    <button class="btn-ghost btn-sm" onclick="rotAddLink()">+ Adicionar link</button>
    ${camposHtml}
    <div style="display:flex;gap:8px;margin-top:18px;">
      <button class="btn-gold" onclick="saveComp('${rotId}','${periodKey}','${assignee}',${rot.campos?rot.campos.length:0})">Salvar</button>
      <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>
  </div>`);
}

window._rotLinkCount=0;
function rotAddLink(){
  const wrap=document.getElementById('rlinks_wrap');
  const i=Date.now();
  wrap.insertAdjacentHTML('beforeend',`<div style="display:flex;gap:6px;margin-bottom:6px;" id="rlink_row_${i}">
    <input class="inp" placeholder="Nome / descrição" id="rlink_lbl_${i}" style="flex:1">
    <input class="inp" placeholder="https://..." id="rlink_url_${i}" style="flex:2">

  </div>`);
}
function rotRemoveLink(i){document.querySelectorAll('[id^=rlink_lbl_]')[i]?.closest('div')?.remove();}
function saveComp(rotId,periodKey,assignee,nCampos){
  const status=document.getElementById('rcomp_status')?.value||'feito';
  const comoFoi=document.getElementById('rcomp_como')?.value||'';
  const obs=document.getElementById('rcomp_obs')?.value||'';
  const links=[];
  document.querySelectorAll('[id^=rlink_lbl_]').forEach(el=>{
    const idx=el.id.replace('rlink_lbl_','');
    const url=document.getElementById('rlink_url_'+idx)?.value||'';
    if(url)links.push({label:el.value||url,url});
  });
  const camposVals={};
  const rot=(S.rotinas.defs||[]).find(r=>r.id===rotId);
  if(rot&&rot.campos){rot.campos.forEach(cf=>{const el=document.getElementById('rcf_'+cf.id);if(el)camposVals[cf.id]=el.value;});}
  const key=rotCompKey(rotId,periodKey,assignee);
  S.rotinas.completions[key]={status,comoFoi,obs,links,campos:camposVals,by:me,at:new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})};
  saveLocal();closeModal();renderRotinas();
  if(document.getElementById('p-calendar').classList.contains('on'))renderCalendar();
  toast('Rotina registrada!');
}

function rotFreqChange(f){
  document.getElementById('rmod_freq').value=f;
  document.querySelectorAll('#rmod_freq_btns .ev-type-btn').forEach(b=>b.classList.remove('sel'));
  event.target.classList.add('sel');
  ['diaria','semanal','quinzenal','mensal'].forEach(ff=>{
    const el=document.getElementById('rmod_blk_'+ff);
    if(el)el.style.display=ff===f?'block':'none';
  });
}
function rotDayBtn(btn,val,hiddenId){
  btn.closest('div').querySelectorAll('.ev-type-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  document.getElementById(hiddenId).value=val;
}
function rotQTipo(tipo){
  document.getElementById('rmod_quinztipo').value=tipo;
  document.querySelectorAll('#rmod_blk_quinzenal>.ev-type-btn,[id^=rmod_blk_quinzenal] .ev-type-btn:not(#rmod_blk_qocc .ev-type-btn):not(#rmod_blk_qfixo .ev-type-btn)').forEach(b=>b.classList.remove('sel'));
  event.target.classList.add('sel');
  document.getElementById('rmod_blk_qfixo').style.display=tipo==='dias_fixos'?'flex':'none';
  document.getElementById('rmod_blk_qocc').style.display=tipo==='ocorrencias'?'block':'none';
}
function rotQPar(isPar){
  document.getElementById('rmod_quinzpar').value=isPar?'1':'0';
  const btns=document.getElementById('rmod_blk_qocc').querySelectorAll('.ev-type-btn');
  btns.forEach(b=>b.classList.remove('sel'));
  event.target.classList.add('sel');
}
function rotMTipo(tipo){
  document.getElementById('rmod_mensaltipo').value=tipo;
  event.target.closest('div').querySelectorAll('.ev-type-btn').forEach(b=>b.classList.remove('sel'));
  event.target.classList.add('sel');

  document.getElementById('rmod_blk_mocc').style.display=tipo==='ocorrencia'?'block':'none';
}
function rotMOcc(btn,n){
  document.getElementById('rmod_ocorrencia').value=n;
  btn.closest('div').querySelectorAll('.ev-type-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}
function rotAddCampo(){
  const wrap=document.getElementById('rmod_campos_wrap');
  const i=Date.now();
  wrap.insertAdjacentHTML('beforeend',`<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;" id="rcf_row_${i}">
    <input class="inp" placeholder="Nome do campo" id="rcf_lbl_${i}" style="flex:2">
    <select class="inp" id="rcf_tipo_${i}" style="flex:1">
      <option value="text">Texto</option><option value="number">Número</option><option value="sim-nao">Sim/Não</option>
    </select>
    <button class="btn-ghost btn-sm" onclick="document.getElementById('rcf_row_${i}').remove()"></button>
  </div>`);
}
function saveRot(editId){
  const titulo=document.getElementById('rmod_titulo')?.value?.trim();
  if(!titulo)return toast('Título obrigatório');
  const freq=document.getElementById('rmod_freq')?.value||'semanal';
  const icon=document.getElementById('rmod_icon')?.value||'';
  const desc=document.getElementById('rmod_desc')?.value||'';
  const color=document.getElementById('rmod_color')?.value||'#3b82f6';
  const assignees=[];
  document.querySelectorAll('[id^=rmod_ass_]').forEach(el=>{if(el.classList.contains('sel'))assignees.push(el.id.replace('rmod_ass_',''));});
  if(!assignees.length)return toast('Selecione ao menos uma pessoa');
  const campos=[];
  document.querySelectorAll('[id^=rcf_lbl_]').forEach(el=>{
    const idx=el.id.replace('rcf_lbl_','');const lbl=el.value?.trim();
    if(lbl)campos.push({id:'cf'+idx,label:lbl,tipo:document.getElementById('rcf_tipo_'+idx)?.value||'text'});
  });

  // Lê campos de agenda conforme frequência
  const g=id=>document.getElementById(id);
  let agendaFields={};
  if(freq==='semanal'){
    agendaFields={diaSemana:parseInt(g('rmod_diasemana')?.value??1)};
  } else if(freq==='quinzenal'){
    const qt=g('rmod_quinztipo')?.value||'dias_fixos';
    agendaFields={quinzTipo:qt};
    if(qt==='dias_fixos'){
      agendaFields.quinzDia1=parseInt(g('rmod_qdia1')?.value)||1;
      agendaFields.quinzDia2=parseInt(g('rmod_qdia2')?.value)||15;
    } else {
      agendaFields.diaSemana=parseInt(g('rmod_diasemana_q')?.value??1);
      agendaFields.quinzPar=g('rmod_quinzpar')?.value==='1';
    }
  } else if(freq==='mensal'){
    const mt=g('rmod_mensaltipo')?.value||'dia_fixo';
    agendaFields={mensalTipo:mt};
    if(mt==='dia_fixo'){
      agendaFields.diaMes=parseInt(g('rmod_diames')?.value)||1;
    } else {
      agendaFields.diaSemana=parseInt(g('rmod_diasemana_m')?.value??1);
      agendaFields.ocorrencia=parseInt(g('rmod_ocorrencia')?.value)||1;
    }
  }

  if(!S.rotinas)S.rotinas={defs:[],completions:{}};
  const base={titulo,desc,icon,color,freq,...agendaFields,assignees,campos};
  if(editId){
    const i=(S.rotinas.defs||[]).findIndex(r=>r.id===editId);
    if(i>=0)S.rotinas.defs[i]={...S.rotinas.defs[i],...base};
  } else {
    S.rotinas.defs.push({id:'rot'+Date.now(),...base,isLeader:!!M[me]?.isLeader,createdBy:me});
  }
  saveLocal();closeModal();renderRotinas();
  if(document.getElementById('p-calendar').classList.contains('on'))renderCalendar();
  toast(editId?'Rotina atualizada!':'Rotina criada!');
}
function deleteRot(id){
  const rot=(S.rotinas.defs||[]).find(r=>r.id===id);
  if(!rot)return;
  if(rot.isLeader&&!M[me]?.isLeader)return toast('Rotinas da liderança não podem ser excluídas.');
  if(!confirm('Excluir esta rotina?'))return;
  S.rotinas.defs=(S.rotinas.defs||[]).filter(r=>r.id!==id);
  saveLocal();renderRotinas();toast('Rotina excluída.');
}
function renderManualBlock(b,color){
  const e=s=>esc(s||'');
  switch(b.t){
    case 'h2': return `<div class="man-h2">${e(b.v)}</div>`;
    case 'p':  return `<p class="man-p">${e(b.v)}</p>`;
    case 'highlight': return `<div class="man-highlight">${e(b.v)}</div>`;
    case 'list': return `<ul class="man-list">${b.v.map(i=>`<li>${e(i)}</li>`).join('')}</ul>`;
    case 'numbered': return `<ol class="man-numbered">${b.v.map(i=>`<li>${e(i)}</li>`).join('')}</ol>`;
    case 'phases': return `<div class="man-phases">${b.v.map(p=>`
      <div class="man-phase">
        <div class="man-phase-lbl" style="color:${color}">${e(p.label)}</div>
        <div class="man-phase-desc">${e(p.desc)}</div>
      </div>`).join('')}</div>`;
    case 'pillars': return `<div class="man-pillars">${b.v.map(p=>`
      <div class="man-pillar-card">
        <div class="man-pillar-hd">
          <div class="man-pillar-num" style="background:${color}">${p.num}</div>
          <div class="man-pillar-title">${e(p.title)}</div>
        </div>
        <ul class="man-list">${p.items.map(i=>`<li>${e(i)}</li>`).join('')}</ul>
      </div>`).join('')}</div>`;
    case 'agenda': return `<div class="man-agenda">${b.v.map(a=>`
      <div class="man-agenda-day">
        <div class="man-day-hd">
          <div class="man-day-label">${e(a.day)}</div>
          <div class="man-day-focus" style="background:${color}22;color:${color};border:1px solid ${color}44">${e(a.focus)}</div>
        </div>
        <div class="man-day-bd"><ul class="man-list">${a.items.map(i=>`<li>${e(i)}</li>`).join('')}</ul></div>
      </div>`).join('')}</div>`;
    case 'problems': return `<div class="man-problems">${b.v.map(p=>`
      <div class="man-prob">
        <div class="man-prob-q">${e(p.prob)}</div>
        <div class="man-prob-a"><ul class="man-list">${p.sol.map(s=>`<li>${e(s)}</li>`).join('')}</ul></div>
      </div>`).join('')}</div>`;
    default: return '';
  }
}
function renderManualContent(role){
  const d=MANUAL_CONTENT[role];
  if(!d)return`<div class="empty"><p>Manual não disponível.</p></div>`;
  const c=d.color||'var(--blue)';
  let h=`<div class="man-hero" style="border-left-color:${c}">
    <div class="man-hero-icon" style="font-size:.7rem;font-weight:800;">${d.icon&&!/\p{Emoji}/u.test(d.icon)?d.icon:(d.cargo||'').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'MN'}</div>
    <div class="man-hero-cargo">${esc(d.cargo)}</div>
    <div class="man-hero-title">${esc(d.title)}</div>
    <div class="man-hero-missao">${esc(d.missao)}</div>
  </div>`;
  d.sections.forEach((sect,si)=>{
    const k='_ms_'+role+'_'+si;
    const open=window[k]!==false;
    h+=`<div class="man-sect">
      <div class="man-sect-hd" onclick="window['${k}']=${!open};renderTrilha()">
        <div class="man-sect-num" style="background:${c}">${String(si+1).padStart(2,'0')}</div>
        <div class="man-sect-title">${esc(sect.title)}</div>
        <span style="margin-left:auto;font-size:.6rem;color:var(--muted)">${open?'▲':'▼'}</span>
      </div>`;
    if(open)h+=`<div class="man-sect-bd">${sect.blocks.map(b=>renderManualBlock(b,c)).join('')}</div>`;
    h+=`</div>`;
  });
  return h;
}
function renderTrilha(){
  if(!S.trilha)S.trilha={flows:defTrilhaFlows(),progress:{}};
  // Merge missing roles
  const def=defTrilhaFlows();
  Object.keys(def).forEach(k=>{if(!S.trilha.flows[k])S.trilha.flows[k]=def[k];});

  const isL=M[me]?.isLeader;
  const availRoles=isL?Object.keys(TRILHA_ROLES):Object.keys(TRILHA_ROLES).filter(k=>k===me);
  const selRole=availRoles.includes(window._trlRole||me)?(window._trlRole||me):availRoles[0];
  const selTab=window._trlTab||'flow';
  const flowSteps=(S.trilha.flows||{})[selRole]||[];
  const progress=(S.trilha.progress||{})[me]||{};
  const manContent=MANUAL_CONTENT[selRole];
  const doneCount=flowSteps.filter(s=>progress[s.id]).length;
  const totalCount=flowSteps.length;

  let html=`<div class="page-head"><h2>Trilha de Aprendizado</h2></div>`;

  // Role tabs (leaders see all)
  if(availRoles.length>1){
    html+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
      ${availRoles.map(r=>`<button class="ev-type-btn${r===selRole?' sel':''}" onclick="window._trlRole='${r}';window._trlTab='flow';renderTrilha()">${TRILHA_ROLES[r].label}</button>`).join('')}
    </div>`;
  }

  // Content tabs
  const quizData=TRILHA_QUIZ[selRole]||[];
  const savedQuiz=(S.trilha.quiz||{})[selRole]||null;
  html+=`<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
    <button class="ev-type-btn${selTab==='flow'?' sel':''}" onclick="window._trlTab='flow';renderTrilha()">Fluxograma</button>
    ${manContent?`<button class="ev-type-btn${selTab==='manual'?' sel':''}" onclick="window._trlTab='manual';renderTrilha()">Manual</button>`:''}
    ${quizData.length?`<button class="ev-type-btn${selTab==='quiz'?' sel':''}" onclick="window._trlTab='quiz';renderTrilha()" style="position:relative;">
      Quiz${savedQuiz?`<span style="font-size:.58rem;margin-left:5px;background:${savedQuiz.score>=70?'var(--green)':'#f59e0b'};color:#000;padding:1px 5px;border-radius:999px;">${savedQuiz.score}%</span>`:''}
    </button>`:''}
  </div>`;

  if(selTab==='flow'){
    // Progress bar
    if(totalCount>0){
      const pct=Math.round((doneCount/totalCount)*100);
      html+=`<div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-bottom:5px;">
        <span>Progresso de aprendizado</span><span style="color:${pct===100?'var(--green)':'var(--muted)'};">${doneCount}/${totalCount} etapas</span>
      </div>
      <div class="trl-prog-bar"><div class="trl-prog-fill" style="width:${pct}%"></div></div>`;
    }

    if(!flowSteps.length){
      html+=`<div class="empty"><div class="ei">–</div><p>Fluxograma ainda não cadastrado.${isL?' Clique em "+ Adicionar Etapa" para montar.':''}</p></div>`;
    }else{
      html+=`<div class="trl-flow">`;
      flowSteps.forEach((s,i)=>{
        const c=TRL_COLORS[s.tipo]||TRL_COLORS.step;
        const isDone=!!progress[s.id];
        const expKey='_trlE_'+selRole+'_'+s.id;
        const isOpen=!!window[expKey];
        const isOval=s.tipo==='start'||s.tipo==='end';
        if(i>0)html+=`<div class="trl-conn"></div>`;
        html+=`<div class="trl-node ${s.tipo}${isOpen?' open':''}" style="background:${c.bg};border:1px solid ${c.border};border-radius:${isOval?'999px':'10px'};"
          onclick="window['${expKey}']=!window['${expKey}'];renderTrilha()">
          ${isDone?`<div class="trl-done-tag">Entendido</div>`:''}
          <div class="trl-node-hd">
            <div class="trl-chk${isDone?' done':''}" title="Marcar como entendido" onclick="event.stopPropagation();toggleTrlProgress('${selRole}','${s.id}')"></div>
            <div style="flex:1;min-width:0;">
              <div class="trl-node-lbl">${c.label}</div>
              <div class="trl-node-ttl">${esc(s.titulo)}</div>
            </div>
            ${isL?`<button class="btn-ghost btn-sm" style="flex-shrink:0;" onclick="event.stopPropagation();openEditTrlNode('${selRole}','${s.id}')">Editar</button>`:''}
            <span style="font-size:.65rem;color:rgba(255,255,255,.4);margin-left:4px;">${isOpen?'▲':'▼'}</span>
          </div>
          <div class="trl-node-bd">
            ${esc(s.desc||'')}
            ${s.tipo==='decision'?`<div class="trl-branch">
              <div class="trl-br"><div class="trl-br-lbl" style="color:#4ade80;">SIM</div>${esc(s.sim||'')}</div>
              <div class="trl-br"><div class="trl-br-lbl" style="color:#f87171;">NÃO</div>${esc(s.nao||'')}</div>
            </div>`:''}
          </div>
        </div>`;
      });
      html+=`</div>`;
    }

    if(isL){
      html+=`<div style="margin-top:16px;display:flex;gap:8px;">
        <button class="btn-gold btn-sm" onclick="openAddTrlNode('${selRole}')">+ Adicionar Etapa</button>
        ${flowSteps.length?`<button class="btn-ghost btn-sm" onclick="resetTrlFlow('${selRole}')">Restaurar padrão</button>`:''}
      </div>`;
    }
  }else{
    if(selTab==='manual'){
      if(!manContent){html+=`<div class="empty"><p>Manual não disponível.</p></div>`;}
      else{
        html+=renderManualContent(selRole);
        if(quizData.length)html+=`<div style="margin-top:16px;display:flex;justify-content:center;">
          <button class="btn-gold btn-sm" onclick="window._trlTab='quiz';renderTrilha()">Fazer o Quiz →</button>
        </div>`;
      }
    }else if(selTab==='quiz'){
      // Quiz tab
      if(!quizData.length){
        html+=`<div class="empty"><div class="ei">–</div><p>Quiz ainda não disponível para este cargo.</p></div>`;
      }else{
        const tmpKey='_trlQuizAns_'+selRole;
        const tmpAns=window[tmpKey]||{};
        const submitted=!!(window['_trlQuizSub_'+selRole]);
        const correctAnswers=quizData.map(q=>q.corr);
        if(submitted){
          // Calculate score
          let correct=0;
          quizData.forEach((q,i)=>{if(tmpAns[i]===q.corr)correct++;});
          const score=Math.round((correct/quizData.length)*100);
          const color=score>=80?'var(--green)':score>=60?'#f59e0b':'#ef4444';
          const msg=score===100?'Perfeito! Você domina o processo!'
            :score>=80?'Muito bem! Você está preparado(a)!'
            :score>=60?'Quase lá! Revise os pontos marcados.'
            :'Recomendamos rever o manual e tentar novamente.';
          html+=`<div class="quiz-score">
            <div class="quiz-score-num" style="color:${color};">${score}%</div>
            <div class="quiz-score-lbl">${correct} de ${quizData.length} corretas</div>
            <div class="quiz-score-msg">${msg}</div>
          </div>`;
          quizData.forEach((q,i)=>{
            const sel=tmpAns[i];
            const isRight=sel===q.corr;
            html+=`<div class="quiz-card">
              <div class="quiz-num">Questão ${i+1} de ${quizData.length}</div>
              <div class="quiz-q">${esc(q.q)}</div>
              <div class="quiz-opts">`;
            q.opts.forEach((opt,j)=>{
              const isCorr=j===q.corr;
              const isSel=j===sel;
              let cls='quiz-opt';
              if(isCorr)cls+=' show-correct';
              if(isSel&&!isRight)cls+=' wrong';
              let rCls='quiz-radio';
              if(isCorr)rCls+=' correct';
              else if(isSel&&!isRight)rCls+=' wrong';
              html+=`<div class="${cls}"><div class="${rCls}"></div><span>${esc(opt)}</span></div>`;
            });
            html+=`</div>`;
            if(q.hint)html+=`<div class="quiz-hint">${esc(q.hint)}</div>`;
            html+=`</div>`;
          });
          html+=`<div style="display:flex;gap:8px;margin-top:4px;">
            <button class="btn-gold btn-sm" onclick="resetTrlQuiz('${selRole}')">Tentar Novamente</button>
            <button class="btn-ghost btn-sm" onclick="window._trlTab='manual';renderTrilha()">Rever Manual</button>
          </div>`;
        }else{
          // Unanswered quiz
          html+=`<div style="background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:16px;font-size:.84rem;color:var(--muted);">Responda todas as questões abaixo e clique em <strong style="color:var(--text);">Enviar Respostas</strong> para ver seu resultado.
          </div>`;
          quizData.forEach((q,i)=>{
            const sel=tmpAns[i];
            html+=`<div class="quiz-card">
              <div class="quiz-num">Questão ${i+1} de ${quizData.length}</div>
              <div class="quiz-q">${esc(q.q)}</div>
              <div class="quiz-opts">`;
            q.opts.forEach((opt,j)=>{
              const isSel=j===sel;
              html+=`<div class="quiz-opt${isSel?' sel':''}" onclick="window['${tmpKey}']=(window['${tmpKey}']||{});window['${tmpKey}'][${i}]=${j};renderTrilha()">
                <div class="quiz-radio${isSel?' sel':''}"><span style="width:8px;height:8px;border-radius:50%;background:#fff;display:${isSel?'block':'none'}"></span></div>
                <span>${esc(opt)}</span>
              </div>`;
            });
            html+=`</div></div>`;
          });
          const answered=Object.keys(tmpAns).length;
          const allDone=answered>=quizData.length;
          html+=`<div style="margin-top:4px;display:flex;align-items:center;gap:12px;">
            <button class="btn-gold" onclick="submitTrlQuiz('${selRole}')" ${allDone?'':'disabled'} style="${allDone?'':'opacity:.4;cursor:not-allowed'}">Enviar Respostas</button>
            ${!allDone?`<span style="font-size:.75rem;color:var(--muted);">${answered}/${quizData.length} respondidas</span>`:''}
          </div>`;
        }
      }
    }
  }

  document.getElementById('p-trilha').innerHTML=html;
}

function toggleTrlProgress(role,stepId){
  if(!S.trilha)return;
  if(!S.trilha.progress)S.trilha.progress={};
  if(!S.trilha.progress[me])S.trilha.progress[me]={};
  S.trilha.progress[me][stepId]=!S.trilha.progress[me][stepId];
  saveLocal();renderTrilha();
}

function submitTrlQuiz(role){
  const tmpKey='_trlQuizAns_'+role;
  const tmpAns=window[tmpKey]||{};
  const quizData=TRILHA_QUIZ[role]||[];
  if(!quizData.length)return;
  let correct=0;
  quizData.forEach((q,i)=>{if(tmpAns[i]===q.corr)correct++;});
  const score=Math.round((correct/quizData.length)*100);
  if(!S.trilha.quiz)S.trilha.quiz={};
  // Save best score
  const prev=(S.trilha.quiz[role]||{}).score||0;
  S.trilha.quiz[role]={score:Math.max(score,prev),lastScore:score,date:new Date().toLocaleDateString('pt-BR'),correct,total:quizData.length};
  window['_trlQuizSub_'+role]=true;
  saveLocal();renderTrilha();
}

function resetTrlQuiz(role){
  delete window['_trlQuizAns_'+role];
  delete window['_trlQuizSub_'+role];
  renderTrilha();
}

function openAddTrlNode(role){
  window._trlEditRole=role;window._trlEditId=null;
  renderTrlNodeModal({id:uid(),tipo:'step',titulo:'',desc:'',sim:'',nao:''});
}

function openEditTrlNode(role,nodeId){
  const node=(S.trilha.flows[role]||[]).find(n=>n.id===nodeId);
  if(!node)return;
  window._trlEditRole=role;window._trlEditId=nodeId;
  renderTrlNodeModal(node);
}

function renderTrlNodeModal(node){
  const tipos=['start','step','decision','error','end'];
  const tipoLabel={start:'Início (oval)',step:'Etapa (retângulo)',decision:'Decisão (sim/não)',error:'Tratativa de Erro',end:'Fim (oval)'};
  document.getElementById('modal-body').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div style="font-weight:800;">${node.titulo?'Editar Etapa':'Nova Etapa'}</div>
      <button class="btn-ghost btn-sm" onclick="closeModal()"></button>
    </div>
    <div class="f-grp"><label>Tipo</label>
      <select class="f-in" id="trl-tipo" onchange="document.getElementById('trl-dec-row').style.display=this.value==='decision'?'':'none'">
        ${tipos.map(t=>`<option value="${t}"${node.tipo===t?' selected':''}>${tipoLabel[t]}</option>`).join('')}
      </select></div>
    <div class="f-grp"><label>Título</label>
      <input class="f-in" id="trl-ttl" value="${esc(node.titulo)}" placeholder="Nome da etapa"/></div>
    <div class="f-grp"><label>Descrição / detalhes</label>
      <textarea class="f-in" id="trl-desc" rows="5" placeholder="O que acontece nesta etapa...">${esc(node.desc||'')}</textarea></div>
    <div id="trl-dec-row" style="${node.tipo==='decision'?'':'display:none'}">
      <div class="f-grp"><label>SIM → (próximo passo)</label>
        <input class="f-in" id="trl-sim" value="${esc(node.sim||'')}" placeholder="O que acontece se SIM"/></div>
      <div class="f-grp"><label>NÃO → (tratativa / desvio)</label>
        <input class="f-in" id="trl-nao" value="${esc(node.nao||'')}" placeholder="O que acontece se NÃO"/></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;">
      <button class="btn-gold" onclick="saveTrlNode()">Salvar</button>
      <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
      ${window._trlEditId?`<button class="btn-ghost" style="color:var(--red);margin-left:auto;" onclick="deleteTrlNode()">Excluir</button>`:''}
    </div>`;
  openModal();
}

function saveTrlNode(){
  const role=window._trlEditRole;
  const id=window._trlEditId;
  const titulo=document.getElementById('trl-ttl').value.trim();
  if(!titulo){toast('Informe o título.');return;}
  const node={
    id:id||uid(),
    tipo:document.getElementById('trl-tipo').value,
    titulo,
    desc:document.getElementById('trl-desc').value.trim(),
    sim:document.getElementById('trl-sim')?.value.trim()||'',
    nao:document.getElementById('trl-nao')?.value.trim()||'',
  };
  if(!S.trilha.flows[role])S.trilha.flows[role]=[];
  const idx=S.trilha.flows[role].findIndex(n=>n.id===node.id);
  if(idx>=0)S.trilha.flows[role][idx]=node;else S.trilha.flows[role].push(node);
  saveLocal();closeModal();renderTrilha();toast('Etapa salva!');
}

function deleteTrlNode(){
  const role=window._trlEditRole;
  const id=window._trlEditId;
  if(!confirm('Excluir esta etapa?'))return;
  S.trilha.flows[role]=(S.trilha.flows[role]||[]).filter(n=>n.id!==id);
  saveLocal();closeModal();renderTrilha();toast('Etapa removida.');
}

function resetTrlFlow(role){
  if(!confirm('Restaurar o fluxograma padrão? Suas edições serão perdidas.'))return;
  S.trilha.flows[role]=defTrilhaFlows()[role]||[];
  saveLocal();renderTrilha();toast('Fluxograma restaurado!');
}

const PROJ_TIPOS={abertura:'Abertura',evento:'Evento',projeto:'Projeto',campanha:'Campanha',outro:'Outro'};
const PROJ_CORES=['#60a5fa','#f472b6','#34d399','#fb923c','#a78bfa','#f43f5e','#22d3ee','#fbbf24'];
const ETAPA_STATUS={pendente:'pend',em_andamento:'doing',concluido:'done'};
let tmpProj=null;

function renderProjetos(){
  if(!S.projetos)S.projetos=[];
  const isL=M[me]?.isLeader;
  const el=document.getElementById('p-projetos');
  const tipos=Object.keys(PROJ_TIPOS);
  // Filter tabs
  const filterEl=document.getElementById('proj-filter')||null;
  const filterVal=window._projFilter||'todos';

  const list=filterVal==='todos'?S.projetos:S.projetos.filter(p=>p.tipo===filterVal);

  let html=`<div class="page-head"><h2>Projetos & Cronogramas</h2>
    ${isL?`<button class="btn-gold" onclick="openNovoProjeto()">+ Novo projeto</button>`:``}
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;">
    <button class="ev-type-btn${filterVal==='todos'?' sel':''}" onclick="window._projFilter='todos';renderProjetos()">Todos</button>
    ${tipos.map(t=>`<button class="ev-type-btn${filterVal===t?' sel':''}" onclick="window._projFilter='${t}';renderProjetos()">${PROJ_TIPOS[t]}</button>`).join('')}
  </div>`;

  if(!list.length){html+=`<div class="empty"><div class="ei">–</div><p>Nenhum projeto ainda.</p></div>`;
  }else{
    list.forEach(p=>{
      const total=(p.etapas||[]).length;
      const done=(p.etapas||[]).filter(e=>e.status==='concluido').length;
      const doing=(p.etapas||[]).filter(e=>e.status==='em_andamento').length;

      html+=`<div class="proj-card">
        <div class="proj-bar" style="background:${p.cor||'#60a5fa'}"></div>
        <div class="proj-head" onclick="toggleProj('${p.id}')">
          <div class="proj-dot" style="background:${p.cor||'#60a5fa'}22;color:${p.cor||'#60a5fa'};font-size:.85rem;">
            ${p.tipo==='abertura'?'':p.tipo==='evento'?'':p.tipo==='campanha'?'':''}
          </div>
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <span style="font-weight:800;font-size:.95rem;">${esc(p.name)}</span>
              <span class="proj-tipo" style="color:${p.cor||'#60a5fa'};border-color:${p.cor||'#60a5fa'}44;">${PROJ_TIPOS[p.tipo]||p.tipo}</span>
            </div>
            <div style="font-size:.7rem;color:var(--muted);margin-top:3px;">
              ${p.startDate?fmtDate(p.startDate):'?'} → ${p.endDate?fmtDate(p.endDate):'?'}
              ${total?` · ${done}/${total} etapas concluídas`:''}
            </div>
          </div>
          <div style="display:flex;gap:6px;align-items:center;">
            ${isL?`<button class="btn-ghost btn-sm" onclick="event.stopPropagation();editProjeto('${p.id}')">Editar</button>`:''}
            <span style="font-size:.75rem;color:var(--muted);">${openState?'▲':'▼'}</span>
          </div>
        </div>
        <div class="proj-body ${openState}" id="pb-${p.id}">
          ${p.descricao?`<div style="font-size:.8rem;color:var(--muted);margin-bottom:10px;">${esc(p.descricao)}</div>`:''}
          ${total?`<div class="proj-prog"><div class="proj-prog-fill" style="width:${pct}%;background:${p.cor||'#60a5fa'};"></div></div>`:''}
          <div class="timeline">
            ${(p.etapas||[]).map((e,i)=>{
              const stClass=e.status==='concluido'?'done':e.status==='em_andamento'?'doing':'pend';
              const stLabel=e.status==='concluido'?'Concluído':e.status==='em_andamento'?'Em andamento':'Pendente';
              const resp=e.responsavel?(M[e.responsavel]?.name||e.responsavel):'';

        </div>
      </div>`;
    });
  }

  el.innerHTML=html;
}

function toggleProj(id){
  const key='proj_open_'+id;
  window[key]=!window[key];
  const body=document.getElementById('pb-'+id);
  if(body)body.classList.toggle('open',window[key]);
  // flip arrow without full re-render
  renderProjetos();
}

function updateEtapaStatus(projId,etapaId,status){
  const p=S.projetos.find(x=>x.id===projId);if(!p)return;
  const e=(p.etapas||[]).find(x=>x.id===etapaId);if(!e)return;
  e.status=status;saveLocal();toast('Status atualizado!');renderProjetos();
}

function deleteProjeto(id){
  if(!confirm('Excluir este projeto?'))return;
  S.projetos=S.projetos.filter(p=>p.id!==id);saveLocal();toast('Projeto excluído.');renderProjetos();
}

function editProjeto(id){

  if(p){tmpProj=JSON.parse(JSON.stringify(p));openProjetoModal();}
}

let _ganttTip=null;
function showGanttTip(e,html){
  let t=document.getElementById('gantt-tip');
  if(!t){t=document.createElement('div');t.id='gantt-tip';t.className='gantt-tooltip';document.body.appendChild(t);}
  t.innerHTML=html;
  t.style.display='block';
  const x=Math.min(e.clientX+14,window.innerWidth-240);
  const y=Math.max(e.clientY-10,8);
  t.style.left=x+'px';t.style.top=y+'px';
}
function hideGanttTip(){const t=document.getElementById('gantt-tip');if(t)t.style.display='none';}

function renderTimeline(){
  if(!S.projetos)S.projetos=[];
  const el=document.getElementById('p-timeline');
  const isL=M[me]?.isLeader;
  const STATUS_LABEL={pendente:'Pendente',em_andamento:'Em andamento',concluido:'Concluído'};
  const STATUS_COLOR={pendente:'#6b7280',em_andamento:'#f59e0b',concluido:'#22c55e'};

  const projs=S.projetos.filter(p=>p.startDate&&p.endDate);
  const sem=S.projetos.filter(p=>!p.startDate||!p.endDate);

  if(!projs.length){
    el.innerHTML=`<div class="page-head"><h2 style="font-family:var(--serif)">Timeline</h2>
      ${isL?`<button class="btn-gold" onclick="goPanel('projetos')">Gerenciar Projetos</button>`:''}
    </div>
    <div class="empty"><div class="ei">–</div>
      <p>Nenhum projeto com datas definidas.<br>
      <span style="font-size:.75rem;color:var(--muted)">Adicione data de início e fim nos projetos para ver a timeline.</span></p>
    </div>`;
    return;
  }

  // Compute date range
  const today=new Date();today.setHours(0,0,0,0);
  let minD=new Date(projs.map(p=>p.startDate).sort()[0]);
  let maxD=new Date(projs.map(p=>p.endDate).sort().reverse()[0]);
  // Pad 10 days on each side
  minD=new Date(minD.getTime()-10*86400000);
  maxD=new Date(maxD.getTime()+10*86400000);
  const totalMs=maxD.getTime()-minD.getTime();

  function pct(dateStr){
    const d=new Date(dateStr);
    return Math.max(0,Math.min(100,((d.getTime()-minD.getTime())/totalMs)*100));
  }
  const todayPct=Math.max(0,Math.min(100,((today.getTime()-minD.getTime())/totalMs)*100));
  const todayVisible=today>=minD&&today<=maxD;

  // Month ruler
  let monthHtml='';
  let cur=new Date(minD.getFullYear(),minD.getMonth(),1);
  while(cur<=maxD){
    const p2=pct(cur.toISOString().slice(0,10));
    const lbl=cur.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});
    monthHtml+=`<div class="gantt-month" style="left:${p2}%">${lbl}</div>
    <div class="gantt-month-tick" style="left:${p2}%"></div>`;
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  if(todayVisible){
    monthHtml+=`<div class="gantt-today-ruler" style="left:${todayPct}%"></div>`;
  }

  // Rows
  let rowsHtml='';
  projs.forEach((p,pi)=>{
    const s=pct(p.startDate);
    const e=pct(p.endDate);
    const w=Math.max(e-s,0.8);
    const cor=p.cor||'#60a5fa';
    const etapas=p.etapas||[];
    const total=etapas.length;
    const done=etapas.filter(x=>x.status==='concluido').length;
    const pctProg=total?Math.round(done/total*100):0;
    const typeIcon=p.tipo==='abertura'?'AB':p.tipo==='evento'?'EV':p.tipo==='campanha'?'CA':'NO';

    // Milestone diamonds (etapas with dates)
    const milestones=etapas.filter(et=>et.data).map(et=>{
      const ep=pct(et.data);
      const sc=STATUS_COLOR[et.status]||'#6b7280';
      const resp=et.responsavel?(M[et.responsavel]?.name||et.responsavel):'';
      const tipHtml=`<b>${esc(et.nome)}</b><span>${STATUS_LABEL[et.status]||et.status}${resp?' · '+resp:''}<br>${fmtDate(et.data)}</span>`;
      return`<div class="gantt-milestone" style="left:${ep}%;top:calc(50% - 6px);background:${sc};"
        onmouseenter="showGanttTip(event,'${tipHtml.replace(/'/g,'&#39;')}')"
        onmouseleave="hideGanttTip()"></div>`;
    }).join('');

    const tipMain=`<b>${typeIcon} ${esc(p.name)}</b><span>${fmtDate(p.startDate)} → ${fmtDate(p.endDate)}<br>${done}/${total} etapas concluídas (${pctProg}%)</span>`;

    rowsHtml+=`<div class="gantt-row" style="animation-delay:${pi*0.05}s">
      <div class="gantt-label">
        <div class="gantt-label-dot" style="background:${cor}"></div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:.81rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${typeIcon} ${esc(p.name)}</div>
          <div style="font-size:.66rem;color:var(--muted);margin-top:1px;">${done}/${total} etapas · ${pctProg}%</div>
        </div>
      </div>
      <div class="gantt-track">
        <div class="gantt-bar" style="left:${s}%;width:${w}%;background:${cor}18;border-color:${cor}55;"
          onmouseenter="showGanttTip(event,'${tipMain.replace(/'/g,'&#39;')}')"
          onmouseleave="hideGanttTip()"
          onclick="goPanel('projetos');window['proj_open_${p.id}']=true;setTimeout(()=>renderProjetos(),50)">
          <div class="gantt-bar-fill" style="width:${pctProg}%;background:${cor};opacity:.5;"></div>
          <span class="gantt-bar-label" style="color:${cor};">${esc(p.name)}</span>
        </div>
        ${milestones}
        ${todayVisible?`<div class="gantt-today" style="left:${todayPct}%"></div>`:''}
      </div>
    </div>`;
  });

  el.innerHTML=`
    <div class="page-head">
      <h2 style="font-family:var(--serif)">Timeline · Projetos</h2>
      ${isL?`<button class="btn-gold" onclick="goPanel('projetos')">Gerenciar Projetos</button>`:''}
    </div>
    <div class="gantt-legend">
      <div class="gantt-leg-item"><div class="gantt-leg-dot" style="background:var(--green)"></div>Concluído</div>
      <div class="gantt-leg-item"><div class="gantt-leg-dot" style="background:var(--amber)"></div>Em andamento</div>
      <div class="gantt-leg-item"><div class="gantt-leg-dot" style="background:#6b7280"></div>Pendente</div>
      ${todayVisible?`<div class="gantt-leg-item"><div class="gantt-leg-dot" style="background:var(--red);border-radius:2px;width:3px;height:12px;"></div>Hoje</div>`:''}
      <div style="flex:1"></div>
      <div style="font-size:.7rem;color:var(--muted)">Clique nas barras para abrir o projeto · Passe o mouse nos marcos para detalhes</div>
    </div>
    <div class="gantt-wrap">
      <div class="gantt-inner">
        <div class="gantt-ruler">
          <div class="gantt-ruler-pad"></div>
          <div class="gantt-ruler-track">${monthHtml}</div>
        </div>
        ${rowsHtml}
      </div>
    </div>
    ${sem.length?`<div style="font-size:.72rem;color:var(--muted2);margin-top:12px;padding:10px;background:var(--panel);border-radius:10px;border:1px solid var(--line);">${sem.length} projeto(s) sem datas não exibido(s): ${sem.map(p=>`<b>${esc(p.name)}</b>`).join(', ')}
    </div>`:''}
  `;
}

function getWAConfig(){
  try{
    const saved=JSON.parse(localStorage.getItem('wa_cfg')||'null');
    if(saved&&saved.phone&&saved.key)return saved;
    // Configuração padrão do Marlon — ativa automaticamente
    const def={phone:'554399433349',key:'2428994'};
    localStorage.setItem('wa_cfg',JSON.stringify(def));
    return def;
  }catch(e){return null;}
}

async function sendWhatsApp(msg){
  const cfg=getWAConfig();
  if(!cfg||!cfg.phone||!cfg.key)return false;
  try{
    const url=`https://api.callmebot.com/whatsapp.php?phone=${encodeURIComponent(cfg.phone)}&text=${encodeURIComponent(msg)}&apikey=${encodeURIComponent(cfg.key)}`;
    await fetch(url,{mode:'no-cors'});
    return true;
  }catch(e){return false;}
}

async function waNotify(tipo,dados){
  let msg='';
  if(tipo==='aprovacao'){
    msg=`🏪 *MRZ TEAM*\n📋 *Tarefa aguardando aprovação!*\n\nTarefa: ${dados.title}\nSolicitado por: ${dados.from}\nData: ${new Date().toLocaleDateString('pt-BR')}\n\n👉 https://lucassnobrega.github.io/APP-MRZ/team-mrz.html`;
  }else if(tipo==='erro-caixa'){
    msg=`🏪 *MRZ TEAM*\n⚠️ *Erro de Caixa PENDENTE!*\n\nLoja: ${dados.loja}\nTipo: ${dados.tipo}\nValor: ${dados.valor?'R$ '+Number(dados.valor).toFixed(2).replace('.',','):'-'}\nRegistrado por: ${M[dados.member]?.name||dados.member}\n\nNecessário verificar.`;
  }else if(tipo==='demanda'){
    msg=`🏪 *MRZ TEAM*\n*Nova demanda criada!*\n\nTarefa: ${dados.title}\nPara: ${M[dados.assignee]?.name||dados.assignee}\nPrioridade: ${dados.prio==='h'?'Alta':dados.prio==='m'?'Média':'Baixa'}\nCriada por: ${M[me]?.name||me}`;
  }else if(tipo==='manu-nova'){
    msg=`🏪 *MRZ TEAM*\n🔧 *Nova demanda de manutenção!*\n\nServiço: ${dados.titulo}\nLoja: ${dados.loja}\nData: ${dados.data}\nPrioridade: ${dados.prio==='urgente'?'URGENTE':'Normal'}\n\n👉 https://lucassnobrega.github.io/APP-MRZ/team-mrz.html`;
  }else if(tipo==='atrasadas'){
    const lista=dados.tarefas.map(t=>`• ${t.title} (${t.responsaveis})`).join('\n');
    msg=`🏪 *MRZ TEAM*\n🚨 *${dados.tarefas.length} tarefa(s) em atraso!*\n\n${lista}\n\nData: ${new Date().toLocaleDateString('pt-BR')}`;
  }
  if(msg)await sendWhatsApp(msg);
}

// Verifica tarefas atrasadas e notifica — roda 1x por sessão
let _waAtrasadasNotified=false;
async function checkAtrasadas(){
  if(_waAtrasadasNotified)return;
  const cfg=getWAConfig();if(!cfg||!cfg.phone||!cfg.key)return;
  const hoje=todayKey();
  const atrasadas=(S.tasks||[]).filter(t=>{
    if(!t.deadline||t.status==='aprovado'||t.status==='done')return false;
    return t.deadline<hoje;
  });
  if(!atrasadas.length)return;
  _waAtrasadasNotified=true;
  // Só notifica se a última notificação foi há mais de 12h (evita spam)
  const lastKey='wa_atrasadas_last';
  const last=parseInt(localStorage.getItem(lastKey)||'0');
  if(Date.now()-last<12*60*60*1000)return;
  localStorage.setItem(lastKey,String(Date.now()));
  const tarefas=atrasadas.slice(0,8).map(t=>({
    title:t.title,
    responsaveis:(t.assignees||[]).map(a=>M[a]?.name||a).join(', ')
  }));
  waNotify('atrasadas',{tarefas});
}

  html+=`<div class="gestao-sec">Criar Demanda</div>

      <textarea class="f-in" id="gest-desc" rows="2" placeholder="Detalhes adicionais..."></textarea></div>

  </div>

  <!-- OVERVIEW POR MEMBRO -->
  <div class="gestao-sec">Situação do Time</div>
  <div class="gestao-card">`;

  Object.entries(M).forEach(([k,m2])=>{
    const mt=(S.tasks||[]).filter(t=>(t.assignees||[]).includes(k));
    const todo=mt.filter(t=>t.status==='todo').length;
    const doing=mt.filter(t=>t.status==='doing').length;
    const done=mt.filter(t=>t.status==='done').length;
    const blocked=mt.filter(t=>t.status==='blocked').length;
    const s=M[k]?.status||{};
    html+=`<div class="member-row">
      <div class="member-av-sm" style="background:${m2.color}33;color:${m2.color}">${m2.icon}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:.82rem;font-weight:700;">${m2.name}</div>
        <div style="font-size:.68rem;color:var(--muted);">${m2.role}</div>
      </div>
      <div class="gest-stat">
        ${todo?`<span style="color:var(--muted);">${todo} pendente${todo>1?'s':''}</span>`:''}
        ${doing?`<span style="color:var(--amber);">${doing} em curso</span>`:''}
        ${blocked?`<span style="color:var(--red);">${blocked} bloqueada${blocked>1?'s':''}</span>`:''}
        ${done?`<span style="color:var(--green);">${done} concluída${done>1?'s':''}</span>`:''}
        ${(!todo&&!doing&&!done&&!blocked)?`<span style="opacity:.4;">sem tarefas</span>`:''}
      </div>
    </div>`;
  });
  html+=`</div>`;

  document.getElementById('p-gestao').innerHTML=html;
}

async function saveGestaoTask(){
  const memberId=document.getElementById('gest-mb').value;
  const title=document.getElementById('gest-ttl').value.trim();
  if(!title){toast('Informe a tarefa.');return;}
  const prio=document.getElementById('gest-prio').value;
  const dl=document.getElementById('gest-dl').value;
  const desc=document.getElementById('gest-desc').value.trim();
  const newTask={id:uid(),title,desc,status:'todo',priority:prio,
    assignees:[memberId],attachments:[],approvalReq:false,
    deadline:dl,created:todayKey(),comments:[],createdBy:me};
  S.tasks.push(newTask);
  saveLocal();
  toast(`Demanda criada para ${M[memberId]?.name}!`);
  await waNotify('demanda',{title,assignee:memberId,prio});
  renderGestao();
}
