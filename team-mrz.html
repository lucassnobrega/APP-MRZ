function defContasPagar(){return{lojas:JSON.parse(JSON.stringify(CONTAS_INIT)),pagamentos:{}};}
function cpKeyFor(year,month){return`${year}-${String(month+1).padStart(2,'0')}`;}
function cpMonthKey(){const n=new Date();return cpKeyFor(n.getFullYear(),n.getMonth());}
function cpPagKey(contaId,ym){return`${contaId}|${ym}`;}
function isContaPaga(contaId,ym){return!!(S.contasPagar?.pagamentos||{})[cpPagKey(contaId,ym)];}
function getContaPag(contaId,ym){return(S.contasPagar?.pagamentos||{})[cpPagKey(contaId,ym)]||null;}

function marcarContaPaga(contaId,ym){
  if(!S.contasPagar)S.contasPagar=defContasPagar();
  const key=cpPagKey(contaId,ym);
  if(S.contasPagar.pagamentos[key]){
    delete S.contasPagar.pagamentos[key];
    toast('Pagamento desmarcado.');
  }else{
    S.contasPagar.pagamentos[key]={by:me,at:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),date:todayKey()};
    toast('Pago!');
  }
  saveLocal();
  if(document.getElementById('p-contas')?.classList.contains('on'))renderContasPagar();
  if(document.getElementById('p-rotinas')?.classList.contains('on'))renderRotinas();
  if(document.getElementById('p-home')?.classList.contains('on'))renderHome();
}

function renderContasPagar(){
  if(!S.contasPagar)S.contasPagar=defContasPagar();
  const el=document.getElementById('p-contas');
  const lojas=S.contasPagar.lojas||[];
  if(!window._cpLoja&&lojas[0])window._cpLoja=lojas[0].id;
  const selLoja=window._cpLoja||(lojas[0]?.id||'');
  const now=new Date();
  if(window._cpYear===undefined)window._cpYear=now.getFullYear();
  if(window._cpMonth===undefined)window._cpMonth=now.getMonth();
  const cpYear=window._cpYear;
  const cpMonth=window._cpMonth;
  const ym=cpKeyFor(cpYear,cpMonth);
  const mNames=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const loja=lojas.find(l=>l.id===selLoja);
  const today=now.getDate();
  const isCurrentMonth=cpYear===now.getFullYear()&&cpMonth===now.getMonth();

  // Progresso global (todas as lojas com dia definido)
  const totalAll=lojas.reduce((s,l)=>s+(l.contas||[]).filter(c=>c.dia).length,0);
  const pagAll=lojas.reduce((s,l)=>s+(l.contas||[]).filter(c=>c.dia&&isContaPaga(c.id,ym)).length,0);
  const pctAll=totalAll?Math.round(pagAll/totalAll*100):0;

  let html=`<div class="page-head">
    <h2 style="font-family:var(--serif)">Contas a Pagar</h2>
    <button class="btn-gold btn-sm" onclick="openNovaLoja()">+ Loja</button>
  </div>
  <div class="rot-progress-box" style="margin-bottom:16px;">
    <div class="rot-prog-row">
      <span style="font-size:.8rem;color:var(--muted);">Todas as lojas · ${mNames[cpMonth]} ${cpYear}</span>
      <span class="rot-prog-label" style="color:${pctAll===100?'var(--green)':'var(--gold)'}">${pagAll}/${totalAll} pagas</span>
    </div>
    <div class="rot-prog-track">
      <div class="rot-prog-fill" style="width:${pctAll}%;background:${pctAll===100?'var(--green)':'var(--gold)'};"></div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
    <button class="btn-ghost btn-sm" onclick="window._cpMonth--;if(window._cpMonth<0){window._cpMonth=11;window._cpYear--;}renderContasPagar()">←</button>
    <span style="font-size:.88rem;font-weight:700;min-width:130px;text-align:center;">${mNames[cpMonth]} ${cpYear}</span>
    <button class="btn-ghost btn-sm" onclick="window._cpMonth++;if(window._cpMonth>11){window._cpMonth=0;window._cpYear++;}renderContasPagar()">→</button>
    ${!isCurrentMonth?`<button class="btn-sm" style="margin-left:6px;" onclick="window._cpYear=new Date().getFullYear();window._cpMonth=new Date().getMonth();renderContasPagar()">Mês atual</button>`:''}
  </div>
  <div style="display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;">
    ${lojas.map(l=>{
      const lt=(l.contas||[]).filter(c=>c.dia).length;
      const lp=(l.contas||[]).filter(c=>c.dia&&isContaPaga(c.id,ym)).length;
      const allOk=lt>0&&lp===lt;
      return`<button class="ev-type-btn${selLoja===l.id?' sel':''}" onclick="window._cpLoja='${l.id}';renderContasPagar()" style="${selLoja===l.id?`border-color:${l.cor};color:${l.cor};`:''}">${l.nome}<span style="font-size:.6rem;opacity:.7;margin-left:5px">${lp}/${lt}${allOk?' ':''}</span></button>`;
    }).join('')}
  </div>`;

  if(!loja){html+=`<div class="empty"><div class="ei">–</div><p>Nenhuma loja.</p></div>`;el.innerHTML=html;return;}

  const lContas=loja.contas||[];
  const lTotal=lContas.filter(c=>c.dia).length;
  const lPago=lContas.filter(c=>c.dia&&isContaPaga(c.id,ym)).length;
  const lPct=lTotal?Math.round(lPago/lTotal*100):0;
  const lAllDone=lTotal>0&&lPago===lTotal;

  html+=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;border-left:4px solid ${loja.cor||'var(--gold)'};">
    <div style="flex:1;">
      <div style="font-weight:800;font-size:1rem;margin-bottom:8px;color:${loja.cor||'var(--gold)'};">${loja.nome}</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="flex:1;height:7px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden;max-width:180px;">
          <div style="height:100%;border-radius:999px;background:${lAllDone?'var(--green)':loja.cor||'var(--gold)'};width:${lPct}%;transition:width .4s;"></div>
        </div>
        <span style="font-size:.75rem;color:${lAllDone?'var(--green)':'var(--muted)'};">${lPago}/${lTotal} pagas este mês</span>
      </div>
    </div>
    <button class="btn-ghost btn-sm" onclick="openEditLoja('${loja.id}')"></button>
    <button class="btn-gold btn-sm" onclick="openNovaConta('${loja.id}')">+ Conta</button>
  </div>`;

  // Agrupar por dia
  const byDay={};const semDia=[];
  lContas.forEach(c=>{if(!c.dia){semDia.push(c);return;}if(!byDay[c.dia])byDay[c.dia]=[];byDay[c.dia].push(c);});
  const sortedDays=Object.keys(byDay).map(Number).sort((a,b)=>a-b);

  if(!sortedDays.length&&!semDia.length){
    html+=`<div class="empty"><div class="ei">–</div><p>Nenhuma conta cadastrada. <button class="btn-sm" onclick="openNovaConta('${loja.id}')">Adicionar</button></p></div>`;
  }else{
    sortedDays.forEach(d=>{
      const contas=byDay[d];
      const isPast=isCurrentMonth&&d<today;
      const isToday=isCurrentMonth&&d===today;
      const doneN=contas.filter(c=>isContaPaga(c.id,ym)).length;
      const allPaid=doneN===contas.length;
      const hasLate=isPast&&!allPaid;
      html+=`<div class="rot-semana-day${isToday?' hoje-col':''}">
        <div class="rot-semana-hd">
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="width:30px;height:30px;border-radius:8px;background:${isToday?(loja.cor||'var(--gold)'):'var(--panel2)'};border:1px solid ${isToday?(loja.cor||'var(--gold)'):'var(--line)'};display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900;color:${isToday?'#fff':'var(--muted)'};flex-shrink:0;">dia ${d}</div>
            ${isToday?`<span class="rot-semana-badge" style="background:rgba(201,169,110,.15);color:var(--gold);">Hoje</span>`:''}
            ${hasLate?`<span class="rot-semana-badge" style="background:rgba(239,68,68,.12);color:#f87171;">Pendente</span>`:''}
          </div>
          <span class="rot-semana-badge" style="background:${allPaid?'rgba(34,197,94,.12)':'var(--panel2)'};color:${allPaid?'var(--green)':'var(--muted)'};">${doneN}/${contas.length}</span>
        </div>`;
      contas.forEach(c=>{
        const pago=isContaPaga(c.id,ym);
        const pg=getContaPag(c.id,ym);
        html+=`<div style="display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.04);">
          <button onclick="marcarContaPaga('${c.id}','${ym}')" title="${pago?'Clique para desmarcar':'Marcar como pago'}"
            style="width:28px;height:28px;border-radius:50%;border:2px solid ${pago?'var(--green)':'rgba(255,255,255,.18)'};background:${pago?'var(--green)':'transparent'};color:${pago?'#fff':'var(--muted)'};font-size:.8rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:var(--tr);">
            ${pago?'':'○'}
          </button>
          <div style="flex:1;min-width:0;">
            <div style="font-size:.86rem;font-weight:${pago?400:600};${pago?'text-decoration:line-through;opacity:.45':''};">${esc(c.nome)}</div>
            ${pago&&pg?`<div style="font-size:.62rem;color:var(--green);margin-top:2px;">${M[pg.by]?.name||pg.by} · ${pg.at}</div>`:''}
          </div>
          <button onclick="openEditConta('${loja.id}','${c.id}')" style="font-size:.68rem;color:var(--muted2);background:none;border:none;cursor:pointer;padding:3px 7px;border-radius:6px;"></button>
        </div>`;
      });
      html+=`</div>`;
    });
    if(semDia.length){
      html+=`<div class="rot-semana-day"><div class="rot-semana-hd"><div class="rot-semana-day-name" style="color:var(--muted)">Sem data definida</div></div>`;
      semDia.forEach(c=>{
        const pago=isContaPaga(c.id,ym);
        const pg=getContaPag(c.id,ym);
        html+=`<div style="display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.04);">
          <button onclick="marcarContaPaga('${c.id}','${ym}')" style="width:28px;height:28px;border-radius:50%;border:2px solid ${pago?'var(--green)':'rgba(255,255,255,.18)'};background:${pago?'var(--green)':'transparent'};color:${pago?'#fff':'var(--muted)'};font-size:.8rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;">
            ${pago?'':'○'}
          </button>
          <div style="flex:1;min-width:0;">
            <div style="font-size:.86rem;font-weight:${pago?400:600};${pago?'text-decoration:line-through;opacity:.45':''};">${esc(c.nome)}</div>
            ${pago&&pg?`<div style="font-size:.62rem;color:var(--green);margin-top:2px;">${M[pg.by]?.name||pg.by} · ${pg.at}</div>`:''}
          </div>
          <button onclick="openEditConta('${loja.id}','${c.id}')" style="font-size:.68rem;color:var(--muted2);background:none;border:none;cursor:pointer;padding:3px 7px;border-radius:6px;"></button>
        </div>`;
      });
      html+=`</div>`;
    }
  }
  el.innerHTML=html;
}

function saveConta(lojaId,contaId){
  const nome=document.getElementById('cp-nome')?.value?.trim();
  const diaVal=document.getElementById('cp-dia')?.value;
  const dia=diaVal?parseInt(diaVal):null;
  if(!nome){toast('Preencha o nome.');return;}
  if(!S.contasPagar)S.contasPagar=defContasPagar();
  const loja=S.contasPagar.lojas.find(l=>l.id===lojaId);
  if(!loja)return;
  if(contaId){const c=loja.contas.find(c=>c.id===contaId);if(c){c.nome=nome;c.dia=dia;}}
  else loja.contas.push({id:uid(),nome,dia});
  saveLocal();closeModal();renderContasPagar();toast('Conta salva!');
}
function deleteConta(lojaId,contaId){
  const loja=S.contasPagar?.lojas?.find(l=>l.id===lojaId);
  if(!loja)return;
  loja.contas=loja.contas.filter(c=>c.id!==contaId);
  saveLocal();closeModal();renderContasPagar();toast('Conta removida.');
}

function saveLoja(lojaId){
  const nome=document.getElementById('cp-lnome')?.value?.trim();
  const cor=document.getElementById('cp-lcor')?.value||'#c9a96e';
  if(!nome){toast('Preencha o nome.');return;}
  if(!S.contasPagar)S.contasPagar=defContasPagar();
  if(lojaId){const l=S.contasPagar.lojas.find(l=>l.id===lojaId);if(l){l.nome=nome;l.cor=cor;}}
  else{const nid='loja_'+Date.now();S.contasPagar.lojas.push({id:nid,nome,cor,contas:[]});window._cpLoja=nid;}

}
function deleteLoja(lojaId){
  if(!confirm('Excluir esta loja e todas suas contas?'))return;
  S.contasPagar.lojas=S.contasPagar.lojas.filter(l=>l.id!==lojaId);
  window._cpLoja=S.contasPagar.lojas[0]?.id||'';
  saveLocal();closeModal();renderContasPagar();toast('Loja removida.');
}

function downloadRHHist(mes){
  const pFil=(S.rh.pontos||[]).filter(p=>p._arq&&p._arqMes===mes);
  const cFil=(S.rh.contratacoes||[]).filter(c=>c._arq&&c._arqMes===mes);
  const aFil=(S.rh.agendamentos||[]).filter(a=>a._arq&&a._arqMes===mes);
  const rows=[
    ...pFil.map(p=>({'Tipo':'Ponto','Funcionario':p.funcionario||'','Loja':p.loja||'','Mes':p.mes||'','Status':p.status||'','Obs':p.obs||'','Mes Arquivado':p._arqMes||''})),
    ...cFil.map(c=>({'Tipo':'Contratacao','Cargo':c.cargo||'','Loja':c.loja||'','Fase':c.fase||'','Status':c.status||'','Mes Arquivado':c._arqMes||''})),
    ...aFil.map(a=>({'Tipo':'Agendamento','Funcionario':a.funcionario||'','Tipo Agend':a.tipo||'','Data':a.data||'','Status':a.status||'','Mes Arquivado':a._arqMes||''})),
  ];
  downloadCSV(rows,'rh_historico_'+mes+'.csv');
}
function arquivarMesRH(){
  const prevMes=prevMonthKey();
  let count=0;
  const arqArr=(arr,resolvedStatuses)=>{
    (arr||[]).forEach(item=>{
      if(!item._arq&&(item.data||item.mes||item.criadoEm||'').startsWith(prevMes)&&resolvedStatuses.includes(item.status)){
        item._arq=true;item._arqMes=prevMes;count++;
      }
    });
  };
  arqArr(S.rh.pontos,['resolvido']);
  arqArr(S.rh.contratacoes,['contratado','reprovado']);
  arqArr(S.rh.agendamentos,['realizado','cancelado']);
  if(!count){toast('Nenhum item resolvido do mês anterior para arquivar.');return;}
  saveLocal();toast(count+' item(s) de RH arquivado(s)!');renderRH();
}

function rhPontoWhatsApp(lojaFiltro){
  const LOJAS_NOMES={'raz-alameda':'ALAMEDA','zanoni-lago':'ZANONI LAGO','raz-mercadao':'MERCADÃO','zanoni-maringa':'MARINGÁ'};
  const pendentes=(S.rh.pontos||[]).filter(p=>p.status==='pendente'&&(lojaFiltro==='todas'||p.loja===lojaFiltro));
  if(!pendentes.length){toast('Nenhum pendente para esta loja.','#f59e0b');return;}
  // Agrupar por loja
  const byLoja={};
  pendentes.forEach(p=>{if(!byLoja[p.loja])byLoja[p.loja]=[];byLoja[p.loja].push(p);});
  const mesRef=pendentes[0].mesRef||new Date().toLocaleDateString('pt-BR',{month:'2-digit',year:'numeric'}).replace('/','/');
  let msg=`Boa tarde\nSegue abaixo a relação de nomes e datas pendentes de ajustes – ${mesRef}:`;
  Object.entries(byLoja).forEach(([lid,items])=>{
    msg+=`\n*${LOJAS_NOMES[lid]||lid.toUpperCase()}*\n`;
    items.forEach(p=>{msg+=`\n• ${p.funcionario.toUpperCase()}: ${p.diasSemPonto||'—'}`;});
    msg+='\n';
  });
  // Mover todos para cobrado
  pendentes.forEach(p=>{p.status='cobrado';});
  saveLocal();renderRH();
  // Abrir WhatsApp
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
  toast('Cobranças movidas para "Cobrado"');
}

function renderErrosCaixa(){
  if(!S.errosCaixa)S.errosCaixa=[];
  const ecTab=window._ecTab||'ativo';

  // ── ABA HISTÓRICO ──
  if(ecTab==='hist'){
    const sl={pendente:'Pendente',resolvido:'Resolvido','sem-erro':'Não achou'};
    const ecCard=e=>{
      const lojaColor=LOJAS.indexOf(e.loja)>=0?['#6366f1','#f472b6','#22d3ee','#f59e0b','#22c55e'][LOJAS.indexOf(e.loja)]:'var(--muted)';
      return`<div class="ec-card" style="margin-bottom:8px;">
        <div style="flex:1;min-width:0;">
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:5px;">
            <span class="ec-status resolvido">${sl[e.status]||e.status}</span>
            <span style="font-size:.65rem;font-weight:800;padding:2px 8px;border-radius:999px;background:${lojaColor}18;color:${lojaColor};border:1px solid ${lojaColor}33;">${esc(e.loja)}</span>
          </div>
          <div style="font-size:.88rem;font-weight:700;margin-bottom:3px;">${esc(e.titulo)}</div>
          <div class="ec-meta"><span>${esc(e.tipo)}</span><span>${fmtDate(e.date)}</span>${e.valor?`<span class="ec-valor">R$ ${esc(e.valor)}</span>`:''}</div>
          ${e.obs?`<div style="font-size:.76rem;color:var(--muted);margin-top:5px;">${esc(e.obs)}</div>`:''}
        </div>
      </div>`;
    };
    document.getElementById('p-erros-caixa').innerHTML=`
      <div class="page-head"><h2>Erros de Caixa</h2></div>
      <div style="display:flex;gap:6px;margin-bottom:18px;">
        <button class="ev-type-btn" onclick="window._ecTab='ativo';renderErrosCaixa()">Ativos</button>
        <button class="ev-type-btn sel">Histórico</button>
      </div>
      ${histAcordiao('ec',S.errosCaixa,ecCard,'downloadECHist','renderErrosCaixa')}`;
    return;
  }

  // ── ABA ATIVO ──
  const todos=S.errosCaixa.filter(e=>!e._arq);
  const lojaFil=window._ecLoja||'todas';
  const statusFil=window._ecStatus||'todos';

  // Counters (global, ignora filtros)
  const pendentes=todos.filter(e=>e.status==='pendente').length;
  const resolvidos=todos.filter(e=>e.status==='resolvido').length;
  const semErro=todos.filter(e=>e.status==='sem-erro').length;
  const valorTotal=todos.filter(e=>e.status==='pendente').reduce((s,e)=>s+(parseFloat(e.valor||0)),0);

  // Filtrado
  let list=todos.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(lojaFil!=='todas')list=list.filter(e=>e.loja===lojaFil);
  if(statusFil!=='todos')list=list.filter(e=>e.status===statusFil);

  function lojaBtn(id,label){
    const sel=lojaFil===id;
    const cnt=id==='todas'?todos.length:todos.filter(e=>e.loja===id).length;
    return`<button class="ev-type-btn${sel?' sel':''}" onclick="window._ecLoja='${id}';renderErrosCaixa()">
      ${label}${cnt>0?` <span style="font-size:.62rem;opacity:.65">(${cnt})</span>`:''}
    </button>`;
  }
  function statusBtn(id,label){
    const sel=statusFil===id;
    return`<button class="ev-type-btn${sel?' sel':''}" onclick="window._ecStatus='${id}';renderErrosCaixa()">${label}</button>`;
  }

  let cardsHtml='';
  if(!list.length){
    cardsHtml='<div class="empty-state">Nenhum erro encontrado com esse filtro.</div>';
  } else {
    list.forEach(e=>{
      const statusLabel=e.status==='pendente'?'Pendente':e.status==='resolvido'?'Resolvido':'Não achou o erro';
      const lojaColor=LOJAS.indexOf(e.loja)>=0?['#6366f1','#f472b6','#22d3ee','#f59e0b','#22c55e'][LOJAS.indexOf(e.loja)]:'var(--muted)';
      cardsHtml+=`<div class="ec-card">
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
            <span class="ec-status ${e.status}">${statusLabel}</span>
            <span style="font-size:.65rem;font-weight:800;padding:2px 8px;border-radius:999px;background:${lojaColor}18;color:${lojaColor};border:1px solid ${lojaColor}33;">${esc(e.loja)}</span>
          </div>
          <div style="font-size:.9rem;font-weight:700;margin-bottom:4px;">${esc(e.titulo)}</div>
          <div class="ec-meta">
            <span>${esc(e.tipo)}</span>
            <span>${fmtDate(e.date)}</span>
            ${ecValorHtml(e)}
          </div>
          ${e.obs?`<div style="font-size:.78rem;color:var(--muted);margin-top:8px;line-height:1.4;">${esc(e.obs)}</div>`:''}
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex-shrink:0;">
          <select class="finput" style="font-size:.72rem;padding:4px 8px;width:auto;" onchange="updateStatusEC('${e.id}',this.value)">
            <option value="pendente"${e.status==='pendente'?' selected':''}>Pendente</option>
            <option value="resolvido"${e.status==='resolvido'?' selected':''}>Resolvido</option>
            <option value="sem-erro"${e.status==='sem-erro'?' selected':''}>Não achou</option>
          </select>
          <div style="display:flex;gap:4px;">
            <button class="btn-ghost btn-sm" style="font-size:.7rem;padding:3px 8px;" onclick="openNovoErroCaixa('${e.id}')">Editar</button>
            <button class="icon-btn" onclick="delEC('${e.id}')">×</button>
          </div>
        </div>
      </div>`;
    });
  }

  document.getElementById('p-erros-caixa').innerHTML=`
    <div class="page-head"><h2>Erros de Caixa</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn-ghost btn-sm" onclick="arquivarMes(S.errosCaixa,['resolvido','sem-erro'],renderErrosCaixa)" title="Arquiva resolvidos do mês anterior">Fechar Mês</button>
        <button class="btn-gold" onclick="openNovoErroCaixa()">+ Registrar erro</button>
      </div>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:18px;">
      <button class="ev-type-btn sel">Ativos</button>
      <button class="ev-type-btn" onclick="window._ecTab='hist';renderErrosCaixa()">Histórico</button>
    </div>
    <div class="ec-summary">
      <div class="ec-sum-card"><b style="color:#fbbf24">${pendentes}</b><span>Pendentes</span></div>
      <div class="ec-sum-card"><b style="color:#4ade80">${resolvidos}</b><span>Resolvidos</span></div>
      <div class="ec-sum-card"><b style="color:var(--muted)">${semErro}</b><span>Não achou</span></div>
    </div>
    ${valorTotal>0?`<div style="background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.18);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:.84rem;">Valor em aberto (pendentes): <b style="color:#fbbf24">${fmtBRL(valorTotal)}</b></div>`:''}

    <div style="font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;">Loja</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;">
      ${lojaBtn('todas','Todas')}
      ${LOJAS.map(l=>lojaBtn(l,l)).join('')}
    </div>

    <div style="font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;">Status</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px;">
      ${statusBtn('todos','Todos')}
      ${statusBtn('pendente','Pendentes')}
      ${statusBtn('resolvido','Resolvidos')}
      ${statusBtn('sem-erro','Não achou')}
    </div>

    <div id="ec-list">${cardsHtml}</div>
  `;
}

function ecValorHtml(e){
  if(!e.valor)return'';
  const sinal=e.sinal||'falta';
  const icon=sinal==='sobra'?'▲ Sobra':'▼ Falta';
  const cls=sinal==='sobra'?'sobra':'falta';
  return`<span class="ec-valor ${cls}" style="border-radius:6px;padding:2px 8px;border:1px solid;">${icon} R$ ${esc(e.valor)}</span>`;
}
function openNovoErroCaixa(editId){
  const ec=editId?S.errosCaixa.find(x=>x.id===editId):null;
  const lojaFil=ec?.loja||(window._ecLoja&&window._ecLoja!=='todas'?window._ecLoja:'');

  const tipoOpts=TIPOS_ERRO.map(t=>`<option${(ec?.tipo||''===t)?' selected':''}>${t}</option>`).join('');
  const sinal=ec?.sinal||'falta';
  document.getElementById('modal-body').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div style="font-weight:800;font-size:1rem;">${ec?'Editar':'Registrar'} Erro de Caixa</div>
      <button class="btn-ghost btn-sm" onclick="closeModal()"></button>
    </div>
    <div class="form-row"><label>Título / Descrição curta *</label>
      <input id="ec-titulo" class="finput" value="${esc(ec?.titulo||'')}" placeholder="Ex: Diferença no fechamento de R$ 45"/></div>

          ${lojaOpts}
        </select>
      </div>

        <select id="ec-tipo" class="finput">${tipoOpts}</select>
      </div>
    </div>
    <div class="form-row"><label>Valor impactado (R$)</label>
      <div style="display:flex;gap:8px;align-items:center;">
        <button id="ecb-falta" class="ec-sinal-btn${sinal==='falta'?' sel falta':''}" onclick="ecSelSinal('falta')">▼ Falta</button>
        <button id="ecb-sobra" class="ec-sinal-btn${sinal==='sobra'?' sel sobra':''}" onclick="ecSelSinal('sobra')">▲ Sobra</button>

      </div>
    </div>
    <div class="form-row"><label>Status</label>
      <select id="ec-status" class="finput">
        <option value="pendente"${(ec?.status||'pendente')==='pendente'?' selected':''}>Pendente</option>
        <option value="resolvido"${ec?.status==='resolvido'?' selected':''}>Resolvido</option>

      <button class="btn-gold" onclick="saveEC('${editId||''}')">Salvar</button>
      <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>
  `;
  openModal();
}
function ecSelSinal(sinal){
  document.getElementById('ec-sinal').value=sinal;
  document.getElementById('ecb-falta').className='ec-sinal-btn'+(sinal==='falta'?' sel falta':'');
  document.getElementById('ecb-sobra').className='ec-sinal-btn'+(sinal==='sobra'?' sel sobra':'');
}

function saveEC(editId){
  const titulo=document.getElementById('ec-titulo').value.trim();
  if(!titulo){toast('Informe uma descrição.');return;}
  const loja=document.getElementById('ec-loja').value;
  if(!loja){toast('Selecione a loja.');return;}
  if(!S.errosCaixa)S.errosCaixa=[];
  const data={
    titulo,loja,
    tipo:document.getElementById('ec-tipo').value,
    valor:document.getElementById('ec-valor').value,
    sinal:document.getElementById('ec-sinal').value||'falta',
    status:document.getElementById('ec-status').value,
    obs:document.getElementById('ec-obs').value.trim()
  };
  let ecEntry;
  if(editId){
    const idx=S.errosCaixa.findIndex(x=>x.id===editId);
    if(idx>=0){S.errosCaixa[idx]={...S.errosCaixa[idx],...data};ecEntry=S.errosCaixa[idx];}
  } else {
    ecEntry={id:uid(),member:me,date:todayKey(),...data};
    S.errosCaixa.push(ecEntry);
  }
  saveLocal();closeModal();renderErrosCaixa();toast(editId?'Erro atualizado.':'Erro registrado.');
  if(!editId&&ecEntry?.status==='pendente'){
    waNotify('erro-caixa',{loja:ecEntry.loja,tipo:ecEntry.tipo,valor:ecEntry.valor,member:ecEntry.member});
  }
}

function updateStatusEC(id,status){
  const e=S.errosCaixa.find(x=>x.id===id);
  if(e){e.status=status;saveLocal();toast('Status atualizado.');}
}

function delEC(id){
  S.errosCaixa=S.errosCaixa.filter(e=>e.id!==id);
  saveLocal();renderErrosCaixa();toast('Registro removido.');
}

// ══════════════════════════════════════
function renderLog(){
  if(!S.logs)S.logs={};
  const today=todayKey();
  const prefix=me+'-';
  const dates=Object.keys(S.logs).filter(k=>k.startsWith(prefix)).map(k=>k.replace(prefix,'')).sort((a,b)=>b.localeCompare(a));

  let html=`<div class="card-panel" style="margin-bottom:16px;">
    <textarea class="f-in" id="log-ta" rows="3" placeholder="O que você fez hoje? Observações, entregas, problemas..."></textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
      <span style="font-size:.72rem;color:var(--muted);">${fmtTime()}</span>
      <button class="btn-gold btn-sm" onclick="addLog()">+ Registrar</button>
    </div>
  </div>`;

  if(!dates.length){html+=`<div class="empty"><div class="ei">–</div><p>Nenhum registro ainda.</p></div>`;}
  else dates.forEach(date=>{
    const entries=S.logs[prefix+date]||[];if(!entries.length)return;
    html+=`<div style="text-align:center;font-size:.67rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);margin:12px 0 6px;display:flex;align-items:center;gap:8px;">
      <span style="flex:1;height:1px;background:var(--line);display:block;"></span>${date===today?'Hoje':fmtDate(date)}<span style="flex:1;height:1px;background:var(--line);display:block;"></span></div>`;
    entries.slice().reverse().forEach(e=>{
      html+=`<div class="card" style="margin-bottom:7px;position:relative;">
        <button onclick="delLog('${date}','${e.id}')" style="position:absolute;top:9px;right:10px;background:transparent;border:none;color:var(--muted);cursor:pointer;opacity:.5;font-size:.85rem;"></button>
        <div style="font-size:.7rem;color:var(--muted);margin-bottom:4px;">${e.time}</div>
        <div style="font-size:.84rem;line-height:1.55;">${esc(e.text)}</div>
      </div>`;
    });
  });
  document.getElementById('p-log').innerHTML=html;
}

function addLog(){
  const ta=document.getElementById('log-ta');const text=ta.value.trim();if(!text){toast('Escreva algo.');return;}
  const today=todayKey();const k=me+'-'+today;
  if(!S.logs[k])S.logs[k]=[];S.logs[k].push({id:uid(),time:fmtTime(),text});ta.value='';saveLocal();toast('Salvo!');renderLog();
}
function delLog(date,id){const k=me+'-'+date;if(!S.logs[k])return;S.logs[k]=S.logs[k].filter(e=>e.id!==id);saveLocal();renderLog();}

function renderTeam(){
  if(!S||!me)return;
  const wk=weekId();
  let html=`<div class="sec" style="margin-top:0;">Visão Geral da Equipe</div>`;
  Object.entries(M).filter(([k])=>k!==me).forEach(([k,m])=>{
    const myTasks=S.tasks.filter(t=>t.assignees.includes(k));
    const doing=myTasks.filter(t=>t.status==='doing').length;
    const done=myTasks.filter(t=>t.status==='done').length;
    const myStatus=S.status?.[k];
    html+=`<div class="card" style="margin-bottom:8px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:42px;height:42px;border-radius:13px;background:${m.color}22;display:grid;place-items:center;font-size:20px;flex-shrink:0;">${m.icon}</div>
        <div style="flex:1">
          <div style="font-size:.88rem;font-weight:700;">${m.name}</div>
          <div style="font-size:.72rem;color:var(--muted);">${m.role}</div>
          ${myStatus?.text?`<div style="font-size:.72rem;color:var(--amber);margin-top:2px;">${esc(myStatus.text)}</div>`:''}
        </div>
        <div style="text-align:right;">
          <div style="font-size:.75rem;color:var(--green);">${done} feitas</div>
          <div style="font-size:.75rem;color:var(--amber);">${doing} fazendo</div>
          <div style="font-size:.75rem;color:var(--muted);">${myTasks.length} total</div>
        </div>
      </div>
    </div>`;
  });

  // Mural
  html+=`<div class="sec">Mural de Recados</div>
    <div class="card-panel" style="margin-bottom:14px;">
      <textarea class="f-in" id="mural-txt" rows="2" placeholder="Escreva um recado para o time..."></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center;">
        <label style="font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer;"><input type="checkbox" id="mural-pin"/>Fixar</label>
        <button class="btn-gold btn-sm" style="margin-left:auto;" onclick="postMural()">Publicar</button>
      </div>
    </div>
    ${(S.mural||[]).slice().sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)).map(p=>{const am=M[p.author];
      return`<div class="mural-post${p.pinned?' pinned':''}">
        <div class="mp-hd"><div class="mp-av" style="background:${am?.color||'#888'}33">${am?.icon||'?'}</div>
          <span class="mp-author">${am?.name||'?'}</span>${p.pinned?'<span class="mp-pin-icon"></span>':''}
          <span class="mp-date">${fmtDate(p.date)}</span>
          <button onclick="delMural('${p.id}')" class="att-del"></button>
        </div><div class="mp-text">${esc(p.text)}</div></div>`;}).join('')}
  `;
  document.getElementById('p-team').innerHTML=html;
}

function postMural(){
  const txt=document.getElementById('mural-txt')?.value.trim();if(!txt){toast('Escreva um recado.');return;}
  if(!S.mural)S.mural=[];
  S.mural.push({id:uid(),author:me,text:txt,date:todayKey(),pinned:document.getElementById('mural-pin')?.checked});
  saveLocal();toast('Recado publicado!');renderTeam();
}
function delMural(id){S.mural=(S.mural||[]).filter(p=>p.id!==id);saveLocal();renderTeam();}

function renderQueue(){
  // Mostra tarefas em "Em Aprovação" (review) do Kanban
  const pending=(S.tasks||[]).filter(t=>t.status==='review');
  const isL=M[me]?.isLeader;
  let html='';
  if(!pending.length){
    html=`<div class="empty"><div class="ei">–</div><p>Nenhuma tarefa aguardando aprovação.</p></div>`;
  } else {
    html+=`<div class="sec" style="margin-top:0;">Aguardando Aprovação (${pending.length})</div>`;
    pending.forEach(t=>{
      const from=(t.assignees||[]).map(a=>M[a]?.name||a).join(', ');
      const prioLabel={h:'Alta',m:'Média',l:'Baixa'}[t.priority]||'';
      html+=`<div class="card" style="margin-bottom:12px;border-left:3px solid var(--blue);">
        <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;">
          <div style="flex:1">
            <div style="font-size:.95rem;font-weight:800;">${esc(t.title)}</div>
            <div style="font-size:.72rem;color:var(--muted);margin-top:3px;">${esc(from)} · ${fmtDate(t.created)} ${t.deadline?'· Prazo: '+fmtDate(t.deadline):''}
              ${prioLabel?` · ${prioLabel}`:''}
            </div>
            ${t.desc?`<div style="font-size:.8rem;color:var(--text);margin-top:6px;line-height:1.5;">${esc(t.desc.slice(0,150))}${t.desc.length>150?'...':''}</div>`:''}
          </div>
          <button class="btn-ghost btn-sm" onclick="openTask('${t.id}')">Ver</button>
        </div>
        ${(t.attachments||[]).length?`<div style="font-size:.72rem;color:var(--blue);margin-bottom:8px;">${t.attachments.length} anexo(s)</div>`:''}
        ${isL?`<div style="display:flex;gap:8px;margin-top:4px;">
          <button class="btn-gold btn-sm" style="background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:var(--green);flex:1;" onclick="darDevolutiva('${t.id}','aprovado')">Aprovar</button>
          <button class="btn-ghost btn-sm" style="flex:1;" onclick="darDevolutivaPrompt('${t.id}')">↺ Pedir Ajuste</button>
        </div>`:`<div style="font-size:.75rem;color:var(--muted);background:var(--panel2);border-radius:6px;padding:6px 10px;">⏳ Aguardando aprovação do líder</div>`}
      </div>`;
    });
  }
  document.getElementById('p-queue').innerHTML=html;
}

function darDevolutivaPrompt(id){
  const obs=prompt('Motivo do ajuste (opcional):','');
  if(obs===null)return; // cancelou
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  t.status='ajuste';
  t.ajusteNote=obs||'Revise e reenvie.';
  if(!t.comments)t.comments=[];
  t.comments.push({id:uid(),author:me,text:`↺ Pedido de ajuste: ${t.ajusteNote}`,date:todayKey(),time:fmtTime()});
  saveLocal();toast('Ajuste solicitado.');renderQueue();renderTasks();renderHome();
}

      ${isL?`<button class="ev-type-btn${tab==="planejar"?" sel":""}" onclick="window._manuTab='planejar';renderManutencao()">Planejar</button>`:""}

    if(!lojasDia.length){

        html+=`<div onclick="document.getElementById('manu-loja-'+lojaId).scrollIntoView({behavior:'smooth'})" style="background:${loja.color}${done?"33":"22"};border:2px solid ${loja.color}${done?"":"44"};border-radius:12px;padding:10px 16px;cursor:pointer;flex:1;min-width:100px;text-align:center;">

              </div>
            </div>
          </div>`;
        });
        html+=`</div></div>`;
      });
    }

  else if(tab==="gerais"){

      const custoTotal=(item.materiais||[]).reduce((s,m)=>s+(parseFloat(m.custo)||0),0);
      return`<div style="background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:8px;border-left:3px solid ${loja.color};">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
          <span style="font-size:.7rem;background:var(--panel2);border-radius:4px;padding:1px 6px;">${loja.label}</span>
          <span style="font-size:.7rem;font-weight:600;color:${item.status==="concluido"?"var(--green)":"var(--amber)"};">${item.status==="concluido"?"Feito":"Pendente"}</span>
        </div>
        <div style="font-weight:700;font-size:.85rem;">${esc(item.titulo)}</div>
        <div style="display:flex;gap:12px;margin-top:3px;font-size:.7rem;color:var(--muted);">

  document.getElementById("p-manutencao").innerHTML=html;

function manuToggleDone(id){
  const d=(S.manutencao||[]).find(x=>x.id===id);if(!d)return;
  if(d.status==="concluido"){d.status="pendente";d.obs="";}
  else{openConcluirManu(id);return;}
  saveLocal();renderManutencao();
}

function saveDemanda(id){
  const titulo=document.getElementById("mn-titulo").value.trim();
  if(!titulo){toast("Informe o que precisa ser feito.");return;}
  const tipo=document.getElementById("mn-tipo")?.value||"data";
  if(!S.manutencao)S.manutencao=[];
  const existing=id?(S.manutencao.find(x=>x.id===id)||{}):{};
  const entry={
    ...existing,
    id:id||uid(),titulo,
    desc:document.getElementById("mn-desc").value.trim(),
    loja:document.getElementById("mn-loja").value,
    categoria:document.getElementById("mn-cat").value,
    prioridade:document.getElementById("mn-prio").value,
    tipo,
    data:tipo!=="geral"?(document.getElementById("mn-data")?.value||todayKey()):"",
    status:existing.status||"pendente",
    criadoPor:me,criadoEm:existing.criadoEm||todayKey(),
    materiais:existing.materiais||[]
  };
  if(id){const idx=S.manutencao.findIndex(x=>x.id===id);if(idx>=0)S.manutencao[idx]=entry;}
  else{
    S.manutencao.push(entry);
    waNotify("manu-nova",{titulo,loja:MANU_LOJAS[entry.loja]?.label||entry.loja,data:fmtDate(entry.data)||"(geral)",prio:entry.prioridade});
  }
  saveLocal();toast(id?"Demanda atualizada!":"Demanda criada!");closeModal();renderManutencao();
}

function openAddMaterial(demandaId){
  document.getElementById("modal-body").innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div style="font-weight:800;font-size:1rem;">Material Utilizado</div>
      <button class="btn-ghost btn-sm" onclick="closeModal()"></button>
    </div>
    <div class="f-grp"><label class="f-lb">Material *</label>
      <input class="f-in" id="mat-nome" placeholder="Ex: Lâmpada LED 9W, Fio 2,5mm..."/></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="f-grp"><label class="f-lb">Quantidade</label>
        <input class="f-in" type="number" id="mat-qty" value="1" min="1"/></div>
      <div class="f-grp"><label class="f-lb">Custo (R$)</label>
        <input class="f-in" type="number" id="mat-custo" placeholder="0,00" step="0.01" min="0"/></div>
    </div>
    <button class="btn-gold" style="width:100%;margin-top:8px;" onclick="addMaterial('${demandaId}')">Adicionar</button>`;

function addMaterial(demandaId){
  const nome=document.getElementById("mat-nome").value.trim();
  const custo=parseFloat(document.getElementById("mat-custo").value)||0;
  const qty=parseInt(document.getElementById("mat-qty").value)||1;
  if(!nome){toast("Informe o material.");return;}
  const d=(S.manutencao||[]).find(x=>x.id===demandaId);if(!d)return;
  if(!d.materiais)d.materiais=[];
  d.materiais.push({id:uid(),nome,custo,qty});
  saveLocal();toast("Material adicionado!");closeModal();renderManutencao();
}

function openConcluirManu(id){
  document.getElementById("modal-body").innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div style="font-weight:800;font-size:1rem;">Concluir Tarefa</div>
      <button class="btn-ghost btn-sm" onclick="closeModal()"></button>
    </div>
    <div class="f-grp"><label class="f-lb">O que foi feito? (opcional)</label>
      <textarea class="f-in" id="manu-obs" rows="3" placeholder="Descreva rapidamente o que foi feito, se ficou alguma pendência..."></textarea></div>
    <button class="btn-gold" style="width:100%;margin-top:8px;font-size:1rem;padding:14px;" onclick="concluirManu('${id}')">Marcar como Concluído</button>`;
  openModal();
}

function concluirManu(id){
  const d=(S.manutencao||[]).find(x=>x.id===id);if(!d)return;
  d.status="concluido";
  d.obs=document.getElementById("manu-obs")?.value.trim()||"";
  d.concluidoEm=todayKey();
  saveLocal();toast("Tarefa concluída!");closeModal();renderManutencao();
}

function deleteDemanda(id){
  if(!confirm("Remover esta demanda?"))return;
  S.manutencao=(S.manutencao||[]).filter(x=>x.id!==id);
  saveLocal();toast("Removida.");renderManutencao();
}

function arquivarMesManu(){
  const prevMes=prevMonthKey();let count=0;
  (S.manutencao||[]).forEach(d=>{
    if(!d._arq&&d.status==="concluido"&&(d.data||"").startsWith(prevMes)){d._arq=true;d._arqMes=prevMes;count++;}
  });
  saveLocal();toast(count?`${count} demanda(s) arquivadas.`:"Nenhuma para arquivar.");renderManutencao();
}

function downloadManuHist(mes){
  const rows=(S.manutencao||[]).filter(d=>d._arq&&d._arqMes===mes).map(d=>{
    const custoTotal=(d.materiais||[]).reduce((s,m)=>s+(parseFloat(m.custo)||0),0);
    return{"Título":d.titulo,"Loja":MANU_LOJAS[d.loja]?.label||d.loja,"Data":d.data,"Status":d.status,
      "Observação":d.obs||"","Custo Total":fmtBRL(custoTotal),"Criado por":M[d.criadoPor]?.name||d.criadoPor||""};
  });
  downloadCSV(rows,"manutencao_"+mes+".csv");
}

  {id:'rot012_d',titulo:'Rotina Diária de Marketing',desc:'TODO DIA — independente do que mais acontecer na semana, estas 4 ações são obrigatórias: 1) Postar ou republicar stories do dia (mínimo 3 stories — pode ser produto, bastidor, cliente, meme do dia). 2) Acompanhar comentários nos posts (responder perguntas, agradecer elogios, sinalizar reclamações para resolução). 3) Responder mensagens recebidas no direct/WhatsApp/iFood. 4) Registrar qualquer insight de cliente captado no dia (frase que ouviu, pergunta frequente, elogio espontâneo). Esse último alimenta o planejamento de sexta.',assignees:['carol'],freq:'diaria',icon:'',color:'#f43f5e',isLeader:true,createdBy:'marlon',campos:[{id:'cf1',label:'Stories publicados hoje?',tipo:'sim-nao'},{id:'cf2',label:'Quantidade de stories',tipo:'number'},{id:'cf3',label:'Comentários respondidos?',tipo:'sim-nao'},{id:'cf4',label:'Mensagens respondidas?',tipo:'sim-nao'},{id:'cf5',label:'Insight do dia (o que o cliente disse/perguntou)',tipo:'text'}]},
  // SEGUNDA — Dia de pensar
  {id:'rot012',titulo:'Segunda — Análise & Planejamento da Semana',desc:'SEGUNDA é o DIA DE PENSAR, não de gravar. Pilar: Estratégia. ANÁLISE DA SEMANA ANTERIOR: abrir Meta Business Suite/Instagram Insights e analisar posts, stories e reels publicados na semana. Ver métricas: alcance, impressões, curtidas, comentários, compartilhamentos e salvamentos. Identificar: qual post gerou mais movimento? Qual não funcionou? Por quê? PLANEJAMENTO DA SEMANA: definir os temas dos conteúdos da semana. Listar ideias de gravação para terça e quinta. Mapear campanhas e promoções ativas. Organizar agenda de publicação (o que vai no feed, o que vai nos stories, quando sobe cada coisa).',assignees:['carol'],freq:'semanal',diaSemana:1,icon:'',color:'#f43f5e',isLeader:true,createdBy:'marlon',campos:[{id:'cf1',label:'Análise da semana anterior concluída?',tipo:'sim-nao'},{id:'cf2',label:'Post com mais alcance da semana',tipo:'text'},{id:'cf3',label:'Alcance do melhor post',tipo:'text'},{id:'cf4',label:'Post que menos funcionou (e por quê)',tipo:'text'},{id:'cf5',label:'Tema principal da semana planejado',tipo:'text'},{id:'cf6',label:'Ideias de gravação listadas para ter/qui?',tipo:'sim-nao'},{id:'cf7',label:'Campanhas/promoções ativas mapeadas?',tipo:'sim-nao'},{id:'cf8',label:'Agenda de publicação da semana organizada?',tipo:'sim-nao'}]},
  // TERÇA — Dia completo no restaurante
  {id:'rot012b',titulo:'Terça — Gravação + Operação + Cliente',desc:'TERÇA é o DIA COMPLETO DENTRO DO RESTAURANTE. Pilares: Conteúdo + Serviço. GRAVAÇÃO OBRIGATÓRIA: gravar pratos (apresentação, montagem, close no prato), bastidores (cozinha, equipe trabalhando, processo) e equipe (rosto humano por trás do restaurante). OBSERVAÇÃO DE OPERAÇÃO: observar o comportamento dos clientes — o que eles pedem, o que causa dúvida, o que encanta, o que irrita. Anotar pedidos mais comuns e dúvidas frequentes. COLETA DE FEEDBACK (informal): perguntar para pelo menos 2 a 3 clientes: "O que você mais gosta aqui?", "O que te faz voltar?", "Como você conheceu o restaurante?". Essas respostas alimentam o conteúdo e a estratégia. "Esse dia aproxima o marketing da realidade."',assignees:['carol'],freq:'semanal',diaSemana:2,icon:'',color:'#f43f5e',isLeader:true,createdBy:'marlon',campos:[{id:'cf1',label:'Gravação de pratos realizada?',tipo:'sim-nao'},{id:'cf2',label:'Gravação de bastidores realizada?',tipo:'sim-nao'},{id:'cf3',label:'Gravação de equipe realizada?',tipo:'sim-nao'},{id:'cf4',label:'Quantidade de vídeos/fotos gravados',tipo:'number'},{id:'cf5',label:'Feedbacks de clientes coletados (quantidade)',tipo:'number'},{id:'cf6',label:'Principal insight do cliente hoje',tipo:'text'},{id:'cf7',label:'Pedido mais comum observado',tipo:'text'},{id:'cf8',label:'Algo que causou dúvida ou reclamação?',tipo:'text'}]},
  // QUARTA — Criação & Edição
  {id:'rot012c',titulo:'Quarta — Criação & Edição',desc:'QUARTA é o DIA DE TRANSFORMAR VIVÊNCIA EM COMUNICAÇÃO. Pilar: Conteúdo. EDIÇÃO: editar os materiais gravados na terça. Cortar, ajustar ritmo, adicionar legenda/texto/música. Manter identidade visual (cores, fonte, estilo MRZ). CRIAÇÃO: criar posts para o feed, reels e stories com o material editado. Organizar banco de conteúdo: nomear e arquivar os arquivos no drive/pasta padrão para não perder nada. AJUSTES DE IDENTIDADE: verificar se os materiais publicados estão alinhados com a identidade visual do grupo (consistência de marca).',assignees:['carol'],freq:'semanal',diaSemana:3,icon:'️',color:'#f43f5e',isLeader:true,createdBy:'marlon',campos:[{id:'cf1',label:'Materiais da terça editados?',tipo:'sim-nao'},{id:'cf2',label:'Posts criados (quantidade)',tipo:'number'},{id:'cf3',label:'Reels criados (quantidade)',tipo:'number'},{id:'cf4',label:'Stories criados (quantidade)',tipo:'number'},{id:'cf5',label:'Material arquivado no banco de conteúdo?',tipo:'sim-nao'},{id:'cf6',label:'Identidade visual mantida?',tipo:'sim-nao'}]},
  // QUINTA — Gravação + Campanhas + Tráfego Pago
  {id:'rot012d',titulo:'Quinta — Gravação de Vendas + Campanhas',desc:'QUINTA é o SEGUNDO DIA DE GRAVAÇÃO — mais objetivo, focado em converter. Pilares: Conteúdo + Vendas. GRAVAÇÃO FOCADA EM VENDA: gravar vídeos e fotos de OFERTAS (promoção do dia/semana), LANÇAMENTOS (novo prato, nova opção, novidade) e CHAMADAS DE VENDA ("Peça agora pelo iFood", "Venha hoje", "Promoção só até domingo"). ANÚNCIOS: subir ou ajustar campanhas pagas no Meta Ads. Verificar se os anúncios ativos estão com bom desempenho (CPR, CTR). Pausar o que não está convertendo. CAMPANHAS: criar ou atualizar campanhas de promoção, ativações (cupons, frete grátis, combo) e tráfego pago para o iFood/Google. "Aqui o foco é converter, não só engajar."',assignees:['carol'],freq:'semanal',diaSemana:4,icon:'',color:'#f43f5e',isLeader:true,createdBy:'marlon',campos:[{id:'cf1',label:'Gravações de oferta/venda realizadas?',tipo:'sim-nao'},{id:'cf2',label:'Anúncios verificados/ajustados?',tipo:'sim-nao'},{id:'cf3',label:'CPR (custo por resultado) atual (R$)',tipo:'text'},{id:'cf4',label:'CTR (taxa de clique) atual (%)',tipo:'text'},{id:'cf5',label:'Anúncio pausado por baixo desempenho?',tipo:'sim-nao'},{id:'cf6',label:'Nova campanha/promoção criada?',tipo:'sim-nao'},{id:'cf7',label:'Descrição da campanha criada',tipo:'text'}]},
  // SEXTA — Análise de Cliente + Relatório Semanal
  {id:'rot012e',titulo:'Sexta — Análise de Cliente + Relatório Semanal',desc:'SEXTA CONECTA MARKETING COM REALIDADE. Pilares: Cliente + Resultado. ANÁLISE DE FEEDBACKS: revisar todos os insights e feedbacks coletados na semana (registro diário + terça no restaurante). Identificar objeções recorrentes (o que afasta o cliente), elogios (o que atrai) e padrões de comportamento. AJUSTES: com base nos dados da semana, ajustar campanhas que não estão funcionando, reformular mensagens, e atualizar o planejamento de conteúdo. RELATÓRIO SEMANAL: preencher os campos abaixo com os números da semana — esses dados formam o relatório semanal de marketing para Marlon e Bruna. APRENDIZADOS: registrar em uma frase o maior aprendizado da semana para usar no planejamento de segunda.',assignees:['carol'],freq:'semanal',diaSemana:5,icon:'',color:'#f43f5e',isLeader:true,createdBy:'marlon',campos:[{id:'cf1',label:'Feedbacks da semana analisados?',tipo:'sim-nao'},{id:'cf2',label:'Objeção mais comum dos clientes',tipo:'text'},{id:'cf3',label:'Elogio mais frequente',tipo:'text'},{id:'cf4',label:'Alcance total da semana (Instagram)',tipo:'text'},{id:'cf5',label:'Impressões totais',tipo:'text'},{id:'cf6',label:'Novos seguidores na semana',tipo:'number'},{id:'cf7',label:'Post com mais engajamento',tipo:'text'},{id:'cf8',label:'Taxa de engajamento do melhor post (%)',tipo:'text'},{id:'cf9',label:'Gasto em anúncios na semana (R$)',tipo:'text'},{id:'cf10',label:'Resultado dos anúncios (cliques/pedidos/resultados)',tipo:'text'},{id:'cf11',label:'Campanha ajustada ou pausada?',tipo:'sim-nao'},{id:'cf12',label:'Maior aprendizado da semana',tipo:'text'}]},
  // QUINZENAL — Reunião de performance
  {id:'rot013',titulo:'Dia 28 — Reunião de Performance Mensal',desc:'Todo dia 28: reunir com Marlon e/ou Bruna para apresentar os resultados do marketing do mês. Apresentar: evolução de seguidores, alcance, engajamento, retorno dos anúncios e comparativo com o mês anterior. Trazer também os insights de comportamento do cliente coletados no período. Propor ajustes de estratégia para o próximo mês.',assignees:['carol'],freq:'mensal',diaMes:28,color:'#f43f5e',isLeader:true,createdBy:'marlon',campos:[{id:'cf1',label:'Seguidores atuais (total)',tipo:'number'},{id:'cf2',label:'Crescimento de seguidores no mês',tipo:'number'},{id:'cf3',label:'Alcance total do mês',tipo:'text'},{id:'cf4',label:'Melhor post do período',tipo:'text'},{id:'cf5',label:'Investimento total em anúncios (R$)',tipo:'text'},{id:'cf6',label:'Melhor campanha do período',tipo:'text'},{id:'cf7',label:'Proposta de ajuste para o próximo mês',tipo:'text'},{id:'cf8',label:'Reunião realizada com Marlon/Bruna?',tipo:'sim-nao'}]},

  {id:'rot044',titulo:'Dia 02 — Relatório Mensal de Marketing (KPIs)',desc:'DIA 02 DE CADA MÊS: entregar o relatório mensal completo de marketing para Marlon e Bruna. O relatório cobre DOIS BLOCOS: 1) COMO FOI O MÊS ANTERIOR — todos os números e o que aprendemos. 2) COMO SERÁ O PRÓXIMO MÊS — planejamento, campanhas e metas. MÉTRICAS OBRIGATÓRIAS (preencher abaixo): Crescimento: seguidores ganhos, taxa de crescimento (%). Alcance: impressões, pessoas alcançadas. Engajamento: curtidas, comentários, compartilhamentos, salvamentos, taxa de engajamento. Reels/Stories: visualizações, retenção. Anúncios: investimento, alcance pago, CPR (custo por resultado), ROAS (retorno sobre investimento), CTR. Negócio: como os clientes conheceram o restaurante (dados coletados nas terças). KPI DE SAÚDE: taxa de crescimento de seguidores acima de 3% ao mês = bom. Taxa de engajamento acima de 5% = bom. CPR abaixo de R$ 0,50 para alcance = bom.',assignees:['carol'],freq:'mensal',diaMes:2,color:'#f43f5e',isLeader:true,createdBy:'marlon',campos:[

  // CARLOS - Contagem de Estoque (antes atribuído ao Rogério)
  {id:'rot031',titulo:'Domingo — Contagem de Estoque (base p/ pedidos de Segunda)',desc:'DOMINGO: realizar contagem física do estoque de todas as unidades. A contagem do domingo é a base para fechar os pedidos na segunda-feira — sem ela, não é possível saber o que pedir. Registrar: estoque atual por categoria/produto, itens abaixo do mínimo, itens zerados, itens com excesso. Reportar resultado para Carlos finalizar os pedidos logo na abertura de segunda.',assignees:['carlos'],freq:'semanal',diaSemana:0,icon:'',color:'#d97706',isLeader:true,createdBy:'marlon',campos:[{id:'cf1',label:'Contagem realizada em todas as unidades?',tipo:'sim-nao'},{id:'cf2',label:'Itens zerados (lista)',tipo:'text'},{id:'cf3',label:'Itens abaixo do mínimo',tipo:'text'},{id:'cf4',label:'Algum excesso identificado?',tipo:'sim-nao'},{id:'cf5',label:'Resultado enviado para Carlos?',tipo:'sim-nao'}]},

  {id:'rot045',titulo:'Dia 05 — Conferência de Valores com Fornecedores',desc:'Dia 5 de cada mês: Carlos liga para TODOS os fornecedores para confirmar se o valor que foi lançado no sistema pelo Marco bate com o que o fornecedor tem registrado (notinhas, consumos sem NF, pedidos do mês). Qualquer divergência deve ser registrada e reportada para Marco antes do fechamento. OBJETIVO: garantir que nenhum pagamento seja feito a maior ou a menor por falta de alinhamento entre o sistema interno e o fornecedor.',assignees:['carlos'],freq:'mensal',diaMes:5,icon:'',color:'#d97706',isLeader:true,createdBy:'marlon',campos:[{id:'cf1',label:'Todos os fornecedores contatados?',tipo:'sim-nao'},{id:'cf2',label:'Quantidade de fornecedores conferidos',tipo:'number'},{id:'cf3',label:'Houve divergência de valor?',tipo:'sim-nao'},{id:'cf4',label:'Fornecedor(es) com divergência',tipo:'text'},{id:'cf5',label:'Valor total de divergência (R$)',tipo:'text'},{id:'cf6',label:'Divergências reportadas para Marco?',tipo:'sim-nao'}]},
  // NELCI — Rotinas mensais
  {id:'rot023',titulo:'Dia 05 — Relatório de Caixas do Mês',desc:'Dia 5 de cada mês: consolidar e enviar o relatório completo de caixas do mês anterior de todas as 5 lojas (Zanoni Alphaville, Zanoni Lago, Zanoni Maringá, Raz Alameda, Raz Mercadão). O relatório deve conter: total por loja, divergências encontradas e resolvidas, chargebacks do período, e variação vs. mês anterior. Enviar para Marlon e Bruna.',assignees:['nelci'],freq:'mensal',diaMes:5,icon:'️',color:'#8b5cf6',isLeader:true,createdBy:'marlon',campos:[{id:'cf1',label:'Relatório de todas as 5 lojas incluído?',tipo:'sim-nao'},{id:'cf2',label:'Divergências do mês (R$)',tipo:'text'},{id:'cf3',label:'Chargebacks do mês (R$)',tipo:'text'},{id:'cf4',label:'Variação vs. mês anterior',tipo:'text'},{id:'cf5',label:'Relatório enviado para Marlon e Bruna?',tipo:'sim-nao'}]},

  {id:'rot043',titulo:'Sexta — Conciliação Bancária Semanal',desc:'Toda sexta-feira: cruzar extrato bancário de cada conta com os lançamentos do sistema da semana. Verificar: entradas que não foram lançadas, saídas sem nota, taxas cobradas pelos bancos e maquininhas. Identificar cobranças indevidas da Stone (taxas MDR, antecipação). Registrar divergências e encaminhar para Bruna.',assignees:['nelci'],freq:'semanal',diaSemana:5,icon:'',color:'#8b5cf6',isLeader:true,createdBy:'marlon',campos:[{id:'cf1',label:'Extratos de todas as contas conferidos?',tipo:'sim-nao'},{id:'cf2',label:'Cobranças indevidas identificadas?',tipo:'sim-nao'},{id:'cf3',label:'Valor de cobranças indevidas (R$)',tipo:'text'},{id:'cf4',label:'Taxa MDR Stone dentro do esperado?',tipo:'sim-nao'},{id:'cf5',label:'Relatório de conciliação enviado para Bruna?',tipo:'sim-nao'}]},

function rotWeekNum(date){const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w)/864e5-(3-((w.getDay()+6)%7)))/7);}

function rotDueDatesInMonth(rot,year,month){
  const dates=[];
  const maxD=new Date(year,month,0).getDate();
  const freq=rot.freq||'semanal';
  if(freq==='diaria'){
    for(let d=1;d<=maxD;d++)dates.push(new Date(year,month-1,d));
  } else if(freq==='semanal'){
    const dow=rot.diaSemana??1;
    for(let d=1;d<=maxD;d++){const dt=new Date(year,month-1,d);if(dt.getDay()===dow)dates.push(dt);}
  } else if(freq==='quinzenal'){
    const qt=rot.quinzTipo;
    if(qt==='dias_fixos'){
      const d1=Math.min(rot.quinzDia1||1,maxD);
      const d2=Math.min(rot.quinzDia2||15,maxD);
      dates.push(new Date(year,month-1,Math.min(d1,d2)));
      if(d1!==d2)dates.push(new Date(year,month-1,Math.max(d1,d2)));
    } else if(qt==='ocorrencias'){
      // 1ª&3ª ou 2ª&4ª ocorrência do dia da semana
      const dow=rot.diaSemana??1;
      const occs=[];
      for(let d=1;d<=maxD;d++){const dt=new Date(year,month-1,d);if(dt.getDay()===dow)occs.push(dt);}
      if(rot.quinzPar){if(occs[1])dates.push(occs[1]);if(occs[3])dates.push(occs[3]);}
      else{if(occs[0])dates.push(occs[0]);if(occs[2])dates.push(occs[2]);}
    } else {
      // Legado: diaSemana-based, every other week
      const dow=rot.diaSemana??1;const seenBW=new Set();
      for(let d=1;d<=maxD;d++){const dt=new Date(year,month-1,d);if(dt.getDay()===dow){const bw=Math.ceil(rotWeekNum(dt)/2);if(!seenBW.has(bw)){seenBW.add(bw);dates.push(dt);}}}
    }
  } else if(freq==='mensal'){
    if(rot.mensalTipo==='ocorrencia'){
      const dow=rot.diaSemana??1;const nth=(rot.ocorrencia||1)-1;
      const occs=[];
      for(let d=1;d<=maxD;d++){const dt=new Date(year,month-1,d);if(dt.getDay()===dow)occs.push(dt);}
      if(occs[nth])dates.push(occs[nth]);
    } else {
      dates.push(new Date(year,month-1,Math.min(rot.diaMes||1,maxD)));
    }
  }
  return dates;
}

function rotPeriodKey(rot,date){
  const hasDate=date!=null;
  const d=date?new Date(date):new Date();
  d.setHours(0,0,0,0);
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0');
  const wn=rotWeekNum(d);
  const freq=rot.freq||'semanal';
  if(freq==='diaria')return`${y}-${m}-${String(d.getDate()).padStart(2,'0')}`;
  if(freq==='semanal')return`${y}-W${String(wn).padStart(2,'0')}`;
  if(freq==='mensal')return`${y}-${m}`;
  if(freq==='quinzenal'){
    if(hasDate){
      // Chamado com a data da rotina exata → usa ela como chave
      return`${y}-${m}-Q${String(d.getDate()).padStart(2,'0')}`;
    }
    // Chamado sem data (hoje) → descobre qual período estamos
    const dues=rotDueDatesInMonth(rot,d.getFullYear(),d.getMonth()+1);
    if(!dues.length)return`${y}-${m}-QA`;
    dues.sort((a,b)=>a-b);
    // Encontra a data de vencimento mais recente que seja <= hoje
    let pk=`${y}-${m}-Q${String(dues[0].getDate()).padStart(2,'0')}`;
    for(const due of dues){if(d>=due||d.toDateString()===due.toDateString())pk=`${y}-${m}-Q${String(due.getDate()).padStart(2,'0')}`;}
    return pk;
  }
  return`${y}-${m}`;
}
function rotCompKey(rotId,periodKey,assignee){return`${rotId}|${periodKey}|${assignee}`;}
function getRotComp(rotId,periodKey,assignee){return((S.rotinas?.completions)||{})[rotCompKey(rotId,periodKey,assignee)]||null;}
function rotStatusNow(rot,assignee){
  const pk=rotPeriodKey(rot);
  const comp=getRotComp(rot.id,pk,assignee);
  if(comp)return comp.status;
  const today=new Date();
  const due=rotDueDatesInMonth(rot,today.getFullYear(),today.getMonth()+1).find(d=>rotPeriodKey(rot,d)===pk);
  if(due&&due<today&&due.toDateString()!==today.toDateString())return'atrasado';
  return'pendente';
}
function rotCalEvents(){
  const evs=[];
  const today=new Date();
  for(let mOff=-1;mOff<=2;mOff++){
    const d=new Date(today.getFullYear(),today.getMonth()+mOff,1);
    const y=d.getFullYear(),mo=d.getMonth()+1;
    (S.rotinas?.defs||[]).forEach(rot=>{
      rotDueDatesInMonth(rot,y,mo).forEach(dt=>{
        const dateStr=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
        const pk=rotPeriodKey(rot,dt);
        const anyDone=(rot.assignees||[]).some(a=>getRotComp(rot.id,pk,a)?.status==='feito');
        evs.push({date:dateStr,title:rot.titulo,color:rot.color,icon:rot.icon,rotId:rot.id,tipo:'rotina',done:anyDone,assignees:rot.assignees||[]});
      });
    });
  }
  return evs;
}

// Retorna eventos de contas a pagar para o calendário (3 meses em volta)
function contasCalEvents(){
  if(!S.contasPagar)return[];
  const evs=[];
  const now=new Date();
  for(let mOff=-1;mOff<=2;mOff++){
    const d=new Date(now.getFullYear(),now.getMonth()+mOff,1);
    const y=d.getFullYear(),mo=d.getMonth();
    const ym=cpKeyFor(y,mo);
    const maxDay=new Date(y,mo+1,0).getDate();
    (S.contasPagar.lojas||[]).forEach(loja=>{
      (loja.contas||[]).filter(c=>c.dia&&c.dia<=maxDay).forEach(c=>{
        const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(c.dia).padStart(2,'0')}`;
        const pago=isContaPaga(c.id,ym);
        evs.push({date:ds,title:c.nome,loja:loja.nome,lojaId:loja.id,contaId:c.id,cor:loja.cor||'#c9a96e',ym,pago,tipo:'conta'});
      });
    });
  }
  return evs;
}

// Retorna [{rot, pk, due}] das rotinas devidas em uma data para um responsável
function rotasDueOn(date,assigneeId){
  if(!S.rotinas)return[];
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  const result=[];
  (S.rotinas.defs||[]).forEach(rot=>{
    if(assigneeId&&!rot.assignees.includes(assigneeId))return;
    const dues=rotDueDatesInMonth(rot,y,m);
    for(const due of dues){
      if(due.getDate()===d){
        result.push({rot,pk:rotPeriodKey(rot,due),due});
        break;
      }
    }
  });
  return result;
}

// Marca como feita sem abrir modal (para rotinas sem campos)
function rotMarkDoneFast(rotId,pk,assignee){
  if(!S.rotinas)return;
  const key=rotCompKey(rotId,pk,assignee);
  const existing=S.rotinas.completions[key];
  if(existing&&existing.status==='feito'){
    delete S.rotinas.completions[key];
    toast('Rotina desmarcada.');
  }else{
    S.rotinas.completions[key]={status:'feito',comoFoi:'',obs:'',links:[],campos:{},by:me,at:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
    toast('Rotina concluída!');
  }
  saveLocal();renderRotinas();
  if(document.getElementById('p-home')?.classList.contains('on'))renderHome();
  if(document.getElementById('p-calendar')?.classList.contains('on'))renderCalendar();
}
