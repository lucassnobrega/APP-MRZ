// OP: CHECKLISTS (TEMPLATES)
// ══════════════════════════════════════════════════════════════
function opTabChecklists(lojaId){
  if(!S.op.checklistModelos)S.op.checklistModelos={};
  if(!S.op.checklistModelos[lojaId])S.op.checklistModelos[lojaId]=[];
  const modelos=S.op.checklistModelos[lojaId];
  const setores=opSetores(lojaId);
  const canEdit=opCanSeeAll()||(opLojaDoGerente(me)===lojaId);
  let html='';
  if(canEdit){
    html+=`<div style="display:flex;justify-content:flex-end;margin-bottom:18px;">
      <button class="btn-gold btn-sm" onclick="opOpenNovoChecklist('${lojaId}')">+ Novo Checklist</button>
    </div>`;
  }
  setores.forEach(setor=>{
    const items=modelos.filter(m=>m.setor===setor);
    html+=`<div style="margin-bottom:20px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <div style="width:4px;height:18px;border-radius:2px;background:var(--acc);flex-shrink:0;"></div>
        <span style="font-weight:700;font-size:.9rem;">${setor}</span>
        <span style="font-size:.7rem;color:var(--muted);">${items.length} checklist${items.length!==1?'s':''}</span>
        ${canEdit?`<button class="btn-ghost btn-sm" style="font-size:.7rem;margin-left:auto;padding:3px 8px;" onclick="opOpenNovoChecklist('${lojaId}','${setor}')">+ Adicionar</button>`:''}
      </div>
      ${items.length===0
        ?`<div style="font-size:.76rem;color:var(--muted);padding:9px 12px;background:var(--panel2);border-radius:8px;">Nenhum checklist cadastrado — clique em "+ Adicionar" para criar.</div>`
        :items.map(m=>opRenderModeloCard(m,lojaId,canEdit)).join('')}
    </div>`;
  });
  return html;
}
function opRenderModeloCard(m,lojaId,canEdit){
  const TURNO={'Manhã':{cor:'#22d3ee'},'Tarde':{cor:'#f59e0b'},'Noite':{cor:'#8b5cf6'},'Geral':{cor:'#a78bfa'},abertura:{cor:'#22d3ee'},fechamento:{cor:'#f59e0b'},geral:{cor:'#a78bfa'}};
  const turnoLabel=m.turno||{abertura:'Manhã',fechamento:'Tarde',geral:'Geral'}[m.tipo]||'Geral';
  const cor=(TURNO[turnoLabel]||TURNO.geral).cor;
  return`<div class="card" style="padding:13px 16px;margin-bottom:6px;border-left:3px solid ${cor};${!m.ativo?'opacity:.55;':''}">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px;">
          <span style="font-size:.64rem;padding:2px 8px;border-radius:999px;background:${cor}22;color:${cor};font-weight:700;">${turnoLabel}</span>
          <span style="font-size:.88rem;font-weight:700;">${esc(m.nome)}</span>
          ${m.doubleCheck?'<span style="font-size:.6rem;padding:2px 7px;border-radius:999px;background:var(--acc)18;color:var(--acc);font-weight:700;">Double Check</span>':''}
          ${!m.ativo?'<span style="font-size:.62rem;color:var(--muted);background:var(--panel2);padding:1px 6px;border-radius:4px;">Inativo</span>':''}
        </div>
        <div style="font-size:.7rem;color:var(--muted);">
          ${m.horarioLimite?`Limite: ${m.horarioLimite} &nbsp;·&nbsp; `:''}
          ${(m.items||[]).length} item${(m.items||[]).length!==1?'s':''}
        </div>
      </div>
      ${canEdit?`<div style="display:flex;gap:4px;flex-shrink:0;">
        <button class="btn-ghost btn-sm" onclick="opToggleModeloAtivo('${lojaId}','${m.id}')" style="font-size:.7rem;">${m.ativo?'⏸':'▶'}</button>
        <button class="btn-ghost btn-sm" onclick="opOpenEditarChecklist('${lojaId}','${m.id}')" style="font-size:.7rem;">Editar</button>
        <button onclick="opDelModelo('${lojaId}','${m.id}')" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:0 4px;"></button>
      </div>`:''}
    </div>
  </div>`;
}
function opToggleModeloAtivo(lojaId,modeloId){
  const m=(S.op.checklistModelos?.[lojaId]||[]).find(x=>x.id===modeloId);
  if(m){m.ativo=!m.ativo;saveLocal();renderOperacional();}
}
function opDelModelo(lojaId,modeloId){
  if(!confirm('Remover este checklist?'))return;
  if(S.op.checklistModelos?.[lojaId])
    S.op.checklistModelos[lojaId]=S.op.checklistModelos[lojaId].filter(x=>x.id!==modeloId);
  saveLocal();renderOperacional();toast('Checklist removido.');
}
function opOpenNovoChecklist(lojaId,setorPre){
  const setores=opSetores(lojaId);
  openModal(`<h3 style="margin-bottom:20px;">Novo Checklist</h3>
    <div class="f-grp"><label class="f-lb">Nome do Checklist *</label>
      <input class="f-in" id="opcl-nome" placeholder="Ex: Cozinha — Abertura"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
      <div class="f-grp"><label class="f-lb">Área (Setor)</label>
        <select class="f-in" id="opcl-setor">
          ${setores.map(s=>`<option value="${s}"${s===(setorPre||'')?'selected':''}>${s}</option>`).join('')}
          <option value="Geral">Geral</option>
        </select>
      </div>
      <div class="f-grp"><label class="f-lb">Turno</label>
        <select class="f-in" id="opcl-turno">
          <option value="Manhã">Manhã</option>
          <option value="Tarde">Tarde</option>
          <option value="Noite">Noite</option>
          <option value="Geral">Geral</option>
        </select>
      </div>
    </div>
    <div id="opcl-err" style="font-size:.74rem;color:var(--red);min-height:14px;"></div>
    <button class="btn-gold" style="width:100%;margin-top:12px;" onclick="opSaveNovoChecklist('${lojaId}')">Criar e Configurar Itens →</button>`);
}
function opSaveNovoChecklist(lojaId){
  const nome=document.getElementById('opcl-nome').value.trim();
  if(!nome){document.getElementById('opcl-err').textContent='Nome obrigatório.';return;}
  if(!S.op.checklistModelos)S.op.checklistModelos={};
  if(!S.op.checklistModelos[lojaId])S.op.checklistModelos[lojaId]=[];
  const turno=document.getElementById('opcl-turno').value||'Geral';
  const tipoMap={'Manhã':'abertura','Tarde':'fechamento','Noite':'fechamento','Geral':'geral'};
  const novoId=uid();
  S.op.checklistModelos[lojaId].push({
    id:novoId,nome,
    setor:document.getElementById('opcl-setor').value,
    turno,tipo:tipoMap[turno]||'geral',
    horarioInicio:'',horarioLimite:'',
    responsaveis:[],diasBloq:[],freq:'diario',doubleCheck:false,
    items:[],ativo:true,criadoEm:new Date().toISOString(),criadoPor:me
  });
  saveLocal();closeModal();
  setTimeout(()=>opOpenEditarChecklist(lojaId,novoId),250);
  toast('Checklist criado!');
}
function opOpenEditarChecklist(lojaId,modeloId){
  const m=(S.op.checklistModelos?.[lojaId]||[]).find(x=>x.id===modeloId);
  if(!m)return;
  window._clLoja=lojaId;window._clModelo=modeloId;
  const setores=opSetores(lojaId);
  const funcs=(S.op.funcionarios||[]).filter(f=>f.loja===lojaId&&f.status==='ativo');
  const resp=m.responsaveis||[];
  const diasBloq=m.diasBloq||[];
  const DIAS=[{k:'dom',l:'Dom'},{k:'seg',l:'Seg'},{k:'ter',l:'Ter'},{k:'qua',l:'Qua'},{k:'qui',l:'Qui'},{k:'sex',l:'Sex'},{k:'sab',l:'Sáb'}];
  const turno=m.turno||{abertura:'Manhã',fechamento:'Tarde',geral:'Geral'}[m.tipo]||'Geral';
  openWideModal(`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 22px 14px;border-bottom:1px solid var(--line);">
      <h3 style="margin:0;font-size:1.05rem;">Editar Checklist</h3>
      <button onclick="closeModal();renderOperacional()" style="background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--muted);border-radius:8px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;font-size:1rem;">✕</button>
    </div>
    <div class="cl-editor">
      <div class="cl-editor-l">
        <div class="f-grp"><label class="f-lb">Nome do Checklist</label>
          <input class="f-in" id="cle-nome" value="${esc(m.nome)}" oninput="opCLAutoSave()"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div class="f-grp"><label class="f-lb">Área</label>
            <select class="f-in" id="cle-setor" onchange="opCLAutoSave()">
              ${setores.map(s=>`<option value="${s}"${s===m.setor?'selected':''}>${s}</option>`).join('')}
              <option value="Geral"${m.setor==='Geral'?'selected':''}>Geral</option>
            </select>
          </div>
          <div class="f-grp"><label class="f-lb">Turno</label>
            <select class="f-in" id="cle-turno" onchange="opCLAutoSave()">
              <option value="Manhã"${turno==='Manhã'?'selected':''}>Manhã</option>
              <option value="Tarde"${turno==='Tarde'?'selected':''}>Tarde</option>
              <option value="Noite"${turno==='Noite'?'selected':''}>Noite</option>
              <option value="Geral"${turno==='Geral'?'selected':''}>Geral</option>
            </select>
          </div>
        </div>
        <div class="f-grp"><label class="f-lb">Responsáveis <span style="font-weight:400;color:var(--muted);font-size:.68rem;">(pode selecionar mais de um)</span></label>
          <select class="f-in" id="cle-resp" multiple size="${Math.min(5,Math.max(2,funcs.length))}" onchange="opCLAutoSave()" style="height:auto;">
            ${funcs.length?funcs.map(f=>`<option value="${f.id}"${resp.includes(f.id)?'selected':''}>${esc(f.nome)}</option>`).join(''):'<option disabled>Nenhum funcionário cadastrado</option>'}
          </select>
        </div>
        <div style="margin-bottom:14px;">
          <div style="font-size:.66rem;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;">Restrições de Horário (Opcional)</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <div><label class="f-lb">Início (Bloqueio)</label>
              <input class="f-in" type="time" id="cle-inicio" value="${m.horarioInicio||''}" onchange="opCLAutoSave()"></div>
            <div><label class="f-lb">Limite (Atraso)</label>
              <div style="display:flex;align-items:center;gap:6px;">
                <input class="f-in" type="time" id="cle-limite" value="${m.horarioLimite||''}" onchange="opCLAutoSave()" style="flex:1;">
                ${m.horarioLimite?`<button onclick="document.getElementById('cle-limite').value='';opCLAutoSave()" style="background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--muted);padding:4px 8px;font-size:.8rem;">✕</button>`:''}
              </div>
            </div>
          </div>
        </div>
        <div style="margin-bottom:14px;">
          <div style="font-size:.66rem;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;">Configuração de Frequência</div>
          <select class="f-in" id="cle-freq" onchange="opCLAutoSave()">
            <option value="diario"${(m.freq||'diario')==='diario'?'selected':''}>Diário</option>
            <option value="semanal"${m.freq==='semanal'?'selected':''}>Semanal</option>
          </select>
          <div style="margin-top:10px;font-size:.74rem;color:var(--muted);margin-bottom:6px;">Não executar nos dias (Folgou/Fechou):</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            ${DIAS.map(d=>`<label style="font-size:.72rem;display:flex;align-items:center;gap:4px;cursor:pointer;">
              <input type="checkbox" id="cle-dia-${d.k}" ${diasBloq.includes(d.k)?'checked':''} onchange="opCLAutoSave()">${d.l}</label>`).join('')}
          </div>
        </div>
        <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);">
          <input type="checkbox" id="cle-double" ${m.doubleCheck?'checked':''} onchange="opCLAutoSave()" style="margin-top:3px;">
          <div>
            <div style="font-weight:700;font-size:.82rem;color:var(--acc);">Double Check (Antifraude)</div>
            <div style="font-size:.7rem;color:var(--muted);">Exigir 2 gerentes para concluir a tarefa.</div>
          </div>
        </label>
      </div>
      <div class="cl-editor-r" id="cle-right">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-shrink:0;">
          <div>
            <div style="font-weight:700;font-size:.95rem;">Itens do Checklist</div>
            <div style="font-size:.7rem;color:var(--muted);">Clique na engrenagem (⚙) para personalizar.</div>
          </div>
          <span id="cle-count" style="font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:7px;background:var(--panel2);">${(m.items||[]).length} Itens</span>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:14px;flex-shrink:0;">
          <input class="f-in" id="cle-novo-item" placeholder="Digite um Item..." style="flex:1;" onkeydown="if(event.key==='Enter')opCLAddItem()">
          <button class="btn-gold btn-sm" onclick="opCLAddItem()">Adicionar</button>
        </div>
        <div id="cle-items-list" style="flex:1;overflow-y:auto;">${opCLItemsHtml(m)}</div>
      </div>
    </div>`);
}
function opCLItemsHtml(m){
  const lojaId=window._clLoja,modeloId=window._clModelo;
  return(m.items||[]).map((item,i)=>{
    const tl={'ok_nok':'OK/NOK','valor':'Valor','estrelas':'Estrelas','data':'Data'}[item.tipoResp||'ok_nok']||'OK/NOK';
    return`<div id="cliw-${item.id}">
      <div class="cl-item-row${item._cfgOpen?'':' no-cfg'}">
        <span style="color:var(--muted);font-size:.9rem;cursor:grab;flex-shrink:0;">≡</span>
        <span style="flex:1;font-size:.83rem;line-height:1.4;">${esc(item.texto)}</span>
        <span style="font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:5px;background:var(--panel);border:1px solid var(--line);flex-shrink:0;">${tl}</span>
        ${item.exigeFoto?`<span style="font-size:.62rem;padding:2px 6px;border-radius:5px;background:var(--acc)18;color:var(--acc);flex-shrink:0;">Foto</span>`:''}
        <button onclick="opCLToggleCfg('${lojaId}','${modeloId}','${item.id}')" title="Configurar" style="background:none;border:1px solid var(--line);border-radius:6px;width:26px;height:26px;cursor:pointer;color:var(--muted);font-size:.78rem;flex-shrink:0;">⚙</button>
        <button onclick="opDelItem('${lojaId}','${modeloId}',${i})" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;padding:0 3px;flex-shrink:0;" title="Remover">🗑</button>
      </div>
      <div class="cl-item-cfg${item._cfgOpen?' open':''}" id="clicfg-${item.id}">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
          <div><label class="f-lb">Tipo de Resposta</label>
            <select class="f-in" id="clit-${item.id}" style="font-size:.78rem;">
              <option value="ok_nok"${(item.tipoResp||'ok_nok')==='ok_nok'?'selected':''}>Botões OK / NÃO OK (Padrão)</option>
              <option value="valor"${item.tipoResp==='valor'?'selected':''}>Digitar Valor (Ex: Temperaturas)</option>
              <option value="estrelas"${item.tipoResp==='estrelas'?'selected':''}>Avaliação (5 Estrelas)</option>
              <option value="data"${item.tipoResp==='data'?'selected':''}>Selecionar Data / Validade</option>
            </select>
          </div>
          <div><label class="f-lb">Instruções para o Colaborador</label>
            <input class="f-in" id="clii-${item.id}" value="${esc(item.instrucoes||'')}" placeholder="Ex: Verifique se as luzes estão apagadas..." style="font-size:.78rem;"></div>
        </div>
        <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:10px;">
          <label style="font-size:.76rem;display:flex;align-items:center;gap:5px;cursor:pointer;">
            <input type="checkbox" id="clif-${item.id}" ${item.exigeFoto?'checked':''}>Exigir Foto</label>
          <label style="font-size:.76rem;display:flex;align-items:center;gap:5px;cursor:pointer;">
            <input type="checkbox" id="clio-${item.id}" ${item.exigeObs?'checked':''}>Exigir Observação</label>
          ${(item.tipoResp||'ok_nok')==='ok_nok'?`<span style="font-size:.67rem;color:#f59e0b;padding:4px 8px;border-radius:6px;background:#f59e0b14;">Gera alerta de Não Conformidade se marcado como "NÃO OK".</span>`:''}
        </div>
        <div style="display:flex;justify-content:flex-end;">
          <button class="btn-gold btn-sm" onclick="opCLSaveItemCfg('${lojaId}','${modeloId}','${item.id}')">Salvar Item</button>
        </div>
      </div>
    </div>`;
  }).join('')||'<div style="font-size:.76rem;color:var(--muted);padding:16px 2px;text-align:center;">Nenhum item ainda. Adicione acima.</div>';
}
function opCLToggleCfg(lojaId,modeloId,itemId){
  const m=(S.op.checklistModelos?.[lojaId]||[]).find(x=>x.id===modeloId);
  const item=m?.items?.find(i=>i.id===itemId);
  if(!item)return;
  item._cfgOpen=!item._cfgOpen;
  const cfg=document.getElementById(`clicfg-${itemId}`);
  const row=cfg?.previousElementSibling;
  if(cfg){cfg.classList.toggle('open',item._cfgOpen);}
  if(row){row.classList.toggle('no-cfg',!item._cfgOpen);}
}
function opCLAddItem(){
  const lojaId=window._clLoja,modeloId=window._clModelo;
  const m=(S.op.checklistModelos?.[lojaId]||[]).find(x=>x.id===modeloId);
  if(!m)return;
  const inp=document.getElementById('cle-novo-item');
  const texto=inp?.value.trim();
  if(!texto){inp?.focus();return;}
  if(!m.items)m.items=[];
  m.items.push({id:uid(),texto,tipoResp:'ok_nok',instrucoes:'',exigeFoto:false,exigeObs:false});
  saveLocal();
  const list=document.getElementById('cle-items-list');
  if(list)list.innerHTML=opCLItemsHtml(m);
  const ct=document.getElementById('cle-count');
  if(ct)ct.textContent=`${m.items.length} Itens`;
  if(inp){inp.value='';inp.focus();}
}
function opCLSaveItemCfg(lojaId,modeloId,itemId){
  const m=(S.op.checklistModelos?.[lojaId]||[]).find(x=>x.id===modeloId);
  if(!m)return;
  const item=m.items.find(i=>i.id===itemId);
  if(!item)return;
  item.tipoResp=document.getElementById(`clit-${itemId}`)?.value||'ok_nok';
  item.instrucoes=document.getElementById(`clii-${itemId}`)?.value||'';
  item.exigeFoto=document.getElementById(`clif-${itemId}`)?.checked||false;
  item.exigeObs=document.getElementById(`clio-${itemId}`)?.checked||false;
  item._cfgOpen=false;
  saveLocal();
  const list=document.getElementById('cle-items-list');
  if(list)list.innerHTML=opCLItemsHtml(m);
  toast('Item salvo!');
}
function opCLAutoSave(){
  const lojaId=window._clLoja,modeloId=window._clModelo;
  const m=(S.op.checklistModelos?.[lojaId]||[]).find(x=>x.id===modeloId);
  if(!m)return;
  m.nome=document.getElementById('cle-nome')?.value.trim()||m.nome;
  m.setor=document.getElementById('cle-setor')?.value||m.setor;
  const turno=document.getElementById('cle-turno')?.value||'Geral';
  m.turno=turno;
  const tipoMap={'Manhã':'abertura','Tarde':'fechamento','Noite':'fechamento','Geral':'geral'};
  m.tipo=tipoMap[turno]||'geral';
  m.horarioInicio=document.getElementById('cle-inicio')?.value||'';
  m.horarioLimite=document.getElementById('cle-limite')?.value||'';
  m.freq=document.getElementById('cle-freq')?.value||'diario';
  m.diasBloq=['dom','seg','ter','qua','qui','sex','sab'].filter(d=>document.getElementById(`cle-dia-${d}`)?.checked);
  m.doubleCheck=document.getElementById('cle-double')?.checked||false;
  const sel=document.getElementById('cle-resp');
  if(sel)m.responsaveis=Array.from(sel.selectedOptions).map(o=>o.value);
  saveLocal();
}
function opAddItem(lojaId,modeloId){opCLAddItem();}
function opDelItem(lojaId,modeloId,idx){
  const m=(S.op.checklistModelos?.[lojaId]||[]).find(x=>x.id===modeloId);
  if(!m||!m.items)return;
  m.items.splice(idx,1);
  saveLocal();
  const list=document.getElementById('cle-items-list');
  if(list){list.innerHTML=opCLItemsHtml(m);const ct=document.getElementById('cle-count');if(ct)ct.textContent=`${m.items.length} Itens`;}
  else opOpenEditarChecklist(lojaId,modeloId);
}

// ══════════════════════════════════════════════════════════════
// OP: FAQ / POPs / FLUXOGRAMAS
// ══════════════════════════════════════════════════════════════
function opTabFAQ(lojaId){
  if(!S.op.faq)S.op.faq={};
  if(!S.op.faq[lojaId])S.op.faq[lojaId]={};
  const setores=opSetores(lojaId);
  const canEdit=opCanSeeAll()||(opLojaDoGerente(me)===lojaId);
  if(!window._opFaqSetor||!setores.includes(window._opFaqSetor))window._opFaqSetor=setores[0]||'';
  const selSetor=window._opFaqSetor;
  const setorTabs=setores.map(s=>`
    <button class="ev-type-btn${s===selSetor?' sel':''}" style="font-size:.74rem;"
      onclick="window._opFaqSetor='${s}';renderOperacional()">${s}</button>`).join('');
  const data=S.op.faq[lojaId]?.[selSetor]||{faq:[],pops:[],fluxograma:''};
  let html=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line);">${setorTabs}</div>`;
  // FAQ
  html+=`<div style="margin-bottom:28px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <span style="font-weight:700;font-size:.9rem;">Perguntas Frequentes (FAQ)</span>
      ${canEdit?`<button class="btn-ghost btn-sm" onclick="opOpenNovoFAQ('${lojaId}','${selSetor}')">+ Pergunta</button>`:''}
    </div>
    ${(data.faq||[]).length===0
      ?`<div style="font-size:.76rem;color:var(--muted);padding:10px 12px;background:var(--panel2);border-radius:8px;">Nenhuma pergunta cadastrada para este setor.</div>`
      :(data.faq||[]).map((f,i)=>`
        <details style="margin-bottom:6px;background:var(--panel2);border-radius:10px;overflow:hidden;">
          <summary style="cursor:pointer;font-size:.86rem;font-weight:600;padding:11px 14px;display:flex;align-items:center;gap:8px;list-style:none;">
            <span style="color:var(--acc);">▸</span> ${esc(f.pergunta)}
            ${canEdit?`<button onclick="event.stopPropagation();opDelFAQItem('${lojaId}','${selSetor}',${i})" style="background:none;border:none;color:var(--muted);cursor:pointer;margin-left:auto;font-size:.82rem;"></button>`:''}
          </summary>
          <div style="font-size:.81rem;padding:10px 14px 14px;color:var(--text);line-height:1.7;border-top:1px solid var(--line);">${esc(f.resposta).replace(/\n/g,'<br>')}</div>
        </details>`).join('')}
  </div>`;
  // POPs
  html+=`<div style="margin-bottom:28px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <span style="font-weight:700;font-size:.9rem;">POPs — Procedimentos Operacionais Padrão</span>
      ${canEdit?`<button class="btn-ghost btn-sm" onclick="opOpenNovoPOP('${lojaId}','${selSetor}')">+ POP</button>`:''}
    </div>
    ${(data.pops||[]).length===0
      ?`<div style="font-size:.76rem;color:var(--muted);padding:10px 12px;background:var(--panel2);border-radius:8px;">Nenhum POP cadastrado para este setor.</div>`
      :(data.pops||[]).map((p,i)=>`
        <details style="margin-bottom:6px;background:var(--panel2);border-radius:10px;overflow:hidden;">
          <summary style="cursor:pointer;font-size:.86rem;font-weight:600;padding:11px 14px;display:flex;align-items:center;gap:8px;list-style:none;">
            <span style="color:var(--acc);">▸</span>${esc(p.titulo)}
            ${canEdit?`<button onclick="event.stopPropagation();opDelPOP('${lojaId}','${selSetor}',${i})" style="background:none;border:none;color:var(--muted);cursor:pointer;margin-left:auto;font-size:.82rem;"></button>`:''}
          </summary>
          <div style="font-size:.81rem;padding:10px 14px 14px;color:var(--text);line-height:1.7;border-top:1px solid var(--line);white-space:pre-line;">${esc(p.conteudo)}</div>
        </details>`).join('')}
  </div>`;
  // Fluxograma
  html+=`<div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <span style="font-weight:700;font-size:.9rem;">Fluxograma</span>
      ${canEdit?`<button class="btn-ghost btn-sm" onclick="opEditFluxograma('${lojaId}','${selSetor}')">${data.fluxograma?'Editar link':'Adicionar link'}</button>`:''}
    </div>
    ${data.fluxograma
      ?`<div style="background:var(--panel2);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:10px;">
          <span style="font-size:1.2rem;"></span>
          <div style="flex:1;min-width:0;">
            <a href="${esc(data.fluxograma)}" target="_blank" style="color:var(--acc);font-size:.86rem;font-weight:600;">Abrir Fluxograma</a>
            <div style="font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;">${esc(data.fluxograma)}</div>
          </div>
        </div>`
      :`<div style="font-size:.76rem;color:var(--muted);padding:10px 12px;background:var(--panel2);border-radius:8px;">Nenhum fluxograma cadastrado.</div>`}
  </div>`;
  return html;
}
function opGetFaqSetor(lojaId,setor){
  if(!S.op.faq)S.op.faq={};
  if(!S.op.faq[lojaId])S.op.faq[lojaId]={};
  if(!S.op.faq[lojaId][setor])S.op.faq[lojaId][setor]={faq:[],pops:[],fluxograma:''};
  return S.op.faq[lojaId][setor];
}
function opOpenNovoFAQ(lojaId,setor){
  openModal(`<h3 style="margin-bottom:4px;">Nova Pergunta — FAQ</h3>
    <div style="font-size:.72rem;color:var(--muted);margin-bottom:16px;">Setor: ${setor}</div>
    <div class="f-grp"><label class="f-lb">Pergunta *</label>
      <input class="f-in" id="opfaq-p" placeholder="Ex: Como fazer o mise en place da cozinha?"></div>
    <div class="f-grp"><label class="f-lb">Resposta *</label>
      <textarea class="f-in" id="opfaq-r" rows="6" placeholder="Descreva a resposta de forma clara e detalhada..."></textarea></div>
    <div id="opfaq-err" style="font-size:.74rem;color:var(--red);min-height:14px;"></div>
    <button class="btn-gold" style="width:100%;margin-top:12px;" onclick="opSaveFAQ('${lojaId}','${setor}')">Salvar</button>`);
}
function opSaveFAQ(lojaId,setor){
  const p=document.getElementById('opfaq-p').value.trim();
  const r=document.getElementById('opfaq-r').value.trim();
  if(!p||!r){document.getElementById('opfaq-err').textContent='Preencha pergunta e resposta.';return;}
  const d=opGetFaqSetor(lojaId,setor);
  if(!d.faq)d.faq=[];
  d.faq.push({id:uid(),pergunta:p,resposta:r,criadoEm:new Date().toISOString()});
  saveLocal();closeModal();renderOperacional();toast('FAQ adicionado!');
}
function opDelFAQItem(lojaId,setor,idx){
  const d=S.op.faq?.[lojaId]?.[setor];if(!d)return;
  d.faq.splice(idx,1);saveLocal();renderOperacional();
}
function opOpenNovoPOP(lojaId,setor){
  openModal(`<h3 style="margin-bottom:4px;">Novo POP</h3>
    <div style="font-size:.72rem;color:var(--muted);margin-bottom:16px;">Setor: ${setor}</div>
    <div class="f-grp"><label class="f-lb">Título *</label>
      <input class="f-in" id="oppop-t" placeholder="Ex: Procedimento de Abertura da Cozinha"></div>
    <div class="f-grp"><label class="f-lb">Conteúdo (passo a passo) *</label>
      <textarea class="f-in" id="oppop-c" rows="9" placeholder="1. Verificar temperatura das geladeiras&#10;2. Conferir estoque&#10;3. ..."></textarea></div>
    <div id="oppop-err" style="font-size:.74rem;color:var(--red);min-height:14px;"></div>
    <button class="btn-gold" style="width:100%;margin-top:12px;" onclick="opSavePOP('${lojaId}','${setor}')">Salvar POP</button>`);
}
function opSavePOP(lojaId,setor){
  const t=document.getElementById('oppop-t').value.trim();
  const c=document.getElementById('oppop-c').value.trim();
  if(!t||!c){document.getElementById('oppop-err').textContent='Preencha título e conteúdo.';return;}
  const d=opGetFaqSetor(lojaId,setor);
  if(!d.pops)d.pops=[];
  d.pops.push({id:uid(),titulo:t,conteudo:c,criadoEm:new Date().toISOString()});
  saveLocal();closeModal();renderOperacional();toast('POP adicionado!');
}
function opDelPOP(lojaId,setor,idx){
  const d=S.op.faq?.[lojaId]?.[setor];if(!d)return;
  d.pops.splice(idx,1);saveLocal();renderOperacional();
}
function opEditFluxograma(lojaId,setor){
  const d=opGetFaqSetor(lojaId,setor);
  openModal(`<h3 style="margin-bottom:4px;">Fluxograma — ${setor}</h3>
    <div style="font-size:.72rem;color:var(--muted);margin-bottom:16px;">Cole o link do Lucidchart, Miro, Google Drive, Canva, etc.</div>
    <div class="f-grp"><label class="f-lb">Link do Fluxograma</label>
      <input class="f-in" id="opflux-url" value="${esc(d.fluxograma||'')}" placeholder="https://..."></div>
    <button class="btn-gold" style="width:100%;margin-top:14px;" onclick="opSaveFluxograma('${lojaId}','${setor}')">Salvar</button>`);
}
function opSaveFluxograma(lojaId,setor){
  const d=opGetFaqSetor(lojaId,setor);
  d.fluxograma=document.getElementById('opflux-url').value.trim();
  saveLocal();closeModal();renderOperacional();toast('Fluxograma atualizado!');
}

</script>
</body>
</html>
