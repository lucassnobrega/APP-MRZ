  const podeOp=!isSetorLider&&(isL||opCanSeeAll()||opLojaDoGerente(me)||_opGerentes.includes(me));
  const _admUsers=['marcio','bruna','marlon','lucas'];
  const podeAdm=isL||_admUsers.includes(me);
  const switcher=(podeOp&&podeAdm)?`<div style="display:flex;gap:3px;margin:2px 4px 12px;">
    <button onclick="setAppMode('adm')" style="flex:1;padding:7px 6px;border:none;border-radius:8px;cursor:pointer;font-size:.76rem;font-weight:700;
      background:${mode==='adm'?'var(--acc)':'var(--panel2)'};color:${mode==='adm'?'#fff':'var(--muted)'};">ADM</button>
    <button onclick="setAppMode('operacional')" style="flex:1;padding:7px 6px;border:none;border-radius:8px;cursor:pointer;font-size:.76rem;font-weight:700;
      background:${mode==='operacional'?'var(--acc)':'var(--panel2)'};color:${mode==='operacional'?'#fff':'var(--muted)'};">Operacional</button>
  </div>`:'';
  // Modo OPERACIONAL — nav operacional no lugar do ADM
  if(mode==='operacional'){
    document.getElementById('sb-nav').innerHTML=switcher+buildOpSidebarHtml();
    return;
  }
  // Modo ADM (padrão)
  const customPerms=(!isL)&&S&&S.userPerms&&S.userPerms[me];
  let html='';let lastGrp='';
  const navAll=[...NAV_ITEMS,{id:'usuarios',label:'Usuários',grp:'Gestão',leader:true}];
  navAll.forEach(item=>{
    if(customPerms){
      if(!customPerms.includes(item.id))return;
    } else {
      if(item.exclude&&item.exclude.includes(me))return;
      if(item.roles&&!item.roles.includes(me)&&!isL)return;
      if(item.leader&&!isL&&!(item.extra&&item.extra.includes(me)))return;
    }
    if(item.grp!==lastGrp){html+=`<div class="nav-grp">${item.grp}</div>`;lastGrp=item.grp;}
    const badge=item.id==='queue'?pendingAll():0;
    html+=`<button class="ni" id="ni-${item.id}" onclick="goPanel('${item.id}')">
      ${item.label}${badge>0?`<span class="badge-n">${badge}</span>`:''}
    </button>`;
  });
  document.getElementById('sb-nav').innerHTML=switcher+html;
}

const NAV_ALL_IDS=[...NAV_ITEMS.map(n=>n.id),'usuarios'];
function goPanel(id){
  // Se vindo de modo operacional para um painel ADM, restaurar sidebar ADM
  if(window._appMode==='operacional'&&id!=='operacional'){
    window._appMode='adm';
    buildSidebar();
  }
  // Guardar último painel ADM para voltar depois
  if(id!=='operacional')window._lastAdmPanel=id;
  curPanel=id;
  NAV_ALL_IDS.forEach(nid=>{document.getElementById('ni-'+nid)?.classList.remove('on');document.getElementById('p-'+nid)?.classList.remove('on');});
  document.getElementById('ni-'+id)?.classList.add('on');
  document.getElementById('p-'+id)?.classList.add('on');
  const lbl={...Object.fromEntries(NAV_ITEMS.map(n=>[n.id,n.label])),usuarios:'Usuários'};
  document.getElementById('tb-title').textContent=lbl[id]||id;
  closeSB();
  renderPanel(id);
}
function renderPanel(id){
  switch(id){
    case 'home':renderHome();break;
    case 'calendar':renderCalendar();break;
    case 'tasks':renderTasks();break;
    case 'trilha':renderTrilha();break;
    case 'rotinas':renderRotinas();break;
    case 'flow':renderFlow();break;
    case 'report':renderReport();break;
    case 'erros-caixa':renderErrosCaixa();break;
    case 'occ':renderOcc();break;

// ── HOME: Trilha progress ───────────────────────────────────
function homeTrilhaHtml(){
  const roleKey=me;
  const flows=defTrilhaFlows()[roleKey]||[];
  const quiz=TRILHA_QUIZ[roleKey]||[];
  if(!flows.length&&!quiz.length)return'';
  const progress=S.trilha?.progress?.[roleKey]||{};
  const quizData=S.trilha?.quiz?.[roleKey];
  const doneSteps=flows.filter((_,i)=>progress[i]).length;
  const totalSteps=flows.length;
  const quizScore=quizData?.score||0;
  // weighted: 60% steps, 40% quiz
  const stepPct=totalSteps?Math.round((doneSteps/totalSteps)*100):0;
  const quizPct=quiz.length?quizScore:0;
  const pct=totalSteps&&quiz.length?Math.round(stepPct*.6+quizPct*.4):totalSteps?stepPct:quizPct;
  const color=pct>=80?'var(--green)':pct>=40?'var(--gold2)':'var(--blue)';
  return`<div class="home-trilha" onclick="goPanel('trilha')">
    <div class="home-trilha-hd">
      <div class="home-trilha-icon" style="width:34px;height:34px;border-radius:9px;background:${color}22;display:grid;place-items:center;font-size:.72rem;font-weight:800;color:${color};">${pct}%</div>
      <div class="home-trilha-title">Trilha de Aprendizado</div>
      <div class="home-trilha-pct" style="color:${color}">${pct}%</div>
    </div>
    <div class="home-trilha-bar"><div class="home-trilha-fill" style="width:${pct}%;background:${color}"></div></div>
    <div class="home-trilha-sub">${doneSteps}/${totalSteps} etapas concluídas${quiz.length?` · Quiz: ${quizScore}%`:''}</div>
  </div>`;
}

// ── Drag & drop handlers ─────────────────────
function kDragStart(e,id){
  _dragId=id;
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>{const el=document.getElementById('tc-'+id);if(el)el.classList.add('dragging');},0);
}
function kDragEnd(e){
  _dragId=null;_dragOverId=null;
  document.querySelectorAll('.task-card').forEach(c=>c.classList.remove('dragging','drop-before','drop-after'));
  document.querySelectorAll('.kan-body').forEach(c=>c.classList.remove('drag-over'));
}
function kCardDragOver(e,cardId){
  if(!_dragId||cardId===_dragId)return;
  e.preventDefault();e.stopPropagation();
  const rect=e.currentTarget.getBoundingClientRect();
  _dragOverId=cardId;
  _dragOverBefore=e.clientY<rect.top+rect.height/2;
  document.querySelectorAll('.task-card').forEach(c=>c.classList.remove('drop-before','drop-after'));
  e.currentTarget.classList.add(_dragOverBefore?'drop-before':'drop-after');
}
function kCardDragLeave(e,cardId){
  if(_dragOverId===cardId){_dragOverId=null;}
  e.currentTarget.classList.remove('drop-before','drop-after');
}
function kDragOver(e,colId,allowed){
  if(!allowed){e.dataTransfer.dropEffect='none';return;}
  e.preventDefault();e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.kan-body').forEach(c=>c.classList.remove('drag-over'));
  e.currentTarget.classList.add('drag-over');
}
function kDragLeave(e){e.currentTarget.classList.remove('drag-over');}
function kDrop(e,colId,allowed){
  e.preventDefault();
  document.querySelectorAll('.kan-body').forEach(c=>c.classList.remove('drag-over'));
  document.querySelectorAll('.task-card').forEach(c=>c.classList.remove('drop-before','drop-after'));
  if(!allowed){toast('Apenas líderes podem mover para esta coluna.');return;}
  if(!_dragId)return;
  const t=S.tasks.find(x=>x.id===_dragId);if(!t)return;
  const isL=M[me].isLeader;
  const isAssignee=(t.assignees||[]).includes(me);
  if(!isL&&!isAssignee){toast('Você não é responsável por esta tarefa.');return;}
  if((colId==='aprovado'||colId==='ajuste')&&!isL){toast('Apenas líderes podem dar devolutiva.');return;}
  if(colId==='review'&&!isAssignee&&!isL){toast('Você não pode submeter esta tarefa.');return;}
  if(colId==='doing'&&t.ajusteNote)t.ajusteNote='';
  const prevStatus=t.status;
  // Reordenação: remove do array e reinsere na posição correta
  const fromIdx=S.tasks.findIndex(x=>x.id===_dragId);
  S.tasks.splice(fromIdx,1);
  t.status=colId;
  if(_dragOverId&&_dragOverId!==_dragId){
    const toIdx=S.tasks.findIndex(x=>x.id===_dragOverId);
    if(toIdx>=0){
      const insertAt=_dragOverBefore?toIdx:toIdx+1;
      S.tasks.splice(insertAt,0,t);
    } else {
      S.tasks.push(t);
    }
  } else {
    // Solta na coluna sem posição específica — vai para o início
    const firstInCol=S.tasks.findIndex(x=>x.status===colId);
    if(firstInCol>=0)S.tasks.splice(firstInCol,0,t);else S.tasks.push(t);
  }
  _dragId=null;_dragOverId=null;
  saveLocal();renderTasks();renderHome();
  if(prevStatus!==colId)toast('Tarefa movida!');
  if(colId==='review'&&prevStatus!=='review'){
    waNotify('aprovacao',{title:t.title,from:M[me]?.name||me});
  }
}

function openNewTask(){
  editingTask=null;
  renderTaskModal({id:uid(),title:'',desc:'',status:'todo',priority:'m',assignees:[me],attachments:[],deadline:'',created:todayKey(),comments:[]});
}
function openTask(id){
  editingTask=S.tasks.find(t=>t.id===id);
  if(editingTask)renderTaskModal(editingTask);
}
function closeTaskModal(){document.getElementById('task-modal').classList.remove('show');}
function openModal(html){const b=document.getElementById('modal-body');if(b&&html)b.innerHTML=html;const m=document.querySelector('#gen-modal .modal');if(m)m.style.maxWidth='';document.getElementById('gen-modal').classList.add('show');}
function openWideModal(html){openModal(html);const m=document.querySelector('#gen-modal .modal');if(m)m.style.maxWidth='960px';}
function closeModal(){document.getElementById('gen-modal').classList.remove('show');}

function renderTaskModal(t){

    const sel=(t.assignees||[]).includes(k);
    return`<span class="collab-chip" style="background:${m2.color}${sel?'33':'11'};color:${m2.color};border:1px solid ${m2.color}${sel?'55':'22'};cursor:pointer;" onclick="toggleTaskAssignee('${t.id}','${k}')">${m2.icon} ${m2.name.split(' ')[0]}${sel?' ':''}</span>`;
  }).join('');

  const attsHtml=(t.attachments||[]).map(a=>`<div class="att-item">
    <span class="att-icon" style="font-size:.6rem;font-weight:800;letter-spacing:.03em;">${a.type==='url'?'URL':a.type==='img'?'IMG':'DOC'}</span>
    <span class="att-name">${a.type==='url'?`<a href="${esc(a.url)}" target="_blank" style="color:var(--blue);">${esc(a.name)}</a>`:esc(a.name)}</span>
    <button class="att-del" onclick="removeAtt('${t.id}','${a.id}')"></button>
  </div>`).join('');

  const isL=M[me].isLeader;

  const devolutivaSection=t.status==='review'&&isL?`
    <div class="sec">Devolutiva</div>
    <div style="background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.2);border-radius:12px;padding:14px;">
      <div style="font-size:.8rem;color:var(--muted);margin-bottom:10px;">Como foi a entrega? Sua resposta moverá a tarefa automaticamente.</div>
      <div style="display:flex;gap:10px;margin-bottom:10px;">
        <button class="btn-gold btn-sm" style="background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--green);" onclick="darDevolutiva('${t.id}','aprovado')">Aprovado</button>

      </div>
      <textarea class="f-in" id="dev-obs" rows="2" placeholder="Observação para o responsável (opcional)..."></textarea>
    </div>`:'';

  // Show ajuste note if exists
  const ajusteNoteHtml=t.ajusteNote?`<div style="background:rgba(249,115,22,.07);border:1px solid rgba(249,115,22,.2);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:.8rem;"><span style="color:#fb923c;font-weight:700;">↺ Pedido de ajuste:</span> ${esc(t.ajusteNote)}</div>`:'';

  window.tmpTask={...t,cotacaoItems:[...(t.cotacaoItems||[])]};
  _tcotOpen=!!(t.cotacaoItems&&t.cotacaoItems.length);

  document.getElementById('task-modal-inner').innerHTML=`
    <div class="modal-hd">
      <h3>${isNew?'Nova Tarefa':'Editar Tarefa'}</h3>
      <button class="modal-close" onclick="closeTaskModal()"></button>
    </div>
    <div class="modal-body">
      <div class="f-grp"><label class="f-lb">Título</label><input class="f-in" id="tm-title" value="${esc(t.title)}" placeholder="Título da tarefa"/></div>
      <div class="f-grp"><label class="f-lb">Descrição</label><textarea class="f-in" id="tm-desc" rows="3" placeholder="Descreva a tarefa...">${esc(t.desc||'')}</textarea></div>
      ${ajusteNoteHtml}
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
        <div class="f-grp"><label class="f-lb">Status</label><select class="f-in" id="tm-status">
          <option value="todo" ${t.status==='todo'?'selected':''}>A Fazer</option>
          <option value="doing" ${t.status==='doing'?'selected':''}>Fazendo</option>
          <option value="review" ${t.status==='review'?'selected':''}>Em Aprovação</option>
          <option value="done" ${t.status==='done'?'selected':''}>Feito</option>
          ${isL?`<option value="aprovado" ${t.status==='aprovado'?'selected':''}>Aprovado</option>
          <option value="ajuste" ${t.status==='ajuste'?'selected':''}>Em Ajuste</option>`:''}
        </select></div>
        <div class="f-grp"><label class="f-lb">Prioridade</label><select class="f-in" id="tm-prio">
          <option value="l" ${t.priority==='l'?'selected':''}>Baixa</option>
          <option value="m" ${t.priority==='m'?'selected':''}>Média</option>

      <div class="f-grp"><label class="f-lb">Responsáveis</label><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;" id="tm-assignees">${assigneeChips}</div></div>

      </div>
      <div class="file-drop" id="file-drop-${t.id}" onclick="document.getElementById('file-in-${t.id}').click()">
        <p>Clique ou arraste para anexar arquivo</p>

      </div>
      <div id="tcot-wrap" style="margin-top:4px;">${renderTcot(t.id)}</div>
      ${(t.comments||[]).length?`<div class="sec">Comentários</div>`+(t.comments||[]).map(c=>`<div class="card" style="margin-bottom:6px;"><div style="font-size:.7rem;color:var(--muted);margin-bottom:3px;">${M[c.author]?.name||c.author} · ${fmtDate(c.date)} ${c.time}</div><div style="font-size:.82rem;">${esc(c.text)}</div></div>`).join(''):''}
      <div style="margin-top:10px;display:flex;gap:8px;">
        <textarea class="f-in" id="new-comment" rows="2" placeholder="Adicionar comentário..." style="flex:1;"></textarea>
        <button class="btn-ghost btn-sm" onclick="addComment('${t.id}')" style="align-self:flex-end;">Comentar</button>
      </div>
    </div>
    <div class="modal-ft">
      ${!isNew?`<button class="btn-danger" onclick="deleteTask('${t.id}')">Remover</button>`:''}
      <button class="btn-ghost" onclick="closeTaskModal()">Cancelar</button>
      <button class="btn-gold" onclick="saveTask('${t.id}')">Salvar</button>
    </div>`;
  document.getElementById('task-modal').classList.add('show');
  setupFileDrop(t.id);
}

// ── Cotação dentro da tarefa ──────────────────────────────
let _tcotOpen=false;
function renderTcot(tid){
  const t=window.tmpTask;if(!t)return'';
  const items=t.cotacaoItems||[];
  const hasChosen=items.some(i=>i.escolhido);
  const btn=`<button onclick="tcotToggle()" style="width:100%;text-align:left;background:${_tcotOpen?'var(--panel2)':'transparent'};border:1px solid ${_tcotOpen?'var(--line2)':'var(--line)'};border-radius:10px;padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--text);transition:.15s;">
    <span style="font-weight:600;">Cotação</span>
    ${items.length?`<span style="font-size:.68rem;padding:2px 7px;border-radius:999px;background:${hasChosen?'rgba(34,197,94,.12)':'rgba(197,165,114,.12)'};color:${hasChosen?'var(--green)':'var(--gold)'};">${items.length} ${items.length===1?'item':'itens'}${hasChosen?' · escolhido':''}</span>`:'<span style="font-size:.68rem;color:var(--muted);">Clique para adicionar</span>'}
    <span style="margin-left:auto;font-size:.7rem;color:var(--muted);">${_tcotOpen?'▲':'▼'}</span>
  </button>`;
  if(!_tcotOpen)return btn;
  const cards=items.map((item,i)=>`
    <div style="background:var(--panel);border:1px solid ${item.escolhido?'var(--green)':'var(--line)'};border-radius:10px;padding:10px 12px;margin-bottom:8px;${item.escolhido?'box-shadow:0 0 0 2px rgba(34,197,94,.15);':''}">
      <div style="display:grid;grid-template-columns:1fr 1fr 90px auto auto;gap:6px;align-items:center;margin-bottom:8px;">
        <input class="f-in" value="${esc(item.produto||'')}" oninput="window.tmpTask.cotacaoItems[${i}].produto=this.value" placeholder="Produto / Item" style="font-size:.8rem;padding:5px 8px;">
        <input class="f-in" value="${esc(item.fornecedor||'')}" oninput="window.tmpTask.cotacaoItems[${i}].fornecedor=this.value" placeholder="Fornecedor" style="font-size:.8rem;padding:5px 8px;">
        <input class="f-in" value="${esc(item.preco||'')}" oninput="window.tmpTask.cotacaoItems[${i}].preco=this.value" placeholder="R$ 0,00" style="font-size:.8rem;padding:5px 8px;text-align:right;">
        <button onclick="tcotSetChosen(${i})" style="background:${item.escolhido?'rgba(34,197,94,.15)':'transparent'};border:1px solid ${item.escolhido?'var(--green)':'var(--line)'};border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.75rem;color:${item.escolhido?'var(--green)':'var(--muted)'};white-space:nowrap;">
          ${item.escolhido?'Escolhido':'Escolher'}
        </button>
        <button onclick="tcotRemove(${i})" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:2px 6px;line-height:1;"></button>
      </div>
      <textarea
        oninput="window.tmpTask.cotacaoItems[${i}].obs=this.value;this.style.height='auto';this.style.height=this.scrollHeight+'px';"
        placeholder="Observações: acidez, qualidade, link do produto, condições de entrega..."
        style="width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.8rem;color:var(--text);resize:none;overflow:hidden;min-height:38px;font-family:inherit;line-height:1.5;box-sizing:border-box;"
      >${esc(item.obs||'')}</textarea>
    </div>`).join('');
  return`${btn}
    <div style="background:var(--panel2);border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;padding:12px;">
      ${items.length?`<div style="font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;display:grid;grid-template-columns:1fr 1fr 90px auto auto;gap:6px;padding:0 2px;">
        <span>Produto</span><span>Fornecedor</span><span style="text-align:right;">Preço</span><span></span><span></span>
      </div>`:''}
      ${cards||`<div style="text-align:center;padding:14px;font-size:.78rem;color:var(--muted);">Nenhum item ainda. Clique em "+ Adicionar" abaixo.</div>`}
      <button onclick="tcotAddRow()" class="btn-ghost btn-sm" style="margin-top:4px;font-size:.75rem;width:100%;">+ Adicionar item</button>
    </div>`;
}
function _tcotAutoGrow(){document.querySelectorAll('#tcot-wrap textarea').forEach(ta=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';});}
function tcotToggle(){_tcotOpen=!_tcotOpen;const w=document.getElementById('tcot-wrap');if(w){w.innerHTML=renderTcot(window.tmpTask?.id);setTimeout(_tcotAutoGrow,10);}}
function tcotAddRow(){if(!window.tmpTask)return;if(!window.tmpTask.cotacaoItems)window.tmpTask.cotacaoItems=[];window.tmpTask.cotacaoItems.push({id:uid(),produto:'',fornecedor:'',preco:'',obs:'',escolhido:false});document.getElementById('tcot-wrap').innerHTML=renderTcot(window.tmpTask.id);setTimeout(()=>{_tcotAutoGrow();document.querySelectorAll('#tcot-wrap input')[window.tmpTask.cotacaoItems.length*5-5]?.focus();},10);}
function tcotRemove(i){if(!window.tmpTask?.cotacaoItems)return;window.tmpTask.cotacaoItems.splice(i,1);document.getElementById('tcot-wrap').innerHTML=renderTcot(window.tmpTask.id);setTimeout(_tcotAutoGrow,10);}
function tcotSetChosen(i){if(!window.tmpTask?.cotacaoItems)return;window.tmpTask.cotacaoItems.forEach((x,j)=>x.escolhido=j===i);document.getElementById('tcot-wrap').innerHTML=renderTcot(window.tmpTask.id);setTimeout(_tcotAutoGrow,10);}
// ─────────────────────────────────────────────────────────
function toggleTaskAssignee(tid,k){
  const t=window.tmpTask;if(!t)return;
  const i=(t.assignees||[]).indexOf(k);
  if(i>=0)t.assignees.splice(i,1);else{if(!t.assignees)t.assignees=[];t.assignees.push(k);}
  // re-render just assignees
  const assigneeChips=Object.entries(M).map(([key,m2])=>{
    const sel=(t.assignees||[]).includes(key);
    return`<span class="collab-chip" style="background:${m2.color}${sel?'33':'11'};color:${m2.color};border:1px solid ${m2.color}${sel?'55':'22'};cursor:pointer;" onclick="toggleTaskAssignee('${tid}','${key}')">${m2.icon} ${m2.name.split(' ')[0]}${sel?' ':''}</span>`;
  }).join('');
  document.getElementById('tm-assignees').innerHTML=assigneeChips;
}

function saveTask(id){
  const title=document.getElementById('tm-title').value.trim();if(!title){toast('Informe o título.');return;}
  const t=window.tmpTask||{};
  const newStatus=document.getElementById('tm-status').value;
  const updated={...t,id,title,desc:document.getElementById('tm-desc').value.trim(),
    status:newStatus,priority:document.getElementById('tm-prio').value,
    deadline:document.getElementById('tm-dl').value,
    assignees:t.assignees||[me],attachments:t.attachments||[],
    cotacaoItems:t.cotacaoItems||[]};
  if(newStatus==='doing'&&t.ajusteNote)updated.ajusteNote=''; // clear when back to doing
  const prevSt=t.status;
  const idx=S.tasks.findIndex(x=>x.id===id);
  if(idx>=0)S.tasks[idx]=updated;else S.tasks.push(updated);
  saveLocal();toast('Tarefa salva!');closeTaskModal();renderTasks();buildSidebar();renderHome();
  // Notifica Marlon quando salva com status "Em Aprovação"
  if(newStatus==='review'&&prevSt!=='review'){
    waNotify('aprovacao',{title:updated.title,from:M[me]?.name||me});
  }
}
function darDevolutiva(id,resultado){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const obs=document.getElementById('dev-obs')?.value.trim()||'';
  t.status=resultado;
  if(resultado==='ajuste'){
    t.ajusteNote=obs||'Revise e reenvie.';
    // add auto comment
    if(!t.comments)t.comments=[];
    t.comments.push({id:uid(),author:me,text:`↺ Pedido de ajuste: ${t.ajusteNote}`,date:todayKey(),time:fmtTime()});
    toast('Ajuste solicitado. Responsável será notificado.');
  } else {
    t.ajusteNote='';
    if(!t.comments)t.comments=[];
    t.comments.push({id:uid(),author:me,text:'Tarefa aprovada.',date:todayKey(),time:fmtTime()});
    toast('Tarefa aprovada!');
  }
  saveLocal();closeTaskModal();renderTasks();renderHome();
}

function deleteTask(id){S.tasks=S.tasks.filter(t=>t.id!==id);saveLocal();toast('Tarefa removida.');closeTaskModal();renderTasks();}


function addComment(taskId){
  const txt=document.getElementById('new-comment').value.trim();if(!txt)return;
  const t=S.tasks.find(x=>x.id===taskId);if(!t)return;
  if(!t.comments)t.comments=[];
  t.comments.push({id:uid(),author:me,text:txt,date:todayKey(),time:fmtTime()});
  if(window.tmpTask)window.tmpTask.comments=t.comments;
  saveLocal();document.getElementById('new-comment').value='';openTask(taskId);
}

function addUrlAtt(taskId){
  const url=document.getElementById('att-url').value.trim();if(!url){toast('Cole um link.');return;}
  const name=url.replace(/^https?:\/\//,'').slice(0,40);
  addAttachment(taskId,{id:uid(),type:'url',name,url});
  document.getElementById('att-url').value='';
}

function handleFileAtt(taskId,inp){
  Array.from(inp.files).forEach(file=>{
    if(file.size>2*1024*1024){toast('Arquivo muito grande (máx 2MB). Use um link.');return;}
    const reader=new FileReader();
    reader.onload=e=>{
      const type=file.type.startsWith('image/')?'img':'file';
      addAttachment(taskId,{id:uid(),type,name:file.name,data:e.target.result,mime:file.type});
    };
    reader.readAsDataURL(file);
  });
}

function addAttachment(taskId,att){
  const t=window.tmpTask;if(!t)return;
  if(!t.attachments)t.attachments=[];t.attachments.push(att);
  // Update att list in modal
  const listEl=document.getElementById('att-list');if(!listEl)return;
  listEl.innerHTML=t.attachments.map(a=>`<div class="att-item">
    <span class="att-icon" style="font-size:.6rem;font-weight:800;letter-spacing:.03em;">${a.type==='url'?'URL':a.type==='img'?'IMG':'DOC'}</span>
    <span class="att-name">${a.type==='url'?`<a href="${esc(a.url)}" target="_blank" style="color:var(--blue);">${esc(a.name)}</a>`:esc(a.name)}</span>
    <button class="att-del" onclick="removeAtt('${taskId}','${a.id}')"></button>
  </div>`).join('');
  toast('Anexo adicionado!');
}

function removeAtt(taskId,attId){
  const t=window.tmpTask;if(!t)return;
  t.attachments=(t.attachments||[]).filter(a=>a.id!==attId);
  const listEl=document.getElementById('att-list');if(listEl)listEl.innerHTML=t.attachments.map(a=>`<div class="att-item">
    <span class="att-icon" style="font-size:.6rem;font-weight:800;letter-spacing:.03em;">${a.type==='url'?'URL':a.type==='img'?'IMG':'DOC'}</span>
    <span class="att-name">${a.type==='url'?`<a href="${esc(a.url)}" target="_blank" style="color:var(--blue);">${esc(a.name)}</a>`:esc(a.name)}</span>
    <button class="att-del" onclick="removeAtt('${taskId}','${a.id}')"></button>
  </div>`).join('');
}

function setupFileDrop(taskId){
  const drop=document.getElementById('file-drop-'+taskId);if(!drop)return;
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');
    const inp={files:e.dataTransfer.files};handleFileAtt(taskId,inp);});
}

function renderFlow(){
  if(!S.flow)S.flow={};
  const steps=S.flow[me]||[];
  const myFlows=ROLE_FLOWS[me]||[];
  const flowIdx=window._myFlowIdx||0;
  let html='';

  // ── Institutional flowchart images ──
  if(myFlows.length){
    const safeIdx=Math.min(flowIdx,myFlows.length-1);
    html+=`<div class="page-head"><h2>Fluxograma do Processo</h2></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
      ${myFlows.map((f,i)=>`<button class="ev-type-btn${i===safeIdx?' sel':''}" onclick="window._myFlowIdx=${i};renderFlow()">${f.label}</button>`).join('')}
    </div>
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:28px;">
      <img src="${myFlows[safeIdx].img}" style="width:100%;display:block;" alt="${esc(myFlows[safeIdx].label)}"
        onerror="this.parentElement.innerHTML='<div style=\\'padding:30px;text-align:center;color:var(--muted);font-size:.82rem;\\'>Imagem não encontrada — certifique-se que a pasta <strong>flows/</strong> está na mesma pasta que o HTML.</div>'"/>
    </div>
    <div class="sec">Rotina Pessoal</div>`;
  }

  // ── Editable personal flow ──
  html+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
    <div style="font-size:.82rem;color:var(--muted);">${myFlows.length?'Sua rotina personalizada de trabalho.':'Edite o fluxo do seu processo. Clique nos itens para editar.'}</div>
    <button class="btn-gold btn-sm" onclick="addFlowStep()">+ Adicionar Etapa</button>
  </div>`;
  if(!steps.length){html+=`<div class="empty"><div class="ei">–</div><p>Nenhuma etapa ainda.<br>Clique em "+ Adicionar Etapa" para começar.</p></div>`;}
  else{
    steps.forEach((s,i)=>{
      html+=`<div class="flow-step" id="fs-${i}">
        <div class="flow-num">${i+1}</div>
        <div class="flow-content">
          <div contenteditable="true" class="flow-title" onblur="saveFlowField(${i},'title',this.textContent)" style="outline:none;cursor:text;">${esc(s.title||'Etapa sem título')}</div>
          <div contenteditable="true" class="flow-desc" onblur="saveFlowField(${i},'desc',this.textContent)" style="outline:none;cursor:text;min-height:20px;">${esc(s.desc||'')}</div>
          <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">
            <select class="f-in" style="width:auto;font-size:.72rem;padding:3px 8px;" onchange="saveFlowField(${i},'responsible',this.value)">
              <option value="">Responsável</option>
              ${Object.entries(M).map(([k,m2])=>`<option value="${k}" ${s.responsible===k?'selected':''}>${m2.icon} ${m2.name.split(' ')[0]}</option>`).join('')}
            </select>
            <input class="f-in" style="width:160px;font-size:.72rem;padding:3px 8px;" placeholder="Ferramentas/Sistema" value="${esc(s.tools||'')}" onblur="saveFlowField(${i},'tools',this.value)"/>
          </div>
        </div>
        <div class="flow-actions">
          ${i>0?`<button class="icon-btn" onclick="moveStep(${i},-1)">↑</button>`:''}
          ${i<steps.length-1?`<button class="icon-btn" onclick="moveStep(${i},1)">↓</button>`:''}
          <button class="icon-btn" onclick="delFlowStep(${i})" style="color:var(--red);"></button>
        </div>
      </div>`;
    });
  }
  document.getElementById('p-flow').innerHTML=html;
}

function addFlowStep(){
  if(!S.flow)S.flow={};if(!S.flow[me])S.flow[me]=[];
  S.flow[me].push({id:uid(),title:'Nova Etapa',desc:'',responsible:me,tools:''});
  saveLocal();renderFlow();
}
function saveFlowField(i,field,val){
  if(!S.flow||!S.flow[me])return;S.flow[me][i][field]=val.trim();saveLocal();
}
function moveStep(i,dir){
  const steps=S.flow[me];const j=i+dir;if(j<0||j>=steps.length)return;
  [steps[i],steps[j]]=[steps[j],steps[i]];saveLocal();renderFlow();
}
function delFlowStep(i){S.flow[me].splice(i,1);saveLocal();renderFlow();}

function downloadOccHist(mes){

function saveOcc(){

function updateOccStatus(id,status){

// RELATÓRIO SEMANAL

const MARKETING_MEMBERS=['carol','raquel'];
const CAIXA_MEMBERS=['nelci'];
const CONTAS_PAGAR_MEMBERS=['marco'];
const COMPRAS_MEMBERS=['carlos'];
function isMarketing(){return MARKETING_MEMBERS.includes(me);}
function isCaixa(){return CAIXA_MEMBERS.includes(me);}
function isContasPagar(){return CONTAS_PAGAR_MEMBERS.includes(me);}
function isCompras(){return COMPRAS_MEMBERS.includes(me);}
function isFinanceiro(){return isCaixa()||isContasPagar();}

function weekToMonth(wk){
  // Convert "2026-W12" to "2026-03" (month of Monday of that week)
  if(!wk)return'';
  const [yr,wPart]=wk.split('-W');
  const y=parseInt(yr),w=parseInt(wPart);
  const jan4=new Date(y,0,4);
  const monday=new Date(jan4);
  monday.setDate(jan4.getDate()-(jan4.getDay()||7)+1+(w-1)*7);
  return monday.getFullYear()+'-'+String(monday.getMonth()+1).padStart(2,'0');
}
function arquivarMesReport(){
  if(!S.reports)return;
  const prevMes=prevMonthKey();
  let count=0;
  Object.entries(S.reports).forEach(([k,r])=>{
    if(!r._arq){
      const wk=r.week||(k.includes('-W')?k.split(me+'-')[1]:null);
      const mes=weekToMonth(wk);
      if(mes===prevMes){r._arq=true;r._arqMes=prevMes;count++;}
    }
  });
  saveLocal();
  toast(count?`${count} relatório(s) arquivados — ${monthLabel(prevMes)}`:'Nenhum relatório do mês anterior para arquivar');
  renderReport();
}
function downloadReportHist(mes){
  if(!S.reports)return;
  const reps=Object.entries(S.reports).filter(([,r])=>r._arq&&r._arqMes===mes&&(r.member===me||!r.member));
  const rows=reps.map(([k,r])=>({
    'Semana':r.week||k,'Membro':r.member||me,'Salvo em':r.savedAt||'',
    'Resumo':r.conteudo_gravado||r.done||'',
    'Pendentes':r.pending||r.pendentes||'','Próxima semana':r.proxima_semana||r.next||'',
    'Mês Arquivado':r._arqMes||''
  }));
  downloadCSV(rows,'relatorios_'+mes+'.csv');
}
function renderReport(){
  if(!S.reports)S.reports={};
  const tab=window._reportTab||'atual';
  const wk=weekId();const key=me+'-'+wk;
  const saved=S.reports[key]||{};
  const dateRange=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
  const formHtml=isMarketing()?repFormMarketing(saved):isCaixa()?repFormFinanceiro(saved):isContasPagar()?repFormMarco(saved):isCompras()?repFormCarlos(saved):repFormGenerico(saved);

  const isLdr=M[me]?.isLeader||false;
  let html=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap;">
    <div class="ev-type-row" style="flex:1;min-width:200px;">
      <button class="ev-type-btn${tab==='atual'?' sel':''}" onclick="window._reportTab='atual';renderReport()">Atual</button>
      <button class="ev-type-btn${tab==='historico'?' sel':''}" onclick="window._reportTab='historico';renderReport()">Histórico</button>
      ${isLdr?`<button class="ev-type-btn${tab==='equipe'?' sel':''}" onclick="window._reportTab='equipe';renderReport()">Equipe</button>`:''}
    </div>
    ${isLdr?`<button class="btn-ghost btn-sm" onclick="arquivarMesReport()" title="Arquiva relatórios do mês anterior">Fechar Mês</button>`:''}
  </div>`;

  if(tab==='atual'){
    html+=`<div class="rep-form">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
        <div>
          <div style="font-size:1.05rem;font-weight:800;">${isMarketing()?'Relatório Semanal — Marketing MRZ':isCaixa()?'Relatório Semanal — Controle Financeiro':isContasPagar()?'Relatório Semanal — Contas a Pagar':isCompras()?'Relatório Semanal — Compras':'Relatório Semanal'}</div>
          <div style="font-size:.75rem;color:var(--muted);margin-top:2px;">${wk} · ${dateRange} · Responsável: ${M[me]?.name||me}</div>
        </div>
        <button class="btn-gold btn-sm" onclick="saveReport()">Salvar relatório</button>
      </div>
      ${formHtml}
    </div>`;
    // Relatórios anteriores não arquivados
    const prevReps=Object.entries(S.reports).filter(([k,r])=>k.startsWith(me+'-')&&k!==key&&!r._arq).sort((a,b)=>b[0].localeCompare(a[0]));
    if(prevReps.length){
      html+=`<div class="sec" style="margin-top:24px">Relatórios anteriores</div>`;
      prevReps.forEach(([k,r])=>{
        const lbl=k.replace(me+'-','');
        const preview=r.conteudo_gravado||r.done||'';
        html+=`<div class="rep-card" onclick="viewReport('${k}')">
          <div class="rc-hd"><span class="rc-week">${lbl}</span><span class="rc-date">${r.savedAt||''}</span></div>
          <div style="font-size:.75rem;color:var(--muted);margin-top:3px;">${preview.slice(0,90)}${preview.length>90?'...':''}</div>
        </div>`;
      });
    }
  } else if(tab==='historico'){
    // ABA HISTÓRICO — accordion por mês
    const arqArr=Object.entries(S.reports)
      .filter(([k,r])=>r._arq&&k.startsWith(me+'-'))
      .map(([k,r])=>({...r,_repKey:k,date:weekToMonth(r.week||'')+(r.week||'').replace(/.*W/,'-W')||r._arqMes+'-01'}));
    const repCard=item=>{
      const preview=item.conteudo_gravado||item.done||'';
      return`<div class="rep-card" onclick="viewReport('${item._repKey}')" style="opacity:.9;cursor:pointer;">
        <div class="rc-hd"><span class="rc-week">${item.week||item._repKey?.split('-').slice(-1)[0]||''}</span><span class="rc-date">${item.savedAt||''}</span></div>
        <div style="font-size:.75rem;color:var(--muted);margin-top:3px;">${preview.slice(0,90)}${preview.length>90?'...':''}</div>
      </div>`;
    };
    html+=histAcordiao('report',arqArr,repCard,'downloadReportHist','renderReport');
  } else if(tab==='equipe'){
    // Aba equipe: último relatório de cada membro na semana atual
    const wkCur=weekId();
    const membros=Object.entries(M).filter(([k])=>k!=='raquel');
    html+=`<div style="font-size:.75rem;color:var(--muted);margin-bottom:16px;">Semana atual: <strong>${wkCur}</strong></div>`;
    html+=`<div style="display:grid;gap:10px;">`;
    membros.forEach(([k,m])=>{
      const repKey=k+'-'+wkCur;
      const rep=S.reports[repKey]||null;
      // Pega qualquer relatório recente deste membro
      const allReps=Object.entries(S.reports).filter(([rk])=>rk.startsWith(k+'-')&&!S.reports[rk]?._arq).sort((a,b)=>b[0].localeCompare(a[0]));
      const latest=allReps[0];
      const hasThis=!!rep&&Object.keys(rep).filter(x=>!x.startsWith('_')).length>1;
      const preview=rep?(rep.conteudo_gravado||rep.done||rep.grav_ter||rep.total_pago||rep.ok_pagamentos||''):null;
      html+=`<div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;cursor:pointer;" onclick="${hasThis?`viewReport('${repKey}')`:latest?`viewReport('${latest[0]}')`:''}">
        <div style="width:38px;height:38px;border-radius:10px;background:${m.color}22;display:grid;place-items:center;font-size:.72rem;font-weight:800;color:${m.color};flex-shrink:0;">${m.icon}</div>
        <div style="flex:1;min-width:120px;">
          <div style="font-weight:700;font-size:.88rem;">${esc(m.name)}</div>
          <div style="font-size:.72rem;color:var(--muted);">${esc(m.role)}</div>
          ${hasThis?`<div style="font-size:.7rem;color:var(--green);margin-top:3px;">Entregou esta semana</div>`
            :latest?`<div style="font-size:.7rem;color:var(--gold);margin-top:3px;">Último: ${latest[0].replace(k+'-','')}</div>`
            :`<div style="font-size:.7rem;color:var(--muted2);margin-top:3px;">— Sem relatório</div>`}
          ${preview?`<div style="font-size:.72rem;color:var(--muted);margin-top:2px;">${esc(preview.toString().slice(0,80))}${preview.toString().length>80?'...':''}</div>`:''}
        </div>
      </div>`;
    });
    html+=`</div>`;
  }
  document.getElementById('p-report').innerHTML=html;
}

function saveReport(){
  if(!S.reports)S.reports={};
  const wk=weekId();const key=me+'-'+wk;
  const base={savedAt:new Date().toLocaleDateString('pt-BR'),week:wk,member:me};
  const g=id=>{const el=document.getElementById(id);return el?el.value:'';};
  if(isCompras()){
    S.reports[key]={...base,
      total_pedidos:g('r-tot-ped'),total_gasto:g('r-tot-gasto'),economia:g('r-economia'),situacao:g('r-sit-c'),
      cotacoes:g('r-cotacoes'),
      recebimentos:g('r-recebimentos'),ressalvas:g('r-ressalvas'),
      fornecedores_novos:g('r-forn-novos'),
      cmv_variacao:g('r-cmv'),ruptura:g('r-ruptura'),
      proxima_semana:g('r-prox'),negociacao_futura:g('r-negoc-fut'),
      conteudo_gravado:'Gasto: '+(g('r-tot-gasto')||'—')+' · Economia: '+(g('r-economia')||'—')
    };
  } else if(isContasPagar()){
    S.reports[key]={...base,
      total_pago:g('r-total-pago'),qtd_pag:g('r-qtd-pag'),pendentes:g('r-pendentes'),
      dda_total:g('r-dda-total'),dda_suspeitos:g('r-dda-suspeitos'),situacao:g('r-situacao-m'),
      pag_pendentes_desc:g('r-pag-pend'),
      ck_notas:document.getElementById('ck-notas')?.checked,
      ck_dados:document.getElementById('ck-dados')?.checked,
      ck_dda:document.getElementById('ck-dda')?.checked,
      ck_sistema:document.getElementById('ck-sistema')?.checked,
      ck_comp:document.getElementById('ck-comp')?.checked,
      problemas:g('r-problemas'),melhorias:g('r-melhorias'),
      conteudo_gravado:'Total pago: '+(g('r-total-pago')||'—')
    };
  } else if(isCaixa()){
    S.reports[key]={...base,
      n_diverg:g('r-n-diverg'),valor_total:g('r-valor-total'),lojas_prob:g('r-lojas-prob'),situacao:g('r-situacao'),
      diverg_desc:g('r-diverg-desc'),
      acoes:g('r-acoes'),ajustes_lojas:g('r-ajustes'),orientacoes:g('r-orient'),
      treino:g('r-treino'),ajuste_proc:g('r-ajuste-proc'),alinhamento:g('r-alinhamento'),
      ck_caixas:document.getElementById('ck-caixas')?.checked,
      ck_ifood:document.getElementById('ck-ifood')?.checked,
      ck_pagseg:document.getElementById('ck-pagseg')?.checked,
      ck_bancos:document.getElementById('ck-bancos')?.checked,
      ck_pendencias:document.getElementById('ck-pendencias')?.checked,
      conteudo_gravado:'Divergências: '+(g('r-n-diverg')||'0')
    };
  } else if(isMarketing()){
    S.reports[key]={...base,
      grav_ter:g('r-grav-ter'),grav_qui:g('r-grav-qui'),
      post_feed:g('r-post-feed'),post_reels:g('r-post-reels'),stories:g('r-stories'),
      ads1:g('r-ads1'),ads2:g('r-ads2'),
      melhor:g('r-melhor'),pior:g('r-pior'),ads_res:g('r-ads-res'),
      feedback:g('r-feedback'),padroes:g('r-padroes'),
      aprendizado:g('r-aprendizado'),ideias:g('r-ideias'),plano:g('r-plano'),
      fat_mes:g('r-fat-mes'),fat_ant:g('r-fat-ant'),variacao:g('r-variacao'),
      conteudo_gravado:g('r-grav-ter')+' / '+g('r-grav-qui')
    };
  } else {
    S.reports[key]={...base,
      done:g('rep-done'),pending:g('rep-pending'),diff:g('rep-diff'),next:g('rep-next'),help:g('rep-help')
    };
  }
  saveLocal();toast('Relatório salvo — '+wk);renderReport();
}

  const r=S.reports[key];if(!r)return;
  const m=M[r.member||me];
  const fields=isCompras()?[
    ['Total de pedidos realizados',r.total_pedidos],['Total gasto',r.total_gasto],
    ['Economia negociada',r.economia],['Situação',r.situacao],
    ['Cotações — preços recebidos vs negociados vs pago',r.cotacoes],
    ['Recebimentos de quinta',r.recebimentos],['Ressalvas registradas',r.ressalvas],
    ['Desenvolvimento de fornecedores',r.fornecedores_novos],
    ['Variação de CMV / preços vs semana anterior',r.cmv_variacao],

    ['Pedidos da próxima semana',r.proxima_semana],['Negociação futura / pauta bimestral',r.negociacao_futura]
  ]:isContasPagar()?[
    ['Total pago na semana',r.total_pago],['Qtd. pagamentos',r.qtd_pag],['Pendentes',r.pendentes],
    ['DDA identificados',r.dda_total],['DDA suspeitos descartados',r.dda_suspeitos],

  ]:isMarketing()?[
    ['Conteúdo gravado — Terça',r.grav_ter],
    ['Conteúdo gravado — Quinta',r.grav_qui],
    ['Feed postado',r.post_feed],['Reels postados',r.post_reels],['Stories',r.stories],
    ['Campanha 1',r.ads1],['Campanha 2',r.ads2],
    ['Melhor conteúdo',r.melhor],['Não funcionou',r.pior],['Resultado de anúncios',r.ads_res],
    ['Feedbacks',r.feedback],['Padrões percebidos',r.padroes],

    ['Faturamento mês passado',r.fat_mes],['Faturamento mês retrasado',r.fat_ant],['Variação',r.variacao]
  ]:[
    ['Realizado',r.done],['Pendente',r.pending],['Dificuldades',r.diff],['Próximos passos',r.next],['Suporte necessário',r.help]

      ${fields.filter(([,v])=>v).map(([l,v])=>`
        <div style="margin-bottom:12px;">
          <div style="font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px;">${l}</div>
          <div style="font-size:.84rem;line-height:1.6;white-space:pre-wrap;">${esc(v)}</div>
        </div>`).join('')}
    </div>`;
  document.getElementById('rep-modal').classList.add('show');
}

// COTAÇÃO (Compras)
// ══════════════════════════════════════

// ── estado da cotação ativa
let cotFornA='',cotFornB='',cotFornC='';

function newRow(){return{id:uid(),item:'',qty:'',unit:'',pA:'',pB:'',pC:''};}

function cotTotal(r,f){const q=parseFloat(r.qty)||0;const p=parseFloat(r['p'+f])||0;return q*p;}

function renderCotacao(){
  if(!S.cotacoes)S.cotacoes=[];
  if(!cotRows.length)cotRows=[newRow(),newRow(),newRow()];

  // totais por fornecedor
  const totA=cotRows.reduce((s,r)=>s+cotTotal(r,'A'),0);
  const totB=cotRows.reduce((s,r)=>s+cotTotal(r,'B'),0);
  const totC=cotRows.reduce((s,r)=>s+cotTotal(r,'C'),0);

  const hdrStyle='background:var(--panel2);padding:9px 10px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;';
  const fornHdr=(id,val)=>`<th style="${hdrStyle}"><input value="${esc(val)}" placeholder="Nome Fornecedor ${id}" id="forn${id}" oninput="cotForn${id}=this.value;updCotHdr('${id}')" style="background:transparent;border:none;color:var(--text);font:inherit;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;width:100px;outline:none;" /></th><th style="${hdrStyle}min-width:90px;">Total ${id}</th>`;

  const tableRows=cotRows.map((r,i)=>{
    const [tA,tB,tC]=['A','B','C'].map(f=>cotTotal(r,f));
    const best=Math.min(...[tA,tB,tC].filter(v=>v>0));
    const hi=(f,t)=>t>0&&t===best?'color:var(--green);font-weight:700':'';
    return`<tr>
      <td style="min-width:160px"><input value="${esc(r.item)}" placeholder="Produto / Item" oninput="cotRows[${i}].item=this.value" style="width:100%;background:transparent;border:none;color:var(--text);padding:3px 4px;outline:none;font-size:.8rem"/></td>
      <td><input type="number" value="${r.qty}" placeholder="0" oninput="cotRows[${i}].qty=this.value;updCotTotals()" style="width:60px;background:transparent;border:none;color:var(--text);padding:3px 4px;outline:none;font-size:.8rem;text-align:right"/></td>
      <td><input value="${esc(r.unit)}" placeholder="kg" oninput="cotRows[${i}].unit=this.value" style="width:45px;background:transparent;border:none;color:var(--text);padding:3px 4px;outline:none;font-size:.8rem"/></td>
      <td><input type="number" value="${r.pA}" placeholder="—" step="0.01" oninput="cotRows[${i}].pA=this.value;updCotTotals()" style="width:80px;background:transparent;border:none;color:var(--text);padding:3px 4px;outline:none;font-size:.8rem;text-align:right"/></td>
      <td class="num-cell" id="ctA-${i}" style="${hi('A',tA)}">${tA?fmtBRL(tA):'—'}</td>
      <td><input type="number" value="${r.pB}" placeholder="—" step="0.01" oninput="cotRows[${i}].pB=this.value;updCotTotals()" style="width:80px;background:transparent;border:none;color:var(--text);padding:3px 4px;outline:none;font-size:.8rem;text-align:right"/></td>
      <td class="num-cell" id="ctB-${i}" style="${hi('B',tB)}">${tB?fmtBRL(tB):'—'}</td>
      <td><input type="number" value="${r.pC}" placeholder="—" step="0.01" oninput="cotRows[${i}].pC=this.value;updCotTotals()" style="width:80px;background:transparent;border:none;color:var(--text);padding:3px 4px;outline:none;font-size:.8rem;text-align:right"/></td>
      <td class="num-cell" id="ctC-${i}" style="${hi('C',tC)}">${tC?fmtBRL(tC):'—'}</td>
      <td><button onclick="removeCotRow(${i})" style="background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;padding:4px 6px"></button></td>
    </tr>`;
  }).join('');

  const fornOpts=['A','B','C'].map(f=>{const n=({A:cotFornA,B:cotFornB,C:cotFornC}[f])||'Fornecedor '+f;return`<option value="${f}">${esc(n)}</option>`;}).join('');

  const cotTab=window._cotTab||'ativo';

  // ── ABA HISTÓRICO (Cotação) ──
  if(cotTab==='hist'){
    const cotCard=c=>`<div class="cot-saved" style="margin-bottom:6px;">
      <div style="flex:1">
        <div style="font-size:.88rem;font-weight:700">${esc(c.name||'Sem título')}</div>
        <div style="font-size:.72rem;color:var(--muted);margin-top:3px">${fmtDate(c.date)} · ${c.rows?.length||0} itens${c.escolhido?` · Escolhido: <strong>${esc(c.fornNames?.[c.escolhido]||'Forn. '+c.escolhido)}</strong>`:''}</div>
        ${c.motivo?`<div style="font-size:.72rem;color:var(--muted);margin-top:2px;font-style:italic">${esc(c.motivo.slice(0,100))}${c.motivo.length>100?'...':''}</div>`:''}
      </div>
    </div>`;
    document.getElementById('p-cotacao').innerHTML=`
      <div class="page-head"><h2>Cotação</h2></div>
      <div style="display:flex;gap:6px;margin-bottom:18px;">
        <button class="ev-type-btn" onclick="window._cotTab='ativo';renderCotacao()">Ativas</button>
        <button class="ev-type-btn sel">Histórico</button>
      </div>
      ${histAcordiao('cot',S.cotacoes||[],cotCard,'downloadCotacaoHist','renderCotacao')}`;
    return;
  }

  document.getElementById('p-cotacao').innerHTML=`
    <div class="page-head"><h2>Cotação</h2>
      <button class="btn-ghost btn-sm" onclick="arquivarMesCotacao()" title="Arquiva cotações do mês anterior">Fechar Mês</button>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:18px;">
      <button class="ev-type-btn sel">Ativas</button>
      <button class="ev-type-btn" onclick="window._cotTab='hist';renderCotacao()">Histórico</button>
    </div>
    <div class="card-panel" style="margin-bottom:20px">
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">
        <div style="flex:2;min-width:150px"><label class="f-lb">Nome da cotação</label><input class="f-in" id="cot-name" placeholder="Ex: Carnes — Semana 18"></div>
        <div><label class="f-lb">Data</label><input class="f-in" type="date" id="cot-date" value="${todayKey()}"></div>
      </div>
      <div style="overflow-x:auto;margin-bottom:14px">
        <table class="cot-table">
          <thead><tr>
            <th style="${hdrStyle}min-width:160px">Produto / Item</th>
            <th style="${hdrStyle}width:70px">Qtd</th>
            <th style="${hdrStyle}width:50px">Un.</th>
            ${fornHdr('A',cotFornA)}
            ${fornHdr('B',cotFornB)}
            ${fornHdr('C',cotFornC)}
            <th style="width:32px"></th>
          </tr></thead>
          <tbody>${tableRows}</tbody>
          <tfoot><tr style="background:var(--panel2)">
            <td colspan="3" style="padding:10px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Total geral</td>
            <td></td><td class="num-cell" id="totA" style="font-weight:800">${totA?fmtBRL(totA):'—'}</td>
            <td></td><td class="num-cell" id="totB" style="font-weight:800">${totB?fmtBRL(totB):'—'}</td>
            <td></td><td class="num-cell" id="totC" style="font-weight:800">${totC?fmtBRL(totC):'—'}</td>
            <td></td>
          </tr></tfoot>
        </table>
      </div>
      <button class="btn-sm" onclick="addCotRow()" style="margin-bottom:16px">+ Adicionar item</button>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:16px;margin-top:4px">
        <div><label class="f-lb">Fornecedor escolhido</label>
          <select class="f-in" id="cot-escolhido">
            <option value="">Selecione...</option>
            ${fornOpts}
            <option value="outro">Outro / combinação</option>
          </select>
        </div>
        <div><label class="f-lb">Observações gerais</label>
          <input class="f-in" id="cot-obs" placeholder="Ex: entrega na quinta, prazo 30d...">
        </div>
      </div>
      <div style="margin-top:10px"><label class="f-lb">Motivo da escolha</label>
        <textarea class="f-in" id="cot-motivo" rows="2" placeholder="Ex: Fornecedor B — melhor preço negociado + qualidade testada + prazo de entrega melhor"></textarea>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        <button class="btn-gold" onclick="saveCotacao()">Salvar cotação</button>
        <button class="btn-sm" onclick="clearCotacao()">Limpar</button>
      </div>
    </div>

    ${(S.cotacoes||[]).filter(c=>!c._arq).length?`<div class="sec">Cotações salvas</div>`+(S.cotacoes||[]).filter(c=>!c._arq).slice().reverse().map(c=>`
      <div class="cot-saved" onclick="loadCotacao('${c.id}')">
        <div style="flex:1">
          <div style="font-size:.88rem;font-weight:700">${esc(c.name||'Sem título')}</div>
          <div style="font-size:.72rem;color:var(--muted);margin-top:3px">${fmtDate(c.date)} · ${c.rows?.length||0} itens
            ${c.escolhido?` · Escolhido: <strong>${esc(c.fornNames?.[c.escolhido]||'Forn. '+c.escolhido)}</strong>`:''}
          </div>
          ${c.motivo?`<div style="font-size:.72rem;color:var(--muted);margin-top:2px;font-style:italic">${esc(c.motivo.slice(0,80))}${c.motivo.length>80?'...':''}</div>`:''}
        </div>
        <button onclick="event.stopPropagation();deleteCotacao('${c.id}')" class="att-del"></button>
      </div>`).join(''):''}
  `;
}

function updCotHdr(id){/* names updated live via input */}
function addCotRow(){cotRows.push(newRow());renderCotacao();}
function removeCotRow(i){cotRows.splice(i,1);if(!cotRows.length)cotRows=[newRow()];renderCotacao();}

function updCotTotals(){
  cotRows.forEach((r,i)=>{
    ['A','B','C'].forEach(f=>{
      const t=cotTotal(r,f);
      const el=document.getElementById('ct'+f+'-'+i);
      if(el)el.textContent=t?fmtBRL(t):'—';
    });
  });
  ['A','B','C'].forEach(f=>{
    const tot=cotRows.reduce((s,r)=>s+cotTotal(r,f),0);
    const el=document.getElementById('tot'+f);
    if(el)el.textContent=tot?fmtBRL(tot):'—';
  });
}

function saveCotacao(){
  if(!S.cotacoes)S.cotacoes=[];
  const name=document.getElementById('cot-name').value.trim()||'Cotação '+todayKey();
  const fA=document.getElementById('fornA')?.value||cotFornA||'Fornecedor A';
  const fB=document.getElementById('fornB')?.value||cotFornB||'Fornecedor B';
  const fC=document.getElementById('fornC')?.value||cotFornC||'Fornecedor C';
  cotFornA=fA;cotFornB=fB;cotFornC=fC;
  S.cotacoes.push({
    id:uid(),name,date:document.getElementById('cot-date').value,
    obs:document.getElementById('cot-obs').value,
    escolhido:document.getElementById('cot-escolhido').value,
    motivo:document.getElementById('cot-motivo').value.trim(),
    fornNames:{A:fA,B:fB,C:fC},
    rows:[...cotRows],
    totA:cotRows.reduce((s,r)=>s+cotTotal(r,'A'),0),
    totB:cotRows.reduce((s,r)=>s+cotTotal(r,'B'),0),
    totC:cotRows.reduce((s,r)=>s+cotTotal(r,'C'),0),
    member:me
  });
  saveLocal();toast('Cotação salva!');renderCotacao();
}

function clearCotacao(){cotRows=[newRow(),newRow(),newRow()];cotFornA='';cotFornB='';cotFornC='';renderCotacao();}

function loadCotacao(id){
  const c=S.cotacoes.find(x=>x.id===id);if(!c)return;
  cotRows=[...c.rows];
  cotFornA=c.fornNames?.A||'';cotFornB=c.fornNames?.B||'';cotFornC=c.fornNames?.C||'';
  renderCotacao();
  // pre-fill escolhido/motivo/obs
  setTimeout(()=>{
    const es=document.getElementById('cot-escolhido');if(es&&c.escolhido)es.value=c.escolhido;
    const mo=document.getElementById('cot-motivo');if(mo)mo.value=c.motivo||'';
    const ob=document.getElementById('cot-obs');if(ob)ob.value=c.obs||'';
    const nm=document.getElementById('cot-name');if(nm)nm.value=c.name||'';
    const dt=document.getElementById('cot-date');if(dt)dt.value=c.date||todayKey();
  },50);
}

function deleteCotacao(id){S.cotacoes=S.cotacoes.filter(x=>x.id!==id);saveLocal();renderCotacao();}
function downloadECHist(mes){
  const sl={pendente:'Pendente',resolvido:'Resolvido','sem-erro':'Nao achou'};
  const rows=S.errosCaixa.filter(e=>e._arq&&e._arqMes===mes).map(e=>({'Data':e.date,'Loja':e.loja,'Titulo':e.titulo,'Tipo':e.tipo,'Valor':e.valor||'','Status':sl[e.status]||e.status,'Obs':e.obs||'','Membro':M[e.member]?.name||e.member||''}));
  downloadCSV(rows,'erros_caixa_'+mes+'.csv');
}
function downloadCotacaoHist(mes){
  const filtrado=(S.cotacoes||[]).filter(c=>c._arq&&c._arqMes===mes);
  const rows=filtrado.map(c=>({'Nome':c.name||'','Data':c.date||'','Fornecedor A':c.fornNames?.A||'','Fornecedor B':c.fornNames?.B||'','Fornecedor C':c.fornNames?.C||'','Escolhido':c.fornNames?.[c.escolhido]||c.escolhido||'','Observacoes':c.obs||'','Motivo':c.motivo||'','Mes Arquivado':c._arqMes||''}));
  downloadCSV(rows,'cotacoes_'+mes+'.csv');
}
function arquivarMesCotacao(){
  const prevMes=prevMonthKey();
  let count=0;
  (S.cotacoes||[]).forEach(c=>{
    if(!c._arq&&c.date&&c.date.startsWith(prevMes)){c._arq=true;c._arqMes=prevMes;count++;}
  });
  if(!count){toast('Nenhuma cotação do mês anterior para arquivar.');return;}
  saveLocal();toast(count+' cotação(ões) arquivada(s)!');renderCotacao();
}

// ══════════════════════════════════════
// FORNECEDORES
// ══════════════════════════════════════
const FORN_CAT={
  importante:  {label:'Importante',    color:'#22c55e', bg:'rgba(34,197,94,.12)',  dot:'#22c55e'},
  em_desenvolv:{label:'Em Desenvolvimento', color:'#f59e0b', bg:'rgba(245,158,11,.12)', dot:'#f59e0b'},
  nao_import:  {label:'Não Importante', color:'#6b7280', bg:'rgba(107,114,128,.12)',dot:'#6b7280'},
};
let _editForn=null;

function renderFornecedores(){
  if(!S.fornecedores)S.fornecedores=[];
  const el=document.getElementById('p-fornecedores');
  const filter=window._fornFilter||'todos';
  const list=filter==='todos'?S.fornecedores:S.fornecedores.filter(f=>f.categoria===filter);
  const tot=S.fornecedores.length;
  const cntImp=S.fornecedores.filter(f=>f.categoria==='importante').length;
  const cntDev=S.fornecedores.filter(f=>f.categoria==='em_desenvolv').length;
  const cntNao=S.fornecedores.filter(f=>f.categoria==='nao_import').length;

  function catBtn(id,label,cnt,color){
    const sel=filter===id;
    return`<button class="ev-type-btn${sel?' sel':''}" onclick="window._fornFilter='${id}';renderFornecedores()"
      style="${sel?`border-color:${color};color:${color};background:${color}18;`:''}">
      ${label}${cnt?` <span style="font-size:.65rem;opacity:.7">(${cnt})</span>`:''}
    </button>`;
  }

  const filterBar=`<div class="forn-filter-bar">
    ${catBtn('todos','Todos',tot,'var(--gold)')}
    ${catBtn('importante','Importantes',cntImp,'#22c55e')}
    ${catBtn('em_desenvolv','Em Desenvolvimento',cntDev,'#f59e0b')}
    ${catBtn('nao_import','Não Importantes',cntNao,'#6b7280')}
  </div>`;

  function starsHtml(n,id,editable){
    let s='';
    for(let i=1;i<=5;i++){
      const filled=i<=n;
      s+=`<span class="forn-star" style="color:${filled?'#f59e0b':'rgba(255,255,255,.15)'}"
        ${editable?`onclick="setFornStar('${id}',${i})"`:''}></span>`;
    }
    return s;
  }

  let cardsHtml='';
  if(!list.length){
    cardsHtml=`<div class="empty"><div class="ei">–</div>
      <p>Nenhum fornecedor ${filter!=='todos'?'nesta categoria':''} ainda.<br>
      <span style="font-size:.75rem;color:var(--muted)">Clique em "+ Novo fornecedor" para começar.</span></p></div>`;
  } else {
    list.forEach(f=>{
      const cat=FORN_CAT[f.categoria]||FORN_CAT.nao_import;
      cardsHtml+=`<div class="forn-card" style="animation:gantt-in .2s ease both">
        <div class="forn-top-bar" style="background:${cat.color}"></div>
        <div class="forn-body">
          <span class="forn-cat-badge" style="background:${cat.bg};color:${cat.color};">
            ${cat.label}
          </span>
          <div class="forn-name">${esc(f.nome)}</div>
          ${f.produto?`<div class="forn-produto">${esc(f.produto)}</div>`:''}
          <div class="forn-stars" title="Qualidade: ${f.qualidade||0}/5 estrelas">
            ${starsHtml(f.qualidade||0,f.id,false)}
            <span style="font-size:.7rem;color:var(--muted);margin-left:5px;align-self:center;">${f.qualidade||0}/5</span>
          </div>
          <div class="forn-stat-row">
            <div class="forn-stat">
              <div class="forn-stat-label">Prazo do pedido</div>
              <div class="forn-stat-value">${f.prazo_pedido?esc(f.prazo_pedido):'—'}</div>
            </div>
            <div class="forn-stat">
              <div class="forn-stat-label">Tempo de entrega</div>
              <div class="forn-stat-value">${f.tempo_entrega?esc(f.tempo_entrega):'—'}</div>
            </div>
          </div>
          ${f.contato?`<div class="forn-contato">${esc(f.contato)}</div>`:''}
          ${f.obs?`<div class="forn-obs">${esc(f.obs)}</div>`:''}
          <div class="forn-actions">
            <button class="btn-ghost btn-sm" onclick="openEditForn('${f.id}')">Editar</button>
            <button class="btn-ghost btn-sm" style="color:var(--red)" onclick="deleteForn('${f.id}')">Excluir</button>
          </div>
        </div>
      </div>`;
    });
  }

  el.innerHTML=`
    <div class="page-head">
      <h2 style="font-family:var(--serif)">Fornecedores</h2>
      <button class="btn-gold" onclick="openNovoForn()">+ Novo fornecedor</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;">
      <div class="card-panel" style="padding:14px 16px;">
        <div style="font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#22c55e;margin-bottom:4px;">Importantes</div>
        <div style="font-size:1.6rem;font-weight:800;letter-spacing:-.05em;">${cntImp}</div>
      </div>
      <div class="card-panel" style="padding:14px 16px;">
        <div style="font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#f59e0b;margin-bottom:4px;">Em Desenvolvimento</div>
        <div style="font-size:1.6rem;font-weight:800;letter-spacing:-.05em;">${cntDev}</div>
      </div>
      <div class="card-panel" style="padding:14px 16px;">
        <div style="font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px;">Não Importantes</div>
        <div style="font-size:1.6rem;font-weight:800;letter-spacing:-.05em;">${cntNao}</div>
      </div>
    </div>
    ${filterBar}
    <div class="forn-grid">${cardsHtml}</div>
  `;
}

function setFornStar(id,n){
  const f=S.fornecedores.find(x=>x.id===id);if(!f)return;
  f.qualidade=n;saveLocal();renderFornecedores();
}

function openNovoForn(){
  _editForn={id:uid(),nome:'',categoria:'importante',produto:'',qualidade:3,prazo_pedido:'',tempo_entrega:'',contato:'',obs:'',created:todayKey()};
  openFornModal();
}
function openEditForn(id){
  const f=S.fornecedores.find(x=>x.id===id);if(!f)return;
  _editForn=JSON.parse(JSON.stringify(f));
  openFornModal();
}
function deleteForn(id){
  if(!confirm('Excluir este fornecedor?'))return;
  S.fornecedores=S.fornecedores.filter(x=>x.id!==id);
  saveLocal();renderFornecedores();toast('Fornecedor excluído.');
}

function openFornModal(){
  const f=_editForn;
  function starOpt(n){return`<span onclick="document.querySelectorAll('.forn-star-opt').forEach((s,i)=>{s.style.color=i<${n}?'#f59e0b':'rgba(255,255,255,.15)'});document.getElementById('forn-qual').value=${n};"
    class="forn-star-opt" style="font-size:1.3rem;cursor:pointer;color:${n<=(f.qualidade||3)?'#f59e0b':'rgba(255,255,255,.15)'};transition:.1s;"></span>`;}

  document.getElementById('modal-body').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div style="font-weight:800;font-size:1rem;">${f.nome?'Editar Fornecedor':'Novo Fornecedor'}</div>
      <button class="btn-ghost btn-sm" onclick="closeModal()"></button>
    </div>
    <div class="form-row"><label>Nome do fornecedor *</label>
      <input class="finput" id="forn-nome" value="${esc(f.nome)}" placeholder="Ex: Frigorífico São João"/></div>
    <div class="form-row"><label>O que fornece</label>

function saveFornecedor(){

  _editForn.nome=nome;
  _editForn.produto=document.getElementById('forn-produto').value.trim();
  _editForn.categoria=document.getElementById('forn-cat').value;
  _editForn.prazo_pedido=document.getElementById('forn-prazo').value.trim();
  _editForn.tempo_entrega=document.getElementById('forn-entrega').value.trim();

function renderCalendar(){

    const pEvs=projEvs.filter(e=>e.date===ds);
    const rEvs=rotEvs.filter(e=>e.date===ds);
    const cEvs=cpEvs.filter(e=>e.date===ds);
    const isToday=ds===todayStr;
    const evHtml=evs.slice(0,2).map(e=>`<div class="cal-ev tipo-${e.tipo}" title="${esc(e.title)}" onclick="event.stopPropagation();openCalEventDetail('${e.id}')">${esc(e.title)}</div>`).join('');
    const pHtml=pEvs.slice(0,2).map(e=>`<div class="cal-proj-chip" style="background:${e.cor}cc;" title="${esc(e.title)}" onclick="event.stopPropagation();window._projFilter='todos';goPanel('projetos')">${esc(e.title)}</div>`).join('');

    // Contas: mostrar número de contas do dia (compacto) se houver alguma
    const cPagas=cEvs.filter(e=>e.pago).length;
    const cHtml=cEvs.length?`<div style="font-size:.58rem;padding:1px 5px;border-radius:4px;background:${cPagas===cEvs.length?'rgba(34,197,94,.18)':'rgba(201,169,110,.15)'};color:${cPagas===cEvs.length?'var(--green)':'var(--gold)'};cursor:pointer;" onclick="event.stopPropagation();openCalDay('${ds}')">${cPagas}/${cEvs.length}</div>`:'';
    const total=evs.length+pEvs.length+rEvs.length+cEvs.length;
    const shown=Math.min(evs.length,2)+Math.min(pEvs.length,2)+Math.min(rEvs.length,2)+(cEvs.length?1:0);
    const more=total>shown?`<div class="cal-more">+${total-shown} mais</div>`:'';

  }
  // fill trailing blank cells
  const total=startDow+lastDay.getDate();

    <div class="sec" style="margin-top:28px">Legenda</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;padding-bottom:8px;">
      ${Object.entries(M).filter(([k])=>k!=='raquel').map(([k,m])=>{
        const rotColor=(S.rotinas?.defs||[]).find(r=>r.assignees?.includes(k))?.color||m.color;
        return`<div style="display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 8px;">
          <div style="width:10px;height:10px;border-radius:50%;background:${rotColor};flex-shrink:0;"></div>
          <div style="font-size:.75rem;font-weight:600;">${m.icon}</div>
          <div style="font-size:.72rem;color:var(--muted);">${m.name.split(' ')[0]}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}

function agOpenDay(ds){

  const pessoais=(S.calendar||[]).filter(e=>e.pessoal&&e.member===me&&e.date===ds);

  const rotEvs=rotCalEvents();
  const myRots=rotEvs.filter(e=>e.date===ds&&e.assignees&&e.assignees.includes(me));
  const pessoaisHtml=pessoais.length?pessoais.map(e=>`

    </div>`).join(''):'';
  const rotsHtml=myRots.length?myRots.map(r=>{
    const done=(S.rotinas?.completions||{})[r.rotId+'_'+ds];
    return`<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:${r.color}11;border:1px solid ${r.color}33;border-radius:10px;margin-bottom:6px;opacity:${done?.7:1};">

  const emptyMsg=!pessoais.length&&!myRots.length?`<div style="text-align:center;padding:20px;font-size:.82rem;color:var(--muted);">Nenhum evento neste dia.</div>`:'';

function openCalDay(ds){

  </div>`;

  if(!hasAny){html+=`<div class="empty" style="padding:24px 0"><div class="ei">–</div><p>Nenhum evento neste dia.</p></div>`;}

  if(rotEvs.length){
    html+=`<div class="sec">Rotinas</div>`;
    rotEvs.forEach(r=>{

      const assigneesList=(r.assignees||[]).map(a=>M[a]?.name.split(' ')[0]||a).join(', ');
      const pk=rot?rotPeriodKey(rot,new Date(ds+'T12:00:00')):null;

      html+=`<div class="camp-card" style="margin-bottom:10px;border-left:3px solid ${r.color};">

          <span style="font-size:1.3rem">${(r.titulo||'').slice(0,2).toUpperCase()||'RT'}</span>
          <div style="flex:1">
            <div style="font-weight:700;font-size:.9rem">${esc(r.title)}</div>
            <div style="font-size:.74rem;color:var(--muted);margin-top:3px;">${freqLabel[r.freq]||r.freq} · ${assigneesList}</div>
          </div>
          ${canComplete&&pk?`<button class="btn-sm" style="border-color:${r.color};color:${r.color}" onclick="closeModal();openCompModal('${r.rotId}','${pk}','${me}')">Registrar</button>`:''}
        </div>
      </div>`;
    });
  }

  if(calEvs.length){
    html+=`<div class="sec">Eventos</div>`;
    calEvs.forEach(e=>{
      const isOwner=e.member===me;
      const author=M[e.member];
      html+=`<div class="camp-card" style="margin-bottom:10px;">
        <div style="display:flex;align-items:flex-start;gap:10px;">
          <div class="cal-ev tipo-${e.tipo}" style="margin:0;flex-shrink:0">${esc(TIPO_LABEL[e.tipo]||e.tipo)}</div>
          <div style="flex:1">
            <div style="font-weight:700;font-size:.9rem">${esc(e.title)}</div>
            ${e.desc?`<div style="font-size:.78rem;color:var(--muted);margin-top:4px;">${esc(e.desc)}</div>`:''}
            <div style="font-size:.7rem;color:var(--muted2);margin-top:6px;">Por ${author?author.name:'?'}</div>
          </div>
          ${isOwner?`<button class="icon-btn" onclick="delCalEvent('${e.id}')" style="color:var(--red)">×</button>`:''}
        </div>
      </div>`;
    });
  }

  if(cEvsCal.length){
    const ymCal=ds.slice(0,7);
    const pagosCal=cEvsCal.filter(e=>isContaPaga(e.contaId,ymCal)).length;
    html+=`<div class="sec">Contas a Pagar (${pagosCal}/${cEvsCal.length} pagas)</div>`;
    cEvsCal.forEach(e=>{
      const pago=isContaPaga(e.contaId,ymCal);
      const pg=getContaPag(e.contaId,ymCal);
      html+=`<div style="display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.05);">
        <button onclick="marcarContaPaga('${e.contaId}','${ymCal}')"
          style="width:26px;height:26px;border-radius:50%;border:2px solid ${pago?'var(--green)':'rgba(255,255,255,.18)'};background:${pago?'var(--green)':'transparent'};color:${pago?'#fff':'var(--muted)'};font-size:.75rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;">
          ${pago?'':'○'}
        </button>
        <div style="flex:1;min-width:0;">
          <div style="font-size:.85rem;font-weight:${pago?400:600};${pago?'text-decoration:line-through;opacity:.5':''};">${esc(e.title)}</div>
          <div style="font-size:.62rem;color:${e.cor};margin-top:1px;">${e.loja}${pago&&pg?` · ${M[pg.by]?.name||pg.by} ${pg.at}`:''}</div>
        </div>
        <button class="btn-sm" onclick="closeModal();window._cpLoja='${e.lojaId}';goPanel('contas')" style="font-size:.65rem">Ver loja</button>
      </div>`;
    });
  }

  if(projEvs.length){
    html+=`<div class="sec">Projetos</div>`;
    projEvs.forEach(e=>{
      html+=`<div class="camp-card" style="margin-bottom:10px;border-left:3px solid ${e.cor};">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:10px;height:10px;border-radius:50%;background:${e.cor};flex-shrink:0;"></div>
          <div style="font-size:.88rem;font-weight:600;flex:1">${esc(e.title)}</div>
          <button class="btn-sm" onclick="closeModal();goPanel('projetos')">Ver</button>
        </div>
      </div>`;
    });
  }

  document.getElementById('modal-body').innerHTML=html;
  openModal();
}
function openCalEventDetail(id){
  const e=(S.calendar||[]).find(x=>x.id===id);
  if(!e){return;}
  const isOwner=e.member===me;
  const author=M[e.member];
  document.getElementById('modal-body').innerHTML=`
    <div style="margin-bottom:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
      <div>
        <div class="cal-ev tipo-${e.tipo}" style="display:inline-block;margin:0 0 8px">${esc(TIPO_LABEL[e.tipo]||e.tipo)}</div>

function delCalEvent(id){S.calendar=S.calendar.filter(e=>e.id!==id);saveLocal();renderCalendar();toast('Evento removido.');}
function openAddEvent(ds){
  const isL=M[me]?.isLeader;
  const tipos=TIPOS_EV.map(t=>`<button class="ev-type-btn${newEvTipo===t?' sel':''}" onclick="setEvTipo('${t}')" id="et-${t}">${TIPO_LABEL[t]||t}</button>`).join('');
  const membSel=isL?`<div class="form-row"><label>Para quem</label>
    <select id="ev-assignedTo" class="finput">
      <option value="">— Para mim —</option>
      ${Object.entries(M).filter(([k,v])=>v&&v.name&&k!==me).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}
    </select></div>`:'';
  document.getElementById('modal-body').innerHTML=`
    <h3 style="margin-bottom:16px">Novo evento</h3>
    <div class="form-row"><label>Título</label><input id="ev-title" class="finput" placeholder="Ex: Reels do prato novo"></div>
    <div class="form-row"><label>Data</label><input id="ev-date" class="finput" type="date" value="${ds||todayKey()}"></div>
    <div class="form-row"><label>Tipo</label><div class="ev-type-row" id="ev-type-row">${tipos}</div></div>
    ${membSel}
    <div class="form-row"><label>Descrição (opcional)</label><textarea id="ev-desc" class="finput" rows="2" placeholder="Detalhes..."></textarea></div>
    <div style="display:flex;gap:10px;margin-top:16px"><button class="btn-gold" onclick="saveCalEvent()">Salvar</button><button class="btn-sm" onclick="closeModal()">Cancelar</button></div>
  `;

}
function setEvTipo(t){
  newEvTipo=t;
  TIPOS_EV.forEach(x=>{const b=document.getElementById('et-'+x);if(b){b.classList.toggle('sel',x===t);}});
}
function saveCalEvent(){
  const title=document.getElementById('ev-title').value.trim();
  const date=document.getElementById('ev-date').value;
  const desc=document.getElementById('ev-desc').value.trim();
  if(!title||!date){toast('Preencha título e data.');return;}
  if(!S.calendar)S.calendar=[];
  const assignedTo=document.getElementById('ev-assignedTo')?.value||'';
  // member = creator; assignedTo = who sees it in rotinas (blank = creator)
  S.calendar.push({id:uid(),member:me,assignedTo:assignedTo||me,title,date,tipo:newEvTipo,desc});
  saveLocal();closeModal();renderCalendar();toast('Evento salvo!');
}

function renderCampanhas(){
  if(!S.campanhas)S.campanhas=[];
  const isLdr=M[me]?.isLeader||false;
  const lista=isLdr?S.campanhas:S.campanhas.filter(c=>c.member===me);
  const el=document.getElementById('p-campanhas');
  // Agrupa por membro quando líder
  const STATUS_LABEL={estruturacao:'Em Estruturação',ativa:'Ativa',pausada:'Pausada',encerrada:'Encerrada'};
  const STATUS_COLOR={estruturacao:'#a78bfa',ativa:'var(--green)',pausada:'var(--gold)',encerrada:'var(--muted)'};
  const renderCard=c=>{
    const invs=Array.isArray(c.investimentos)?c.investimentos:(c.investimento?[{tipo:'Investimento',valor:c.investimento,fornecedor:''}]:[]);
    const totalInv=invs.reduce((s,i)=>{const n=parseFloat((i.valor||'').replace(/[^0-9,.]/g,'').replace(',','.'))||0;return s+n;},0);
    const dateRange=(c.dataInicio||c.dataFim)?`<span style="font-size:.68rem;color:var(--muted);margin-left:8px;">${c.dataInicio?new Date(c.dataInicio+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}):'?'} → ${c.dataFim?new Date(c.dataFim+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}):'em aberto'}</span>`:'';
    return`<div class="camp-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <div style="flex:1;min-width:0;">
          ${isLdr&&c.member&&M[c.member]?`<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;"><div style="width:20px;height:20px;border-radius:5px;background:${M[c.member].color}22;display:grid;place-items:center;font-size:.58rem;font-weight:800;color:${M[c.member].color};">${M[c.member].icon}</div><span style="font-size:.65rem;color:var(--muted);">${esc(M[c.member].name)}</span></div>`:''}
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
            <span style="font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:999px;background:${STATUS_COLOR[c.status]||'var(--muted)'}20;color:${STATUS_COLOR[c.status]||'var(--muted)'};">${STATUS_LABEL[c.status]||c.status}</span>
            ${dateRange}
          </div>
          <div style="font-size:1rem;font-weight:700;margin-bottom:3px;">${esc(c.nome)}</div>
          ${c.objetivo?`<div class="small" style="margin-bottom:8px;">${esc(c.objetivo)}</div>`:''}
        </div>
        <div style="display:flex;gap:4px;flex-shrink:0;">
          ${c.member===me||isLdr?`<button class="icon-btn" title="Editar" onclick="openNovaCampanha('${c.id}')"></button>`:''}
          ${c.member===me||isLdr?`<button class="icon-btn" onclick="delCampanha('${c.id}')">×</button>`:''}
        </div>
      </div>
      ${invs.length?`<div style="margin:8px 0 4px;border-top:1px solid var(--line);padding-top:8px;">
        <div style="font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;">Investimentos${totalInv>0?` · <span style="color:var(--gold)">Total: R$ ${totalInv.toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>`:''}</div>
        ${invs.map(i=>`<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:.78rem;">
          <span style="flex:1;font-weight:600;">${esc(i.tipo||'—')}</span>
          <span style="color:var(--gold);font-weight:700;">${esc(i.valor||'—')}</span>
          ${i.fornecedor?`<span style="color:var(--muted);font-size:.7rem;">· ${esc(i.fornecedor)}</span>`:''}
        </div>`).join('')}
      </div>`:''}
      <div class="camp-grid" style="margin-top:8px;">
        ${c.publico?`<div class="camp-kpi"><span>Público-alvo</span><b>${esc(c.publico)}</b></div>`:''}
        ${c.resultado?`<div class="camp-kpi"><span>Resultado / KPI</span><b>${esc(c.resultado)}</b></div>`:''}
      </div>
      ${c.obs?`<div class="small" style="margin-top:8px;color:var(--muted)">${esc(c.obs)}</div>`:''}
    </div>`;
  };
  el.innerHTML=`
    <div class="page-head"><h2>Campanhas</h2><button class="btn-gold" onclick="openNovaCampanha()">+ Nova campanha</button></div>
    ${lista.length===0?'<div class="empty-state">Nenhuma campanha cadastrada ainda.</div>':lista.map(c=>renderCard(c)).join('')}
  `;
}
function _campInvHtml(){
  const rows=(window._campInvs||[]).map((inv,i)=>`
    <div style="display:grid;grid-template-columns:1fr 90px 1fr auto;gap:6px;align-items:center;margin-bottom:6px;" id="cinv-row-${i}">
      <input class="finput" placeholder="Tipo (ex: Tráfego pago)" value="${esc(inv.tipo||'')}" oninput="window._campInvs[${i}].tipo=this.value" style="font-size:.8rem;">
      <input class="finput" placeholder="R$" value="${esc(inv.valor||'')}" oninput="window._campInvs[${i}].valor=this.value" style="font-size:.8rem;text-align:right;">
      <input class="finput" placeholder="Fornecedor" value="${esc(inv.fornecedor||'')}" oninput="window._campInvs[${i}].fornecedor=this.value" style="font-size:.8rem;">
      <button onclick="window._campInvs.splice(${i},1);document.getElementById('cinv-list').innerHTML=_campInvHtml();" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0 4px;"></button>
    </div>`).join('');
  return rows||'<div style="font-size:.72rem;color:var(--muted);padding:4px 0;">Nenhum investimento adicionado.</div>';
}

      <label style="display:flex;align-items:center;justify-content:space-between;">

        <button onclick="window._campInvs.push({tipo:'',valor:'',fornecedor:''});document.getElementById('cinv-list').innerHTML=_campInvHtml();" class="btn-sm" style="font-size:.7rem;">+ Adicionar</button>
      </label>
      <div style="background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:4px;">

          <span style="font-size:.6rem;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;">Tipo</span>
          <span style="font-size:.6rem;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;">Valor</span>
          <span style="font-size:.6rem;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;">Fornecedor</span>

        <div id="cinv-list">${_campInvHtml()}</div>

    </div>

    <div class="form-row"><label>Observações</label><textarea id="cn-obs" class="finput" rows="2">${esc(c.obs||'')}</textarea></div>
    <div style="display:flex;gap:10px;margin-top:16px"><button class="btn-gold" onclick="saveCampanha('${editId||''}')">Salvar</button><button class="btn-sm" onclick="closeModal()">Cancelar</button></div>
  `;
  openModal();
}
function saveCampanha(editId){
  const nome=document.getElementById('cn-nome').value.trim();
  if(!nome){toast('Informe o nome da campanha.');return;}
  if(!S.campanhas)S.campanhas=[];
  const data={
    nome,
    objetivo:document.getElementById('cn-obj').value.trim(),
    status:document.getElementById('cn-status').value,
    dataInicio:document.getElementById('cn-inicio').value||'',
    dataFim:document.getElementById('cn-fim').value||'',
    investimentos:(window._campInvs||[]).filter(i=>i.tipo||i.valor),
    publico:document.getElementById('cn-pub').value.trim(),
    resultado:document.getElementById('cn-res').value.trim(),
    obs:document.getElementById('cn-obs').value.trim(),
  };
  if(editId){
    const idx=S.campanhas.findIndex(c=>c.id===editId);
    if(idx>=0)S.campanhas[idx]={...S.campanhas[idx],...data};
  } else {
    S.campanhas.push({id:uid(),member:me,date:todayKey(),...data});
  }
  saveLocal();closeModal();renderCampanhas();toast('Campanha salva!');
}
function delCampanha(id){S.campanhas=S.campanhas.filter(c=>c.id!==id);saveLocal();renderCampanhas();toast('Campanha removida.');}
